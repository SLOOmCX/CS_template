<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>올릿 CX 응대 템플릿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#234A86; --primary-bg:#F4F8FD;
    --secondary:#9b6829; --secondary-bg:#faf5ea;
    --info:#DCE8F7;
    --title:#0d253d; --text:#273951; --subtext:#64748d;
    /* 기존 변수명 → 신규 팔레트 매핑 (DESIGN.md 기준) */
    --trust-blue:#234A86;
    --trust-blue-2:#1B3A68;
    --trust-blue-press:#15294a;
    --vanilla:#f5e9d4;
    --beige:#e8dcc3;
    --skyblue:#C7DAF2;
    --peanut:#9b6829;
    --skyblue-soft:#F4F8FD;
    --vanilla-soft:#faf5ea;
    --beige-soft:#faf5ea;
    --line:#e3e8ee;
    --ink:#0d253d;
    --ink-soft:#64748d;
    --white:#ffffff;
    --bg:#ffffff;
    /* DESIGN.md 신규 토큰 : 라운드 / 그림자 / 폰트 */
    --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-pill:9999px;
    /* 여백 체계 (2026-08 정리) */
    --space-section-major:44px; --space-section:32px; --space-title-content:14px;
    --space-content:12px; --space-compact:8px; --space-grid:14px;
    --shadow-1:0 1px 3px rgba(0,55,112,.08);
    --shadow-2:0 8px 24px rgba(0,55,112,.08), 0 2px 6px rgba(0,55,112,.04);
    --font-ui:'Inter','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font-ui);
    font-feature-settings:"ss01","tnum";
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;height:calc(100vh / 1.1);overflow:hidden;-webkit-font-smoothing:antialiased;zoom:1.1;
  }

  /* ── 0) 상단 가로 헤더 ── */
  .appbar{
    height:58px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px;
    z-index:20;box-shadow:0 1px 0 rgba(0,55,112,.04), 0 2px 10px rgba(0,55,112,.03);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .logo-txt{font-size:23px;font-weight:800;color:var(--trust-blue);letter-spacing:-.5px;}
  .brand .app-title{font-size:15px;font-weight:700;color:var(--ink);padding-left:14px;border-left:1px solid var(--line);}
  .brand .beta{font-size:10px;font-weight:800;color:var(--trust-blue);background:var(--skyblue-soft);
    border:1px solid #d6d3fb;padding:2px 9px;border-radius:var(--radius-pill);letter-spacing:.5px;}
  .appbar-search{
    display:flex;align-items:center;gap:8px;background:#F3F5F7;border:1px solid var(--line);
    border-radius:24px;padding:9px 16px;width:400px;max-width:42vw;flex-shrink:0;transition:.15s;
  }
  .appbar-search:focus-within{border-color:var(--skyblue);box-shadow:0 0 0 3px var(--skyblue-soft);background:#fff;}
  .appbar-search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink);}
  .appbar-right{display:flex;align-items:center;gap:14px;}
  .user-bar{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .ub-email{font-size:13px;color:var(--ink-soft);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ub-btn{font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 12px;cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap;}
  .ub-btn:hover{border-color:var(--skyblue);color:var(--trust-blue);background:var(--skyblue-soft);}
  /* 북마크 UI */
  .bm-star{background:none;border:none;cursor:pointer;font-size:15px;color:#c9ccd1;padding:0 5px;margin-left:14px;line-height:1;transition:.12s;}
  .bm-star:hover,.bm-star.on{color:#f5b800;}
  .page-star{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;flex-shrink:0;transition:.12s;}
  .page-star.on{color:#e0a800;border-color:#f3d68a;background:#fffaf0;}
  .page-star:hover{border-color:#f3d68a;}
  .bm-page{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:8px;cursor:pointer;font-size:13px;color:var(--ink);background:#fff;transition:.12s;}
  .bm-page:hover{border-color:var(--skyblue);background:var(--skyblue-soft);}
  .bm-page .bm-star{cursor:default;}
  .bm-del{background:none;border:none;color:#c9ccd1;cursor:pointer;font-size:13px;margin-left:auto;padding:2px 7px;border-radius:var(--radius-sm);}
  .bm-del:hover{color:#e5484d;background:#fdeaea;}
  .bm-empty{padding:14px 16px;color:var(--ink-soft);font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:var(--radius-md);margin-bottom:8px;}
  .body-row{flex:1;display:flex;overflow:hidden;}

  /* ── 1) 아이콘 레일 ── */
  .rail{
    width:54px;background:#F7FAFB;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;
    padding:14px 0;gap:6px;flex-shrink:0;
  }
  .rail-btn{
    width:42px;height:42px;border-radius:var(--radius-lg);border:none;cursor:pointer;
    background:transparent;color:#64748d;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;position:relative;
  }
  .rail-btn:hover{background:#EDF1F8;color:var(--primary);}
  .rail-btn.active{background:var(--primary);color:#fff;}
  .rail-div{width:26px;height:1px;background:rgba(0,0,0,.08);margin:8px 0;}
  .rail-cap{font-size:8px;color:#9aa2ad;font-weight:700;letter-spacing:.3px;margin:2px 0;}

  /* ── 2) 2차 트리 메뉴 ── */
  .sidebar{
    width:248px;min-width:160px;max-width:520px;background:var(--white);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0;
  }
  /* 사이드바 너비 조절 핸들 */
  .resizer{
    width:6px;flex-shrink:0;cursor:col-resize;background:transparent;
    position:relative;z-index:5;margin-left:-3px;
  }
  .resizer::before{
    content:"";position:absolute;left:2px;top:0;bottom:0;width:2px;background:transparent;transition:.15s;
  }
  .resizer:hover::before,.resizer.dragging::before{background:var(--skyblue);}
  body.col-resizing{cursor:col-resize;user-select:none;}
  body.col-resizing .content{pointer-events:none;}
  .sidebar-head{
    padding:18px 18px 12px;border-bottom:1px solid var(--line);
  }
  .sidebar-head h2{font-size:16px;color:var(--trust-blue);font-weight:800;}
  .sidebar-head p{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .search{
    margin:12px 14px 4px;display:flex;align-items:center;gap:6px;
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);padding:8px 10px;
  }
  .search input{border:none;background:transparent;outline:none;font-size:12px;width:100%;color:var(--ink);}
  .tree{flex:1;overflow-y:auto;padding:8px 8px 20px;}
  .tree::-webkit-scrollbar{width:6px;}
  .tree::-webkit-scrollbar-thumb{background:#d5dae2;border-radius:3px;}

  .group-label{
    font-size:10px;font-weight:700;color:var(--peanut);letter-spacing:.5px;
    padding:12px 12px 6px;text-transform:uppercase;
  }
  .node{user-select:none;}
  .node-toggle{
    display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
    cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);transition:.12s;
  }
  .node-toggle:hover{background:var(--skyblue-soft);}
  .node-toggle .arrow{font-size:10px;color:var(--ink-soft);transition:.2s;width:10px;}
  .node.open>.node-toggle .arrow{transform:rotate(90deg);}
  .node-children{display:none;margin-left:15px;padding-left:6px;border-left:1px solid #e9ecf1;}
  .node.open>.node-children{display:block;}
  .leaf{
    display:flex;align-items:center;gap:7px;padding:8px 12px 8px 20px;border-radius:9px;
    cursor:pointer;font-size:12.5px;color:var(--ink-soft);transition:.12s;
  }
  .leaf:hover{background:var(--skyblue-soft);color:var(--ink);}
  .leaf.active{background:var(--skyblue);color:var(--trust-blue);font-weight:700;}
  .leaf .dot{width:5px;height:5px;border-radius:50%;background:var(--peanut);flex-shrink:0;}
  .leaf.active .dot{background:var(--trust-blue);}
  .divider{height:1px;background:var(--line);margin:10px 14px;}
  .tree-divider{border-top:1px dashed #c3cad4;margin:10px 16px 6px;}

  /* ── 3) 콘텐츠 ── */
  .content{flex:1;overflow-y:auto;padding:0;}
  .content::-webkit-scrollbar{width:9px;}
  .content::-webkit-scrollbar-thumb{background:#d5dae2;border-radius:4px;}
  .topbar{
    position:sticky;top:0;z-index:5;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    padding:14px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .back-btn{border:1px solid var(--line);background:#fff;color:var(--trust-blue);font-size:12px;font-weight:700;padding:5px 12px;border-radius:var(--radius-md);cursor:pointer;transition:.12s;flex-shrink:0;}
  .back-btn:hover{background:var(--skyblue);}
  .crumb{font-size:12px;color:var(--ink-soft);}
  .crumb b{color:var(--title);}
  /* 우측 상단 검색 */
  .topbar-search{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:24px;padding:9px 16px;width:340px;flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,55,112,.05);transition:.15s;
  }
  .topbar-search:focus-within{border-color:var(--skyblue);box-shadow:0 0 0 3px var(--skyblue-soft);}
  .topbar-search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink);}
  /* 검색 결과 */
  .sr-title{font-size:23px;font-weight:800;color:var(--title);margin-bottom:3px;}
  .sr-title span{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .sr-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
  .sr-item{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px 18px;
    margin-bottom:12px;cursor:pointer;transition:.12s;
  }
  .sr-item:hover{border-color:var(--skyblue);box-shadow:0 2px 12px rgba(0,55,112,.08);}
  .sr-path{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:7px;}
  .sr-path b{color:var(--trust-blue);font-weight:800;}
  .sr-snip{font-size:13.5px;color:var(--ink);line-height:1.6;}
  .sr-tag{color:var(--trust-blue);font-weight:800;}
  .sr-snip mark{background:var(--skyblue);color:var(--trust-blue);padding:0 3px;border-radius:3px;}
  .sr-none{text-align:center;padding:70px 20px;color:var(--ink-soft);font-size:14px;}
  .page{padding:32px 32px 88px;max-width:1200px;}
  .page h1{
    font-size:26px;color:var(--title);font-weight:800;margin-bottom:4px;
    display:flex;align-items:center;gap:10px;
  }
  .page .sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

  /* 챕터(단계 내 구간) */
  .chapter{margin:0 0 34px;}

  /* 📌 참고사항 (내부용) — 연회색 틴트로 템플릿(화이트)과 구분 */
  .guide-card{
    background:var(--vanilla-soft);border:1px solid #e8dcc3;
    border-radius:var(--radius-lg);padding:16px 20px;margin:0 0 var(--space-content);box-shadow:none;
  }
  .note-tight{margin:0 0 var(--space-content);}
  .guide-head{
    font-weight:800;color:var(--ink);font-size:14px;margin-bottom:9px;
    display:flex;align-items:center;gap:8px;
  }
  .badge-int{font-size:10px;background:var(--ink-soft);color:#fff;padding:2px 8px;border-radius:var(--radius-pill);font-weight:700;letter-spacing:.3px;}
  .guide-body{font-size:12px;line-height:1.8;color:#5c4a38;white-space:pre-line;}
  .sub-ex{font-size:12px;color:#9b6829;margin:2px 0 12px;line-height:1.5;}
  .flow-diagram{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:16px 0;}
  .fd-box{flex:1 1 130px;min-width:118px;background:#fff;border:1.5px solid var(--trust-blue);border-radius:var(--radius-md);padding:12px 10px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.4;}
  .fd-arrow{display:flex;align-items:center;justify-content:center;color:var(--trust-blue);font-weight:800;flex:0 0 auto;font-size:14px;}
  .fork{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:6px 0 16px;padding:12px 0 4px 18px;border-left:3px dashed var(--trust-blue);}
  @media(max-width:820px){.fork{grid-template-columns:1fr;}}
  .fork-label{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--trust-blue);padding:3px 12px;border-radius:var(--radius-pill);margin-bottom:8px;}
  .fork-branch.b2 .fork-label{background:#9b6829;}
  .fork.fork-split{border-left:none;padding:12px 0 4px 0;gap:0;}
  .fork.fork-split .fork-branch{padding:0 20px;}
  .fork.fork-split .fork-branch:first-child{border-right:2px dashed var(--trust-blue);}
  .fork .flow-diagram{margin:0;}
  .fork-label-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .fork-label-row .fork-label{margin-bottom:0;flex:none;}
  .fork-label-line{flex:1;border-top:2px dashed var(--trust-blue);height:0;margin-top:1px;}
  .fork-branch.b2 .fork-label-line{border-top-color:#9b6829;}
  .fork-label-desc{flex:none;font-size:12px;font-weight:700;color:var(--trust-blue);white-space:nowrap;}
  .fork-branch.b2 .fork-label-desc{color:#9b6829;}
  .free-flow-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:var(--radius-pill);margin-bottom:6px;}
  .free-flow-tag.principle{background:var(--trust-blue);color:#fff;}
  .free-flow-tag.exception{background:#f1f5f9;color:#64748b;border:1px solid var(--line);}
  .free-flow-box{background:var(--skyblue-soft);border:1.5px solid var(--trust-blue);border-radius:var(--radius-md);padding:12px 10px;font-size:12.5px;font-weight:800;text-align:center;color:var(--trust-blue);}
  .free-flow-box.exception{background:#fff;border:1.5px dashed #94a3b8;color:#475569;font-weight:700;}
  .free-flow-connector{text-align:center;font-size:11px;color:#8a94a6;margin:8px 0;}
  .quote-box{border-left:4px solid var(--trust-blue);background:#f5f8fc;padding:12px 16px 12px 18px;margin:0 0 var(--space-content);font-size:12px;line-height:1.75;color:var(--ink);border-radius:0 10px 10px 0;white-space:pre-line;}
  .quote-box b{color:var(--trust-blue);font-weight:800;}
  .quote-box a.jump-link,.astbl a.jump-link,.guide-body a.jump-link,.star-body a.jump-link{color:var(--trust-blue);font-weight:700;text-decoration:underline;cursor:pointer;}
.auto-link{color:var(--trust-blue);text-decoration:underline;word-break:break-all;}
  .dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:26px 0;}
  .dash-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-xl);padding:26px 22px;cursor:pointer;transition:.15s;}
  .dash-card:hover{border-color:var(--trust-blue);box-shadow:0 6px 18px rgba(0,55,112,.10);transform:translateY(-2px);}
  .dash-ico{font-size:30px;line-height:1;}
  .dash-card h3{margin:14px 0 9px;font-size:16px;color:var(--trust-blue);font-weight:800;}
  .dash-card p{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink-soft);}
  .dash-go{margin-top:16px;font-size:12px;font-weight:700;color:var(--trust-blue);}
  @media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}
  .v2-nest{margin:2px 0 16px 18px;border-left:3px solid #e6ebf3;padding-left:14px;}
  .warn-note{background:#ffe9a8;border:1px solid #f0cf6b;border-left:4px solid #e0a800;border-radius:var(--radius-md);padding:11px 16px;margin:0 0 var(--space-content);font-size:12px;font-weight:700;color:#6b4a1a;line-height:1.6;white-space:pre-line;}
  .branch-box{background:#fff;border:1px solid var(--line);border-left:4px solid var(--trust-blue);border-radius:var(--radius-lg);padding:15px 18px;margin:0 0 var(--space-content);}
  .branch-h{font-weight:800;color:var(--trust-blue);font-size:13.5px;margin-bottom:12px;}
  .branch-tbl{border-collapse:separate;border-spacing:0 7px;font-size:12.5px;}
  .branch-tbl td{padding:3px 0;vertical-align:middle;color:var(--ink);}
  .branch-tbl td.cond{font-weight:600;}
  .branch-tbl td.ar{padding:0 14px;color:var(--ink-soft);font-weight:800;}
  .bdg{display:inline-block;padding:3px 13px;border-radius:var(--radius-pill);font-weight:800;font-size:12.5px;white-space:nowrap;}
  .b-blue{background:#e5efff;color:#1e3a5f;}
  .b-amber{background:#fff2cc;color:#6b4a1a;}
  .b-pink{background:#ffe3ea;color:#ea2261;}
  .branch-note{margin-top:11px;font-size:12px;color:#6b4a1a;background:#fff8e6;border:1px solid #f0e2b8;border-radius:var(--radius-md);padding:8px 11px;line-height:1.5;}
  .alert-red{background:#ffe3ea;border:1px solid #f3b4c2;border-left:4px solid #9b6829;border-radius:var(--radius-md);padding:11px 16px;margin:12px 0;font-size:12px;font-weight:800;color:#ea2261;line-height:1.6;}
  .guide-body ul{list-style:none;}
  .guide-body li{position:relative;padding-left:18px;margin:5px 0;}
  .guide-body li:before{content:"→";position:absolute;left:0;color:var(--ink-soft);font-weight:700;}
  .guide-body a{color:var(--trust-blue);font-weight:700;}
  .leaf-secgrp{font-weight:800;color:var(--ink);padding:5px 10px;margin:3px 0;}
  .leaf-sec{padding-left:24px;}
  .leaf-sub{padding-left:42px;font-size:12px;color:var(--ink-soft);}
  .sec-children{display:none;}
  .sec-parent.open>.sec-children{display:block;}
  .sec-parent-h{cursor:pointer;}
  .sec-caret{display:inline-block;width:12px;font-size:9px;color:var(--ink-soft);transition:transform .15s;margin-right:1px;}
  .sec-parent.open>.sec-parent-h .sec-caret{transform:rotate(90deg);}
  .grp-h{font-weight:800;color:var(--ink);font-size:15px;margin:var(--space-section) 0 var(--space-title-content);scroll-margin-top:70px;}
  .grp-h.grp-major{font-size:16.5px;color:var(--title);margin:var(--space-section) 0 var(--space-title-content);padding-bottom:8px;border-bottom:1px solid var(--line);}
  .grp-h.grp-sub{font-size:13.5px;color:var(--peanut);margin:var(--space-section) 0 var(--space-title-content);}

  /* 카드 그리드 */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-grid);margin-bottom:var(--space-content);}
  .stack{display:flex;flex-direction:column;gap:var(--space-content);margin-bottom:var(--space-content);}
  /* .subcard/.col-card 기본 하단 마진(단독 사용 시 다음 요소와 붙는 버그 방지) — grid2/stack/col-body/flowgroup 안에서는 gap이 간격을 담당하므로 중복 방지를 위해 0으로 상쇄 */
  .grid2>.subcard,.grid2>.col-card,.stack>.subcard,.stack>.col-card,.col-body>.subcard,.flowgroup>.subcard{margin-bottom:0;}
  @media(max-width:820px){.grid2{grid-template-columns:1fr;}}

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    overflow:hidden;box-shadow:0 1px 3px rgba(0,55,112,.04);
  }
  .card-head{
    padding:11px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;
  }
  .card-head.ok{background:var(--skyblue-soft);color:var(--trust-blue);}
  .card-head.no{background:var(--beige-soft);color:#6b4a1a;}
  .card-head.blue{background:var(--skyblue);color:var(--trust-blue);}
  .card-head.pink{background:var(--vanilla);color:#6b4a1a;}
  .card-body{padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--ink);}
  .card-body ul{list-style:none;}
  .card-body li{position:relative;padding-left:16px;margin:5px 0;}
  .card-body li:before{content:"·";position:absolute;left:4px;color:var(--peanut);font-weight:700;}
  .card-body .warn{color:#b5641e;font-weight:600;}
  .card-body .kv{display:flex;gap:6px;margin:4px 0;}
  .card-body .kv b{color:var(--trust-blue);min-width:78px;flex-shrink:0;}

  /* 응대 flow 스텝 */
  .flow-step{
    display:flex;gap:10px;align-items:center;margin:10px 0;font-weight:700;
    font-size:14px;color:var(--trust-blue);
  }
  .flow-num{
    width:24px;height:24px;border-radius:var(--radius-sm);background:var(--trust-blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
  }

  /* 템플릿(매크로) 카드 */
  .macro{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    margin:0 0 var(--space-content);overflow:hidden;box-shadow:0 1px 2px rgba(0,55,112,.03);
    transition:box-shadow .16s ease, border-color .16s ease;
  }
  .macro:hover{box-shadow:0 8px 22px rgba(0,55,112,.07);border-color:#dbe3ef;}
  .macro-head{
    display:flex;align-items:center;gap:8px;padding:14px 20px;background:#fff;
    border-bottom:1px solid var(--line);
  }
  .macro-head.plain{background:#F2F5F9;}
  .macro-head.plain .mname{color:var(--trust-blue);font-weight:800;}
  .macro-head .gdot{width:10px;height:10px;border-radius:50%;background:#234A86;flex-shrink:0;}
  .macro-head .mname{font-weight:700;font-size:13.5px;color:var(--ink);}
  .macro-head .tag{
    font-size:11px;color:var(--trust-blue);background:var(--skyblue-soft);
    padding:2px 8px;border-radius:var(--radius-pill);font-weight:600;
  }
  .macro-head .spacer{flex:1;}
  .copy-btn{
    border:none;background:transparent;color:inherit;
    font-size:15px;padding:2px 5px;border-radius:var(--radius-sm);cursor:pointer;line-height:1;
    transition:.12s;display:flex;align-items:center;justify-content:center;opacity:.7;
  }
  .copy-btn:hover{opacity:1;background:rgba(0,0,0,.06);}
  .copy-btn.done{opacity:1;color:#234A86;font-weight:800;}
  .no-copy .copy-btn{display:none !important;}
  .macro-head .mname:empty{display:none;}
  .macro:has(.mname:empty){position:relative;}
  .macro:has(.mname:empty) .macro-head{position:absolute;top:0;right:0;padding:8px 10px;background:transparent;border-bottom:none;z-index:2;}
  .macro:has(.mname:empty) .macro-head .gdot{display:none;}
  .macro:has(.mname:empty) .sc-desc{margin-top:38px;margin-right:46px;}
  .macro:has(.mname:empty) .macro-body{padding-top:42px;}
  .cmp-ment{position:relative;text-align:left !important;padding:12px 78px 12px 14px !important;vertical-align:top;}
  .cmp-ment .tag{
    display:inline-block;font-size:11px;color:var(--trust-blue);background:var(--skyblue-soft);
    padding:2px 8px;border-radius:var(--radius-pill);font-weight:600;
  }
  .cmp-ment-body{white-space:pre-line;line-height:1.7;font-size:12.5px;color:var(--ink);margin-top:14px;}
  .cmp-ment .copy-btn{position:absolute;top:8px;right:46px;color:var(--ink-soft);}
  .cmp-ment .bm-star{position:absolute;top:8px;right:12px;padding:0;margin:0;}
  .macro-body{
    padding:20px;font-size:12.5px;line-height:1.8;color:var(--ink);white-space:pre-wrap;
  }

  .hint{
    background:var(--skyblue-soft);border:1px solid #d6d3fb;border-radius:var(--radius-lg);
    padding:12px 16px;font-size:12px;color:var(--trust-blue);line-height:1.6;margin:16px 0;
  }
  .hint b{font-weight:800;}
  .empty{
    text-align:center;padding:80px 20px;color:var(--ink-soft);
  }
  .empty .big{font-size:40px;margin-bottom:12px;}

  /* 상담 플로우 요약 (강조 색상) */
  .flow-box{background:var(--skyblue-soft);border:1px solid var(--skyblue);border-radius:var(--radius-lg);padding:15px 20px;margin-bottom:0;}
  .flow-box-h{font-weight:800;color:var(--trust-blue);font-size:13.5px;margin-bottom:8px;}
  .flow-ol{margin:0;padding-left:0;list-style:none;color:var(--trust-blue);font-size:13.5px;line-height:1.85;}
  .flow-ol>li{font-weight:700;}
  .flow-sub{padding-left:18px;color:var(--ink-soft);font-weight:400;font-size:12px;line-height:1.6;}
  /* 유의사항 (색상 없이 테두리로만 구분) */
  .notice-box{background:#ffffff;border:1px solid var(--line);border-left:3px solid var(--secondary);border-radius:var(--radius-lg);padding:18px 22px;margin:0 0 var(--space-content);}
  .notice-h{font-weight:800;color:var(--secondary);font-size:13.5px;margin-bottom:10px;}
  .notice-box ul{list-style:none;}
  .notice-box li{position:relative;padding-left:15px;margin:var(--space-compact) 0;font-size:12px;color:var(--ink);line-height:1.7;}
  .notice-box li:before{content:"•";position:absolute;left:2px;color:var(--ink-soft);}
  .notice-box b{color:var(--ink);}
  .notice-box a{color:var(--trust-blue);font-weight:700;text-decoration:underline;}
  .pre{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--ink);}
  /* 번호 섹션 */
  .sec-title{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;color:var(--title);margin:var(--space-section-major) 0 var(--space-title-content);padding-bottom:11px;border-bottom:1px solid var(--line);scroll-margin-top:70px;}
  .sec-title.sec-major{border-bottom:none;padding-bottom:0;font-size:22px;margin:var(--space-section-major) 0 var(--space-title-content);}
  .sec-n{width:26px;height:26px;border-radius:var(--radius-md);background:var(--trust-blue);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sec-n:empty{display:none;}
  /* 전체/부분 2열 카드 */
  .col-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-xl);overflow:hidden;box-shadow:0 1px 2px rgba(0,55,112,.04);transition:box-shadow .16s ease;margin:0 0 var(--space-content);}
  .col-card:hover{box-shadow:0 8px 22px rgba(0,55,112,.06);}
  .col-h{display:flex;align-items:center;gap:8px;padding:13px 18px;font-weight:800;font-size:13.5px;}
  .col-h .spacer{flex:1;}
  .col-h .ct-tag{font-size:11px;font-weight:700;background:rgba(255,255,255,.6);padding:2px 9px;border-radius:var(--radius-pill);}
  .col-body-plain{padding:20px;font-size:12.5px;line-height:1.8;color:var(--ink);white-space:pre-wrap;}
  .col-h.blue{background:var(--skyblue-soft);color:var(--trust-blue);}
  .col-h.pink{background:#faf5ea;color:#9b6829;}
  .col-h.gray{background:#eef1f5;color:#3a4657;}
  .sec-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);}
  .sec-badge.common{background:#eef1f5;color:#64748d;border:1px solid #dde2e8;}
  .col-body{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start;}
  /* 전체/부분 비교표 */
  .cmp-table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-content);}
  .cmp-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .cmp-table th,.cmp-table td{padding:14px 16px;font-size:12.5px;line-height:1.7;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);}
  .cmp-table th:not(:last-child),.cmp-table td:not(:last-child){border-right:1px solid #EDEFF3;}
  .cmp-table tr:last-child td{border-bottom:none;}
  .cmp-table th{font-weight:800;font-size:12.5px;}
  .cmp-table .cmp-corner{width:110px;background:#f6f9fc;}
  .cmp-table th.cmp-blue{background:var(--skyblue-soft);color:var(--trust-blue);}
  .cmp-table th.cmp-pink{background:#faf5ea;color:#9b6829;}
  .cmp-table.policy-tb td,.cmp-table.policy-tb th{vertical-align:middle;}
  .cmp-table.policy-tb th:nth-child(2),.cmp-table.policy-tb th:nth-child(3),.cmp-table.policy-tb td:nth-child(2),.cmp-table.policy-tb td:nth-child(3){text-align:center;}
  .cmp-table td.cmp-row-label{background:#f6f9fc;font-weight:700;color:var(--ink-soft);}
  .cmp-table td{color:var(--ink);}
  /* a·b·c 서브카드 */
  .subcard{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(0,55,112,.03);transition:box-shadow .16s ease;margin:0 0 var(--space-content);}
  .subcard:hover{box-shadow:0 6px 16px rgba(0,55,112,.06);}
  .subcard-h{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);}
  .sc-label{font-weight:700;font-size:13.5px;color:var(--ink);}
  .sc-desc{margin:9px 14px 2px;padding:7px 12px;background:#fff6da;border:1px solid #f0e2b8;border-radius:var(--radius-md);font-size:12px;color:#2f3a6b;line-height:1.6;white-space:pre-line;}
  .sc-desc:before{content:"💡 ";color:#c98a00;font-weight:800;}
  .subcard-h .tag{font-size:11px;color:var(--trust-blue);background:var(--skyblue-soft);padding:2px 7px;border-radius:var(--radius-pill);font-weight:600;}
  .subcard-h .spacer{flex:1;}
  .subcard-body{padding:16px;font-size:12.5px;line-height:1.75;color:var(--ink);white-space:pre-wrap;}
  /* 노트 박스 */
  .star-note{background:var(--vanilla-soft);border:1px solid #e8dcc3;border-radius:var(--radius-lg);padding:14px 18px;font-size:12px;color:#5c4a38;line-height:1.75;margin:0 0 var(--space-content);}
  .star-note b{color:#6b4a1a;}
  .star-note a{color:var(--trust-blue);font-weight:700;text-decoration:underline;}
  .star-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .star-h .spacer{flex:1;}
  .star-body{white-space:pre-wrap;}
  .blue-note{background:var(--skyblue-soft);border:1px solid #d6d3fb;border-radius:var(--radius-lg);padding:16px 20px;font-size:12px;color:var(--trust-blue);line-height:1.75;margin:0 0 var(--space-content);box-shadow:0 1px 2px rgba(0,55,112,.03);}
  .blue-note b{font-weight:800;}
  .bn-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bn-h .spacer{flex:1;}
  .bn-body{white-space:pre-wrap;}
  /* 무상 접수 기간 제한 안내 (A그룹 AS 공통, 2026-08-28 헬퍼 통합) */
  .limit-notice{border:1px solid #e3e8ee;border-radius:var(--radius-lg);overflow:hidden;margin:12px 0 var(--space-content);}
  .limit-notice-h{background:#EAF4F0;padding:11px 15px;font-weight:800;color:#3E8B7B;border-bottom:1px solid #e3e8ee;}
  .limit-notice-sub{font-weight:500;color:#ea2261;font-size:13px;}
  .limit-notice-table{width:100%;border-collapse:collapse;font-size:14px;}
  .limit-notice-table tr{border-top:1px solid #e3e8ee;}
  .limit-notice-day{width:140px;background:#f6f9fc;text-align:center;font-weight:800;color:#234A86;padding:14px 8px;white-space:nowrap;}
  .limit-notice-body{padding:13px 16px;vertical-align:top;color:#64748d;font-size:12.5px;line-height:1.7;}
  /* 보증기간 단종 EDGE CASE 2열 비교 (A그룹 AS 공통, 2026-08-28 헬퍼 통합) */
  .edge-compare{background:#FAFAFA;border:1px solid #e3e8ee;border-left:3px solid #D1D5DB;border-radius:var(--radius-lg);padding:16px 6px;display:grid;grid-template-columns:1fr 1fr;margin:0 0 var(--space-content);}
  .edge-compare-col{padding:0 20px;}
  .edge-compare-col-r{border-left:2px dashed #D1D5DB;}
  .edge-compare-h{font-weight:800;color:#273951;margin-bottom:8px;}
  .edge-compare-hi{color:#234A86;}
  .edge-compare-body{line-height:1.85;color:#333;font-size:13.5px;}
  /* 💰 환급금 자동 계산기 */
  .refund-calc{margin-top:14px;background:#fff;border:1px solid #d6d3fb;border-radius:var(--radius-lg);padding:14px 16px;}
  .refund-calc-h{font-weight:800;color:var(--trust-blue);font-size:12.5px;margin-bottom:10px;}
  .refund-calc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .refund-calc-row label{font-size:12.5px;font-weight:700;color:var(--ink);min-width:60px;flex-shrink:0;}
  .refund-calc-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius-md);padding:7px 10px;font-size:13px;color:var(--ink);background:#fff;}
  .refund-calc-row input:focus{outline:none;border-color:var(--skyblue);box-shadow:0 0 0 3px var(--skyblue-soft);}
  .refund-calc-row .unit{font-size:12px;color:var(--ink-soft);flex-shrink:0;}
  .refund-calc-err{font-size:11px;color:#ea2261;margin:-2px 0 6px;display:none;}
  .refund-calc-out{border-top:1px dashed #d6d3fb;padding-top:10px;display:flex;flex-direction:column;gap:6px;}
  .refund-calc-out div{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink);}
  .refund-calc-out span{color:var(--ink-soft);}
  .refund-calc-out b{color:var(--trust-blue);font-weight:700;}
  .refund-calc-out .final{border-top:1px solid #d6d3fb;padding-top:8px;margin-top:2px;}
  .refund-calc-out .final span{color:var(--trust-blue);font-weight:800;font-size:13px;}
  .refund-calc-out .final b{font-size:15px;font-weight:800;}
  /* ※ 법적 근거 접기/펼치기 */
  .legal-fold{margin-top:12px;font-size:11px;color:var(--ink-soft);}
  .legal-fold summary{cursor:pointer;font-weight:700;list-style:none;}
  .legal-fold summary::-webkit-details-marker{display:none;}
  .legal-fold summary:before{content:"▸ ";}
  .legal-fold[open] summary:before{content:"▾ ";}
  .legal-fold p{margin:6px 0 0;line-height:1.6;}
  .refund-guide-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:0;}
  @media(max-width:760px){.refund-guide-grid{grid-template-columns:1fr;}
    .refund-guide-grid>div:last-child{padding-left:0 !important;border-left:none !important;border-top:1px dashed #C7DAF2;padding-top:14px;margin-top:14px;}}
  .hidden{display:none;}
  /* 매크로명(#태그) 재노출 — 매크로명 정리 완료(2026-08) */
  .macro-head .tag,.subcard-h .tag,.col-h .ct-tag{display:inline-block;}
  .astbl{border-collapse:collapse;width:100%;margin:0 0 var(--space-content);font-size:12.5px;}
  table{margin:0 0 var(--space-content);}
  .astbl th{background:#9BBB59;color:#fff;font-weight:700;padding:9px 12px;text-align:left;border:1px solid #d9d9d9;}
  .astbl td{padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top;line-height:1.7;color:var(--ink);}
  .astbl td:first-child{width:170px;font-weight:600;background:#fafafa;}
  .h1lvl{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;color:var(--title);margin:var(--space-section-major) 0 var(--space-title-content);padding-bottom:11px;border-bottom:1px solid var(--line);}
  .h1lvl .num{width:26px;height:26px;border-radius:var(--radius-md);background:var(--trust-blue);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .h2lvl{font-size:15px;font-weight:800;color:var(--ink);margin:var(--space-section) 0 var(--space-title-content);}
  .lvl2-body{margin:0 0 0 13px;padding-left:18px;}
  .h3lvl{font-size:15px;font-weight:700;color:#0d253d;margin:var(--space-section) 0 var(--space-title-content);}
  .lvl3-body{margin:0 0 0 4px;padding-left:16px;}
  .ph{font-size:12.5px;color:#9CA3AF;background:#FAFAFA;border:1px dashed #e3e8ee;border-radius:var(--radius-md);padding:10px 14px;margin:4px 0 12px;}
  .typ{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:800;color:#234A86;margin:var(--space-section) 0 var(--space-title-content);}
  .typ .tnum{width:28px;height:28px;border-radius:9px;background:#234A86;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .flowgroup{background:transparent;border:none;border-radius:var(--radius-lg);padding:0;display:flex;flex-direction:column;gap:9px;}
  .h1lvl,.h2lvl,.h3lvl,.typ{scroll-margin-top:70px;}
  .grp-h{scroll-margin-top:70px;}
  .h2lvl.as-major{font-size:18px;color:#fff;background:#234A86;border-left:none;border-radius:var(--radius-md);padding:11px 18px;margin:var(--space-section) 0 var(--space-title-content);}
  .h2lvl.as-sub{font-size:16.5px;color:var(--title);margin:var(--space-section) 0 var(--space-title-content);padding-bottom:8px;border-bottom:1px solid var(--line);}

.search-flash{animation:searchFlash 2.2s ease;}
@keyframes searchFlash{0%,100%{box-shadow:none;}12%,55%{box-shadow:0 0 0 3px var(--trust-blue,#234A86),0 0 18px rgba(35,74,134,.45);}}

.chat-brand-grid{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px;}
.brand-chip{font:inherit;font-size:13px;font-weight:600;color:var(--trust-blue,#234A86);background:var(--primary-bg,#F4F8FD);border:1px solid #cddcf1;border-radius:999px;padding:7px 15px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.brand-chip:hover{background:var(--trust-blue,#234A86);color:#fff;border-color:var(--trust-blue,#234A86);}
</style>
</head>

  <!-- 0) 상단 가로 헤더 -->
  <header class="appbar">

      <span class="logo-txt">Olit</span>

  <div class="body-row">
    <!-- 1) 아이콘 레일 -->
    <nav class="rail">
      <button class="rail-btn active" data-rail="dash" title="홈 (대시보드)">🏠</button>
      <div class="rail-div"></div>

      <button class="rail-btn" data-rail="call" title="유선 응대">📞</button>
      <button class="rail-btn" data-rail="board" title="게시판">📝</button>
      <div class="rail-div"></div>
      <button class="rail-btn" data-rail="bm" title="북마크 (북마크)">🔖</button>

    <!-- 2) 2차 트리 메뉴 -->
    <aside class="sidebar">
      <div class="tree" id="tree"></div>
    </aside>

    <!-- 2.5) 사이드바 너비 조절 핸들 -->
    <div class="resizer" id="sidebarResizer" title="드래그하여 메뉴 너비 조절"></div>

    <!-- 3) 콘텐츠 -->

        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">

          <button id="backBtn" class="back-btn" onclick="goBack()" title="이전 페이지로" style="visibility:hidden;">← 이전 페이지</button>
        </div>
      </div>
      <div class="page" id="page"></div>
    </main>
