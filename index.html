· 상품 수령일 3개월 경과 → ⚠️ [예외] 3개월 경과 건이나 무상 반품 요청 (아래 템플릿 안내)</div><table class="astbl"><thead><tr><th style="width:210px">구분</th><th>안내</th></tr></thead><tbody><tr><td>수령일로부터 3개월 경과건<br>👉🏻 무상 반품 요청할 경우</td><td class="cmp-ment"><span class="tag">#ALAS_3개월경과_반품요청</span><button class="copy-btn" onclick="copyMacro(this)" title="복사">📋</button><div class="cmp-ment-body">고객님, 이용에 불편을 드려 죄송합니다. 🙏🏻\n확인 결과, 고객님의 제품은 수령일로부터 3개월이 경과한 것으로 확인되었습니다.\n\n얼라인랩은 공정거래위원회 소비자분쟁해결기준을 토대로, 품질보증기간 내 정상 사용 중 발생한 하자에 대해 기간별 AS 정책을 운영하고 있습니다.\n이에 따라 수령 후 3개월 이후에는 무상 반품이 아닌 무상 교환으로 진행되며, 고객님의 제품도 해당 기준에 따라 동일 제품으로 무상 교환을 도와드리는 점 양해 부탁드립니다.</div></td></tr><tr><td>수령일로부터 3개월 이내<br>👉🏻 무상 반품 요청할 경우</td><td><a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동하여 안내</td></tr></tbody></table>${macro(`💡 상황에 따라서 고객에게 처리방안(교환 or 반품) 선택지를 줘야 하는 경우 아래 템플릿 전송`,"",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}<div class="grp-h">a. 포장 및 회수 안내</div>${col("gray",`🔹 전체·부분 동일`,subcard(`포장 · 회수 안내`,"",`불량 증상 확인되어 교환 접수 도와드리겠습니다.\n\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상 : {상담마다 직접 회수 필요한 제품 확인하여 기재}\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 됩니다.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 얼라인랩 ]</b> 표기 부탁드립니다.\n\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.`) + caution(`🎁 증정품 회수 X`))}${macro(`💡 리프핏 아이의 경우, 제품 포장 안내 부분 아래 문구로 대체 필수!`,"",`📦 <b>제품 포장 안내</b>\n■ 회수 대상 : {상담마다 직접 회수 필요한 제품 확인하여 기재}\n※ 리프핏아이 본품 외 증정품(ex. 크림 등)을 함께 보내실 경우 폐기되며 재발송이 어렵습니다.`)}${macro(`회수지 확인 필요 시`,"",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}<div class="grp-h">b. 검수 및 재출고 안내</div><div class="grid2"><div class="quote-box"><b>⚠️ 유의사항</b>\n① 접수 시간 기준으로 안내 필요\n② 불량으로 인한 재출고는 회수 접수와 동시에 재출고 접수\n⚠️ 단, 리프핏 아이 진동 강도 불량의 경우 회수·검수 완료 후 재출고 가능</div>${guide(`🔗 <a href=   ${blueNote(`💰 환급금 계산 가이드`,`<div class="refund-guide-grid"><div style="padding-right:18px">① 구입가 확인\n② 사용개월 확인\n③ 아래 계산식 적용\n\n<b>감가상각비</b> = (사용개월 ÷ 60개월) × 구입가\n<b>잔여금</b> = 구입가 - 감가상각비\n<b>최종 환급금</b> = 잔여금 + 구입가의 10%\n\n※ 얼라인랩 제품의 내용연수는 60개월로 적용합니다.<div class="quote-box" style="margin-top:14px"><b>예시)</b> 목베개플러스 · 구입가 99,000원 · 구입일 2024년 7월 · AS 문의일 2026년 7월 · 사용기간 24개월\n\n· 감가상각비 = (24개월 ÷ 60개월) × 99,000원 = 39,600원\n· 잔여금 = 99,000원 - 39,600원 = 59,400원\n· 구입가의 10% = 99,000원 × 10% = 9,900원\n· <b>최종 환급금</b> = 59,400원 + 9,900원 = <b>69,300원</b></div></div><div style="padding-left:18px;border-left:2px dashed #C7DAF2"><div class="refund-calc" style="margin-top:0"><div class="refund-calc-h">🧮 자동 계산기 (숫자만 입력)</div><div class="refund-calc-row"><label>구입가</label><input type="text" inputmode="numeric" data-role="price" placeholder="예: 99000" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">원</span></div><div class="refund-calc-row"><label>사용개월</label><input type="text" inputmode="numeric" data-role="months" placeholder="예: 24" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">개월</span></div><div class="refund-calc-err"></div><div class="refund-calc-out"><div><span>감가상각비</span><b data-out="dep">0원</b></div><div><span>잔여금</span><b data-out="rem">0원</b></div><div><span>구입가의 10%</span><b data-out="add">0원</b></div><div class="final"><span>최종 환급금</span><b data-out="final">0원</b></div></div></div></div></div><details class="legal-fold"><summary>※ 관련 기준 보기</summary><p>공정거래위원회 소비자분쟁해결기준에 따라 품질보증기간이 경과한 후 부품보유기간 내 수리가 불가능한 경우, 정액 감가상각한 잔여 금액에 구입가의 10%를 가산하여 환급합니다.</p></details>`)}

불량으로 의심되는 증상에 대해 조금 더 자세히 말씀해주실 수 있을까요?

말씀해주신 내용을 기반으로 정확한 안내 도와드릴게요. 🙏🏻`,`CX매니저 연결 전, 취합된 정보나 증빙 자료만으로 증상 확인이 불가할 경우 사용`)}</div>

  <div class="lvl2-body"><table class="astbl"><thead><tr><th>사용법 안내 여부</th><th>증상</th></tr></thead><tbody><tr><td>A. 사용법 안내 필요</td><td><a class="jump-link" href="#t1" onclick="return jumpTo('t1')">1. 전원/작동</a> (증빙 자료로 판단 가능한 유형 전체)</td></tr><tr><td>B. 사용법 안내 불필요</td><td><a class="jump-link" href="#t3" onclick="return jumpTo('t3')">2. 소음 강도 &amp; 쿠팡/네이버 자동수거</a><br><a class="jump-link" href="#t5" onclick="return jumpTo('t5')">3. 구성품 누락</a><br><a class="jump-link" href="#t6" onclick="return jumpTo('t6')">4. 이염/오염/초도파손</a></td></tr></tbody></table></div>
  <div class="h2lvl as-sub" id="groupA">A. 사용법 안내 필요</div>
  <div class="lvl2-body"><div class="quote-box" style="display:flex;gap:18px;align-items:flex-start;"><div style="flex:1;"><b>📌 해당 증상 CS건은 사용법 오인으로 인한 불량 문의가 많으므로 제품별 유의사항 또는 사용법 안내가 선행되어야 함</b>\n⚠️ 단, <span style="color:#1B3A68">ALF·워크플로우에서 관련 안내가 완료된 경우에는아래 제품별 유의사항 중복 안내를 생략</span>하고, Flow 및 고객 증빙을 확인하여 미확인 사항만 추가 확인</div><div style="flex:1;padding-left:18px;border-left:1px dashed var(--trust-blue);"><b>제품별 유의사항은 <a href="https://docs.google.com/spreadsheets/d/1OwcLG2XuwPUHt7grmSIjpWsZqU8MAhWPrcp-RVykLMI/edit?gid=1646404328#gid=1646404328" target="_blank">[빌바] 제품별 사용법 템플릿</a> 시트 또는 채널톡 매크로 이용</b></div></div><div class="grid2">${macro(``,"BILAS_3a",`고객님, 문의주신 (제품명)의 올바른 사용법 먼저 안내드립니다.

사용법과 다르게 사용하실 경우 정상 작동이 어려울 수 있어, 안내드린 방식대로 사용해 보셨는지 확인 부탁드려요. 🙏🏻`)}${macro(``,"BILAS_3b",`혹시 사용법대로 진행하셨음에도 문제가 지속되었을까요?`,`👉🏻 올바른 사용법 안내 후 바로 송출`)}</div><div class="typ" id="t1"><span class="tnum">1</span>전원/작동</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 유의사항</b>\n① 빌바 제품은 전원 코드를 콘센트에 직접 연결해 사용하는 가전제품으로, 충전이 아닌 전원 연결 상태에서만 작동.\n② 전원 코드 체결 불량으로 인한 고객 과실 불량이나 오인 VOC가 많은 편으로 코드 연결 상태는 필수 확인 필요</div><div class="grid2">${macro(`제품 사용법 안내`,"BILAS_4",`고객님, 문의주신 (제품명)은 전원 코드를 연결해 사용하는 제품입니다.
본체에 동봉된 전원선을 연결하고, 전원 플러그를 콘센트에 꽂은 상태로 사용해 주셔야 합니다.

혹시 이렇게 하셨는데도 작동이 안 되는 상황이실까요?`)}${guide(`✔️ 고객 정상 사용 답변 시 상담 종료 유도 (무응답 종료 포함)
✔️ 체결된 상태로 사용 주장 + 증빙(사진·영상) 미흡 시 <a class="jump-link" href="#evidCheck" onclick="return jumpTo('evidCheck')">② 증빙 확인 (사진/영상)</a> 단계로 이동`)}</div><div class="h3lvl" id="evidCheck">② 증빙 확인 (사진/영상)</div><div class="lvl3-body"><div class="grid2">${macro(`i. 사진/영상 확인`,"BILAS_9",`📷 고객님, 정확한 불량 증상 확인을 위해
번거로우시겠지만 아래 2가지가 모두 확인되도록 촬영 부탁드립니다.

1️⃣ 불량 증상이 나타나는 장면 (작동 시도 영상)
2️⃣ 전원 코드가 콘센트에 정상적으로 연결된 상태`)}${caution(`⚠️ 단, 추가 증빙 자료 요청은 고객이 선첨부한 자료(사진/영상)가 미흡할 경우에만 진행
⚠️ 제품별 작동 관련 증상은 상이 (ex. 정량 작동 시에도 끓어 넘쳐요, 모터가 안돌아가요, 시작 버튼을 누르지 않았는데도 작동돼요 등) 하며 전원 연결 불량이 아닌 사진/영상으로 확인 가능한 모든 작동 불량을 포함함.`)}</div>${guide(`<b>👉🏻 증빙(사진·영상) 확인 완료 시 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동</b>`)}</div></div></div>
  <div class="h2lvl as-sub" id="groupB">B. 사용법 안내 불필요</div>
  <div class="lvl2-body"><div class="typ" id="t3"><span class="tnum">2</span>소음 강도 &amp; 쿠팡/네이버 자동수거</div><div class="lvl3-body">${caution(`🚨 사용자의 ‘체감 강도’ 관련 문의만 해당함\n→ 육안으로 확인이 어려운 유형으로, 사진/영상 요청은 진행하지 않음`)}<table style="border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:13px"><thead><tr><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 적용 예시</th><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 미적용 예시 (작동 불량 등으로 진행)</th></tr></thead><tbody><tr><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">작동 소리가 너무 커요 등</td><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">조절 버튼 불량 등</td></tr></tbody></table></div><div class="typ" id="t5"><span class="tnum">3</span>구성품 누락</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"BILAS_구성품_사진요청",`고객님, 번거로우시겠지만 수령하신 제품의 구성품 전체가 확인되도록 사진을 보내주시면\n빠르게 확인 후 안내드릴게요. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"BILAS_구성품_처리불가",`구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 너른 양해 부탁드려요. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"BILAS_구성품_예외",`고객님, 앞서 안내드린 것처럼 구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 구성품 전체가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드릴게요. 🙏🏻`)}<div class="grp-h">2️⃣ 별도 재출고 안내</div>${macro(`i. 별도 재출고 안내`,"BILAS_구성품_재출고",`확인 감사합니다.\n이용에 불편을 드려 정말 죄송합니다.\n누락된 (구성품명)은 재출고로 진행해 드리겠습니다.`)}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}${macro(`iii. 출고 시일 소요 안내`,"BILAS_구성품_출고시일",`확인 감사합니다.\n\n🚚 재출고 일정 안내드릴게요.\n\n· 출고 : 영업일 2일 이내\n· 배송 : 접수일로부터 영업일 5~6일 소요\n· 택배사 : CJ대한통운\n\n※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 너른 양해 부탁드려요.`,`▶ 상담 종료 후 <a href="https://docs.google.com/spreadsheets/d/1Bj5stx8hXMoPL8L91EYu6e5TA7pqEAjges4Cejs1wjo/edit?gid=388846546#gid=388846546" target="_blank">수기출고 통합 시트</a> - 자사 제품 신청 탭\n\n⚠️ 본품 전체 출고일 경우, ※문구 삭제 필요`)}<div class="grp-h">🔔 [예외케이스] 구성품 누락으로 전체 반품 희망</div><div class="quote-box"><b>상품 개봉 여부와 무관하게 제품 회수 및 전액 환불 처리로 진행</b></div>${macro(`i. 포장 및 회수 안내`,"BILAS_구성품_전액환불",`<b>전액 환불 접수 도와드릴게요.</b>\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(계량컵·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 빌바 ]</b> 표기 부탁드립니다.\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있습니다.` + caution(`🎁 증정품 회수 O`))}<div class="grp-h">② 결제수단별 환불 안내</div><div class="grid2">${col("blue","◆ 카드결제",subcard(`i. 카드결제 취소`,"BILAS_구성품_환불카드",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있습니다.\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`))}${col("pink","◆ 계좌 환불",`<div class="stack">`+subcard(`i. 계좌 환불 (무통장·가상계좌)`,"BILAS_구성품_환불계좌1",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드려요.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`)+subcard(`ii. 이후 계좌 정보 확인`,"BILAS_구성품_환불계좌2",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)+`</div>`)}</div></div><div class="typ" id="t6"><span class="tnum">4</span>이염/오염/초도파손</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"BILAS_이염_사진요청",`고객님, 번거로우시겠지만 수령하신 제품의 (이염·오염·파손) 상태가 확인되도록 사진을 보내주시면 빠르게 확인 후 안내드릴게요. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"BILAS_이염_처리불가",`제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 너른 양해 부탁드려요. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"BILAS_이염_예외",`고객님, 앞서 안내드린 것처럼 제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 이염·오염 상태가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드릴게요. 🙏🏻`)}<div class="grp-h">② 고객 요청 처리 방안 확인</div>${macro(`고객 요청 처리 방안 확인`,"BILAS_이염_방향",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}${guide(`⚠️ 상품수령일로부터 7일 이내 이염/오염/초도파손은 고객이 원하는 처리 방안(교환 또는 반품) 확인 후 진행 (단, 기간별 정책에 따라만 진행 가능)\n👉🏻 교환 요청 시 <a class="jump-link" href="#freeBranch" onclick="return jumpTo('freeBranch')">🔷 무상 교환 안내</a> 로 이동\n👉🏻 반품 요청 시 <a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동`)}</div></div>
  <div class="h2lvl" id="t4">🔁 재불량 (교환품 동일 증상)</div>
  <div class="lvl2-body">${caution(`👉 [예시] 2026.01.01 두유제조기 전원 불량으로 무상 교환 진행 → 2026.03.02 교환 제품에서 동일 증상(전원 불량)으로 재문의`)}<div class="grp-h">💡 공통 안내</div>${macro(`i. 사과·양해 멘트`,"BILAS_재불량_사과",`교환 받으신 제품에서도 동일한 증상이 발생하여 많이 당황스러우셨을 것 같습니다.\n다시 한 번 불편을 드리게 된 점 진심으로 사과드립니다. 🥲`)}<div class="grp-h">① 무상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1. 전원/작동만 아래와 같이 진행</b></div><table class="astbl"><thead><tr><th>재인입</th><th>고객 반품 희망</th><th>고객 교환 희망</th></tr></thead><tbody><tr><td>1차 재인입</td><td>각 불량 유형 기본 flow 대로 진행</td><td>각 불량 유형 기본 flow 대로 진행</td></tr><tr><td>2차 재인입</td><td>회수 후 검수 결과에 따라 처리</td><td>① 정격전압 확인 ㅡ 어댑터 사진 필수<br>② 사진 확인 후 기존 flow 대로 진행</td></tr><tr><td>3차 재인입~</td><td>회수 후 검수 결과에 따라 처리</td><td>회수 후 검수 결과에 따라 처리</td></tr></tbody></table><div class="grp-h">② 유상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1차 유상 교환 접수 시점 기준으로 <span style="color:#E03131">① 2개월 이내 + ② 동일 증상을 충족할 경우에만</span> → 무상 교환 (고객이 원할 경우 수령일로부터 3개월 이내 무상 반품) 처리 가능</b></div><table class="astbl"><thead><tr><th>구분</th><th>예시</th></tr></thead><tbody><tr><td>무상 반품 or 무상 교환<br>가능 ⭕</td><td>① 두유제조기 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 동일 증상으로 문의</td></tr><tr><td>무상 반품 or 무상 교환<br>불가능 ❌</td><td>① 두유제조기 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 버튼 불량으로 문의<br><br>② 두유제조기 전원 불량 증상으로 유상 교환<br>→ 2개월 이후 동일 증상으로 문의</td></tr></tbody></table><div class="grp-h">✔️ 고객이 무상 서비스 요청할 경우 ㅡ 무상 서비스 가능 여부 확인</div><div class="grid2">${macro(`i. 무상 서비스 가능 (2개월 이내 · 동일 증상)`,"BILAS_유상재불량_가능",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 이전 증상과 동일한 증상으로 확인되며,\n접수 시점 또한 2개월 이내로 확인되어 무상 서비스로 진행 도와드릴 예정입니다.\n\n동일 증상으로 다시 불편을 드리게 되어 다시 한 번 죄송합니다. 🥲\n\n반품 또는 새 제품 교환 중 어떤 방향으로 진행 원하실까요?`)}<div class="stack">${macro(`ii. 무상 서비스 불가능 (2개월 경과)`,"BILAS_유상재불량_불가경과",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 해당 기간이 경과된 상태로,\n최초 제품 수령일 기준 품질보증 정책이 적용되어 이전과 동일하게 유상 서비스 대상으로 확인됩니다.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 너른 양해 부탁드려요. 🙏🏻`)}${macro(`iii. 무상 서비스 불가능 (2개월 이내 · 다른 증상)`,"BILAS_유상재불량_불가증상",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 접수 기간은 충족되었으나,\n현재 증상이 기존과 동일 증상으로 확인되지 않아 정책상 무상 서비스 적용이 어려운 점 안내드려요.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 너른 양해 부탁드려요. 🙏🏻`)}</div></div></div>

  <div class="h2lvl as-major" id="freeFlow">🛠️ 무상 AS</div><div class="lvl2-body"><div class="h3lvl" id="freeBranch">🔷 무상 교환 안내</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 6개월 이내 제품 자체 고장은 원칙적으로 무상 교환으로 안내</b>

✔️ 만약 고객이 반품을 요청할 경우, 아래 기간에 따라 응대
· 상품 수령일 3개월 이내 → ② 무상 반품 접수
· 상품 수령일 3개월 경과 → ⚠️ [예외] 3개월 경과 건이나 무상 반품 요청 (아래 템플릿 안내)</div><table class="astbl"><thead><tr><th style="width:210px">구분</th><th>안내</th></tr></thead><tbody><tr><td>수령일로부터 3개월 경과건<br>👉🏻 무상 반품 요청할 경우</td><td class="cmp-ment"><span class="tag">#BILAS_3개월경과_반품요청</span><button class="copy-btn" onclick="copyMacro(this)" title="복사">📋</button><div class="cmp-ment-body">고객님, 이용에 불편을 드려 죄송합니다. 🙏🏻\n확인 결과, 고객님의 제품은 수령일로부터 3개월이 경과한 것으로 확인되었습니다.\n\n빌바는 공정거래위원회 소비자분쟁해결기준을 토대로, 품질보증기간 내 정상 사용 중 발생한 하자에 대해 기간별 AS 정책을 운영하고 있습니다.\n이에 따라 수령 후 3개월 이후에는 무상 반품이 아닌 무상 교환으로 진행되며, 고객님의 제품도 해당 기준에 따라 동일 제품으로 무상 교환을 도와드리는 점 양해 부탁드립니다.</div></td></tr><tr><td>수령일로부터 3개월 이내<br>👉🏻 무상 반품 요청할 경우</td><td><a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동하여 안내</td></tr></tbody></table>${macro(`💡 상황에 따라서 고객에게 처리방안(교환 or 반품) 선택지를 줘야 하는 경우 아래 템플릿 전송`,"BILAS_3개월경과_처리방안선택",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}<div class="grp-h">a. 포장 및 회수 안내</div>${col("gray",`🔹 전체·부분 동일`,subcard(`포장 · 회수 안내`,"BILAS_무상교환_포장",`불량 증상 확인되어 교환 접수 도와드릴게요.\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(계량컵·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 됩니다.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 빌바 ]</b> 표기 부탁드립니다.\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있습니다.`) + caution(`🎁 증정품 회수 X`))}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}<div class="grp-h">b. 검수 및 재출고 안내</div><div class="grid2"><div class="quote-box"><b>⚠️ 유의사항</b>\n① 접수 시간 기준으로 안내 필요\n② 불량으로 인한 재출고는 회수 접수와 동시에 재출고 접수</div>${guide(`🔗 <a href="https://docs.google.com/spreadsheets/d/1t7Oa-rKPY2aYgphNugE5K5gMCP7Hn3joaJYp-bbh7Jw/edit?gid=1012913860#gid=1012913860" target="_bl   <div class="lvl3-body">${macro(`무상 보증기간 경과 · 유상 AS 안내`,"무상AS경과_유상AS안내",`빌바 디바이스의 AS 품질 보증 기간은 상품 수령일 기준 1년이며, 이는 무상·유상 AS를 모두 포함한 전체 기간입니다.

고객님께서 자체 폐기해 주시면 감사하겠습니다.`,`정확한 금액은 아래 [제품별 유상교환 가격표] 참고 · 표에 없는 제품·최신 여부는 CX팀 확인 후 안내`)}

  <div class="lvl2-body"><div class="h3lvl" id="edgeIn">① 품질보증기간(1년) 이내 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 유사 모델을 '유상교환 가격' 으로 구매 안내\n② 고객이 구매를 원하지 않는 경우 단종 보상 기준에 따라 <b>구입가를 자사몰 포인트로 대체 환급</b></div>${macro(`i. 단종 안내 및 유사 제품 추천`,"BILAS_단종이내_안내",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 너른 양해 부탁드려요.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 이내 유상 교환 기준을 적용한 ({1년 이내 기준 유상금액}+3000)원으로 접수 도와드릴게요.\n\n아래 주요 기능과 빌바 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(빌바 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 이내 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"BILAS_단종이내_입금",`네 고객님, 이해해 주셔서 감사합니다. 😊\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드릴게요.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 이내 유상 교환 금액)\n🏦 기업은행 078-213475-04-028 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드릴게요.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"BILAS_단종이내_폐기",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div>${subcard(`i. 유사 제품 구매 미동의_포인트 환급 안내`,"BILAS_단종이내_미동의",`고객님, 다시 한번 불편을 드려 죄송합니다.\n다른 제품으로 교환을 원치 않으시다면, 구입가를 공식몰 포인트로 환급해 드리겠습니다.\n포인트는 주문하신 계정과 동일한 계정으로 지급되며, 지급까지는 영업일 기준 1~2일 정도 소요됩니다.`)}</div>${guide(`👉🏻 i. 유사 제품 구매 동의_입금 안내 시 접수 시점에 따라 출고 안내`)}<div class="grid2">${subcard(`i. 월-금 오후 2시 이전 상담`,"BILAS_단종이내_출고A",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}${subcard(`ii. 월-목 오후 2시 이후 상담`,"BILAS_단종이내_출고B",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}</div>${macro(`iii. 금요일 오후 2시 이후 상담`,"BILAS_단종이내_출고C",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행`)}</div><div class="h3lvl" id="edgeOut">② 품질보증기간(1년) 경과 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 동일 부위·동일 용도의 유사 제품이 있는지 확인\n<span class="sub-ex">(예: 넥숄더프로 → 넥숄더힐링케어 V2)</span>\n② 유사 제품을 품질보증기간(1년) 경과 유상 교환 비용으로 구매할 수 있도록 안내\n③ 고객이 유사 제품 구매를 원하지 않는 경우, <b>감가상각을 반영한 잔여 금액에 구입가의 10%를 가산</b>하여 자사몰 포인트로 환급</div>${macro(`i. 단종 안내 및 유사 제품 추천`,"BILAS_단종경과_안내",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 너른 양해 부탁드려요.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 경과 유상 교환 기준을 적용한 ({1년 경과 기준 유상금액}+3000)원으로 접수 도와드릴게요.\n\n아래 주요 기능과 빌바 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(빌바 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 경과 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"BILAS_단종경과_입금",`네 고객님, 이해해 주셔서 감사합니다. 😊\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드릴게요.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 경과 유상 교환 금액)\n🏦 기업은행 078-213475-04-028 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드릴게요.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"BILAS_단종경과_폐기",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div><div class="flowgroup">${subcard(`i. 유사 제품 구매 미동의_감가상각`,"BILAS_단종경과_미동의",`고객님, 다시 한번 불편을 드려 죄송합니다.\n문의주신 주문 건은 현재 품질보증기간 1년이 경과한 상태로, 구매 당시 결제 금액과 사용 기간을 반영한 기준에 따라 환급을 도와드릴게요.\n고객님께 적용되는 환불 예정 금액은 (환불예정금액)원이며, 영업일 기준 1~2일 정도 소요됩니다.\n환불을 위해 아래 계좌 정보 전달 부탁드려요.\n\n🏦 은행 / 계좌번호 / 예금주`)}${subcard(`ii. 이후 계좌 정보 확인`,"BILAS_단종경과_계좌확인",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n💸 입금 안내\n영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)}</div></div></div></div>
  ${blueNote(`💰 환급금 계산 가이드`,`<div class="refund-guide-grid"><div style="padding-right:18px">① 구입가 확인\n② 사용개월 확인\n③ 아래 계산식 적용\n\n<b>감가상각비</b> = (사용개월 ÷ 60개월) × 구입가\n<b>잔여금</b> = 구입가 - 감가상각비\n<b>최종 환급금</b> = 잔여금 + 구입가의 10%\n\n※ 빌바 제품의 내용연수는 60개월로 적용합니다.<div class="quote-box" style="margin-top:14px"><b>예시)</b> 올스텐 멀티찜기 · 구입가 79,800원 · 구입일 2024년 7월 · AS 문의일 2026년 7월 · 사용기간 24개월\n\n· 감가상각비 = (24개월 ÷ 60개월) × 79,800원 = 31,920원\n· 잔여금 = 79,800원 - 31,920원 = 47,880원\n· 구입가의 10% = 79,800원 × 10% = 7,980원\n· <b>최종 환급금</b> = 47,880원 + 7,980원 = <b>55,860원</b></div></div><div style="padding-left:18px;border-left:2px dashed #C7DAF2"><div class="refund-calc" style="margin-top:0"><div class="refund-calc-h">🧮 자동 계산기 (숫자만 입력)</div><div class="refund-calc-row"><label>구입가</label><input type="text" inputmode="numeric" data-role="price" placeholder="예: 99000" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">원</span></div><div class="refund-calc-row"><label>사용개월</label><input type="text" inputmode="numeric" data-role="months" placeholder="예: 24" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">개월</span></div><div class="refund-calc-err"></div><div class="refund-calc-out"><div><span>감가상각비</span><b data-out="dep">0원</b></div><div><span>잔여금</span><b data-out="rem">0원</b></div><div><span>구입가의 10%</span><b data-out="add">0원</b></div><div class="final"><span>최종 환급금</span><b data-out="final">0원</b></div></div></div></div></div><details class="legal-fold"><summary>※ 관련 기준 보기</summary><p>공정거래위원회 소비자분쟁해결기준에 따라 품질보증기간이 경과한 후 부품보유기간 내 수리가 불가능한 경우, 정액 감가상각한 잔여 금액에 구입가의 10%를 가산하여 환급합니다.</p></details>`)}

  <div class="lvl2-body"><div class="typ" id="t3"><span class="tnum">2</span>소음·온열 강도 &amp; 쿠팡/네이버 자동수거</div><div class="lvl3-body">${caution(`🚨 사용자의 ‘체감 강도’ 관련 문의만 해당함\n→ 육안으로 확인이 어려운 유형으로, 사진/영상 요청은 진행하지 않음`)}<table style="border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:13px"><thead><tr><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 적용 예시</th><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 미적용 예시 (작동 불량 등으로 진행)</th></tr></thead><tbody><tr><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">가습기 작동 소리가 너무 커요, 너무 뜨거워요 등</td><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">소리 조절 버튼 불량, 온도 조절 불량 등</td></tr></tbody></table></div><div class="typ" id="t5"><span class="tnum">3</span>구성품 누락</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"OCAS_구성품_사진요청",`고객님, 번거로우시겠지만 수령하신 제품의 구성품 전체가 확인되도록 사진을 보내주시면 \n빠르게 확인 후 안내드릴게요. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"OCAS_구성품_처리불가",`구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드려요. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"OCAS_구성품_예외",`고객님, 앞서 안내드린 것처럼 구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 구성품 전체가 확인되도록 사진 전송 부탁드려요.\n확인 후 안내드릴게요. 🙏🏻`)}<div class="grp-h">2️⃣ 별도 재출고 안내</div>${macro(`i. 별도 재출고 안내`,"OCAS_구성품_재출고",`확인 감사해요.\n이용에 불편을 드려 정말 죄송합니다. 🙏🏻\n누락된 (구성품명)은 재출고로 진행해 드리겠습니다.`)}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}${macro(`iii. 출고 시일 소요 안내`,"OCAS_구성품_출고시일",`확인 감사해요.\n\n🚚 재출고 일정 안내드릴게요.\n\n· 출고 : 영업일 2일 이내\n· 배송 : 접수일로부터 영업일 5~6일 소요\n· 택배사 : CJ대한통운\n\n※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 양해 부탁드려요.`,`▶ 상담 종료 후 <a href="https://docs.google.com/spreadsheets/d/1Bj5stx8hXMoPL8L91EYu6e5TA7pqEAjges4Cejs1wjo/edit?gid=388846546#gid=388846546" target="_blank">수기출고 통합 시트</a> - 자사 제품 신청 탭\n\n⚠️ 본품 전체 출고일 경우, ※문구 삭제 필요`)}<div class="grp-h">🔔 [예외케이스] 구성품 누락으로 전체 반품 희망</div><div class="quote-box"><b>상품 개봉 여부와 무관하게 제품 회수 및 전액 환불 처리로 진행</b></div>${macro(`i. 포장 및 회수 안내`,"OCAS_구성품_전액환불",`<b>전액 환불 접수 도와드릴게요.</b>\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 12 o'clock ]</b> 표기 부탁드려요.\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요.` + caution(`🎁 증정품 회수 O`))}<div class="grp-h">② 결제수단별 환불 안내</div><div class="grid2">${col("blue","◆ 카드결제",subcard(`i. 카드결제 취소`,"OCAS_구성품_환불카드",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있어요.\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻`))}${col("pink","◆ 계좌 환불",`<div class="stack">`+subcard(`i. 계좌 환불 (무통장·가상계좌)`,"OCAS_구성품_환불계좌1",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드려요.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻`)+subcard(`ii. 이후 계좌 정보 확인`,"OCAS_구성품_환불계좌2",`소중한 정보 확인 감사해요.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요.`)+`</div>`)}</div></div><div class="typ" id="t6"><span class="tnum">4</span>이염/오염/초도파손/스크래치</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"OCAS_이염_사진요청",`고객님, 번거로우시겠지만 수령하신 제품의 (이염·오염·파손) 상태가 확인되도록 사진을 보내주시면 빠르게 확인 후 안내드릴게요. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"OCAS_이염_처리불가",`제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드려요. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"OCAS_이염_예외",`고객님, 앞서 안내드린 것처럼 제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 이염·오염 상태가 확인되도록 사진 전송 부탁드려요.\n확인 후 안내드릴게요. 🙏🏻`)}<div class="grp-h">② 고객 요청 처리 방안 확인</div>${macro(`고객 요청 처리 방안 확인`,"OCAS_이염_방향",`불편을 드려 죄송해요. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있어요.\n어느 쪽으로 진행해 드릴까요?`)}${guide(`⚠️ 상품수령일로부터 7일 이내 이염/오염/초도파손은 고객이 원하는 처리 방안(교환 또는 반품) 확인 후 진행 (단, 기간별 정책에 따라만 진행 가능)\n👉🏻 교환 요청 시 <a class="jump-link" href="#freeBranch" onclick="return jumpTo('freeBranch')">🔷 무상 교환 안내</a> 로 이동\n👉🏻 반품 요청 시 <a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동`)}</div></div>
  <div class="h2lvl" id="t4">🔁 재불량 (교환품 동일 증상)</div>
  <div class="lvl2-body">${caution(`👉 [예시] 2026.01.01 물멍 가습기 작동 불량으로 무상 교환 진행 → 2026.03.02 교환 제품에서 동일 증상(작동 불량)으로 재문의`)}<div class="grp-h">💡 공통 안내</div>${macro(`i. 사과·양해 멘트`,"OCAS_재불량_사과",`교환 받으신 제품에서도 동일한 증상이 발생하여 많이 당황스러우셨을 것 같습니다.\n다시 한 번 불편을 드리게 된 점 진심으로 사과드려요. 🥲`)}<div class="grp-h">① 무상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1. 충전/전원/작동만 아래와 같이 진행</b></div><table class="astbl"><thead><tr><th>재인입</th><th>고객 반품 희망</th><th>고객 교환 희망</th></tr></thead><tbody><tr><td>1차 재인입</td><td>각 불량 유형 기본 flow 대로 진행</td><td>각 불량 유형 기본 flow 대로 진행</td></tr><tr><td>2차 재인입</td><td>회수 후 검수 결과에 따라 처리</td><td>① 정격전압 확인 ㅡ 어댑터 사진 필수<br>② 사진 확인 후 기존 flow 대로 진행</td></tr><tr><td>3차 재인입~</td><td>회수 후 검수 결과에 따라 처리</td><td>회수 후 검수 결과에 따라 처리</td></tr></tbody></table><div class="grp-h">② 유상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1차 유상 교환 접수 시점 기준으로 <span style="color:#E03131">① 2개월 이내 + ② 동일 증상을 충족할 경우에만</span> → 무상 교환 (고객이 원할 경우 수령일로부터 3개월 이내 무상 반품) 처리 가능</b></div><table class="astbl"><thead><tr><th>구분</th><th>예시</th></tr></thead><tbody><tr><td>무상 반품 or 무상 교환<br>가능 ⭕</td><td>① 물멍 가습기 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 동일 증상으로 문의</td></tr><tr><td>무상 반품 or 무상 교환<br>불가능 ❌</td><td>① 물멍 가습기 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 버튼 불량으로 문의<br><br>② 물멍 가습기 전원 불량 증상으로 유상 교환<br>→ 2개월 이후 동일 증상으로 문의</td></tr></tbody></table><div class="grp-h">✔️ 고객이 무상 서비스 요청할 경우 ㅡ 무상 서비스 가능 여부 확인</div><div class="grid2">${macro(`i. 무상 서비스 가능 (2개월 이내 · 동일 증상)`,"OCAS_유상재불량_가능",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 이전 증상과 동일한 증상으로 확인되며,\n접수 시점 또한 2개월 이내로 확인되어 무상 서비스로 진행 도와드릴 예정입니다.\n\n동일 증상으로 다시 불편을 드리게 되어 다시 한 번 죄송합니다. 🥲\n\n반품 또는 새 제품 교환 중 어떤 방향으로 진행 원하실까요?`)}<div class="stack">${macro(`ii. 무상 서비스 불가능 (2개월 경과)`,"OCAS_유상재불량_불가경과",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 해당 기간이 경과된 상태로,\n최초 제품 수령일 기준 품질보증 정책이 적용되어 이전과 동일하게 유상 서비스 대상으로 확인됩니다.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 양해 부탁드립니다. 🙏🏻`)}${macro(`iii. 무상 서비스 불가능 (2개월 이내 · 다른 증상)`,"OCAS_유상재불량_불가증상",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 접수 기간은 충족되었으나,\n현재 증상이 기존과 동일 증상으로 확인되지 않아 정책상 무상 서비스 적용이 어려운 점 안내드립니다.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 양해 부탁드립니다. 🙏🏻`)}</div></div></div>
  <div class="h1lvl" id="step2"><span class="num">3</span>AS 접수</div>
  <div class="h2lvl as-major" id="freeFlow">🛠️ 무상 AS</div><div class="lvl2-body"><div class="h3lvl" id="freeBranch">🔷 무상 교환 안내</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 6개월 이내 제품 자체 고장은 원칙적으로 무상 교환으로 안내</b>

✔️ 만약 고객이 반품을 요청할 경우, 아래 기간에 따라 응대
· 상품 수령일 3개월 이내 → ② 무상 반품 접수
· 상품 수령일 3개월 경과 → ⚠️ [예외] 3개월 경과 건이나 무상 반품 요청 (아래 템플릿 안내)</div><table class="astbl"><thead><tr><th style="width:210px">구분</th><th>안내</th></tr></thead><tbody><tr><td>수령일로부터 3개월 경과건<br>👉🏻 무상 반품 요청할 경우</td><td class="cmp-ment"><span class="tag">#OCAS_3개월경과_반품요청</span><button class="copy-btn" onclick="copyMacro(this)" title="복사">📋</button><div class="cmp-ment-body">고객님, 이용에 불편을 드려 죄송해요. 🙏🏻\n확인 결과, 고객님의 제품은 수령일로부터 3개월이 경과한 것으로 확인되었습니다.\n\n12 o'clock은 공정거래위원회 소비자분쟁해결기준을 토대로, 품질보증기간 내 정상 사용 중 발생한 하자에 대해 기간별 AS 정책을 운영하고 있어요.\n이에 따라 수령 후 3개월 이후에는 무상 반품이 아닌 무상 교환으로 진행되며, 고객님의 제품도 해당 기준에 따라 동일 제품으로 무상 교환을 도와드리는 점 양해 부탁드려요.</div></td></tr><tr><td>수령일로부터 3개월 이내<br>👉🏻 무상 반품 요청할 경우</td><td><a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동하여 안내</td></tr></tbody></table>${macro(`💡 상황에 따라서 고객에게 처리방안(교환 or 반품) 선택지를 줘야 하는 경우 아래 템플릿 전송`,"OCAS_3개월경과_처리방안선택",`불편을 드려 죄송해요. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있어요.\n어느 쪽으로 진행해 드릴까요?`)}<div class="grp-h">a. 포장 및 회수 안내</div>${col("gray",`🔹 전체·부분 동일`,subcard(`포장 · 회수 안내`,"OCAS_무상교환_포장",`불량 증상 확인되어 교환 접수 도와드릴게요.\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 돼요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 12 o'clock ]</b> 표기 부탁드려요.\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요.`) + caution(`🎁 증정품 회수 X`))}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}<div class="grp-h">b. 검수 및 재출고 안내</div><div class="grid2"><div class="quote-box"><b>⚠️ 유의사항</b>\n① 접수 시간 기준으로 안내 필요\n② 불량으로 인한 재출고는 회수 접수와 동시에 재출고 접수</div>${guide(`🔗 <a href="https://docs.google.com/spreadsheets/d/1t7Oa-rKPY2aYgphNugE5K5gMCP7Hn3joaJYp-bbh7Jw/edit?gid=1012913860#gid=1012913860" target="_blank">[자사/외부몰] 통합 교환/반품 관리</a> 시트에 리스트업 필수!\n👉🏻 회수·재출고 자동 등록`)}</div><div class="grid2">${subcard(`i. 월-금 오후 2시 이전 상담`,"OCAS_무상교환_재출고A",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 예정 \n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}${subcard(`ii. 월-목 오후 2시 이후 상담`,"OCAS_무상교환_재출고B",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}</div>${macro(`iii. 금요일 오후 2시 이후 상담`,"OCAS_무상교환_재출고C",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행`)}</div><div class="h3lvl" id="freePack">🔷 무상 반품 안내</div><div class="lvl3-body"><div class="grp-h">a. 포장 및 회수 안내</div><div class="grid2">${col("blue",`🔹 전체 반품`,subcard(`포장 · 회수 안내`,"OCAS_무상반품_포장전체",`<b>불량 증상 확인되어 전액 환불 접수 도와드릴게요.</b>\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 12 o'clock ]</b> 표기 부탁드려요.\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요.`) + caution(`🎁 증정품 회수 O`))}${col("pink",`🔹 부분 반품`,subcard(`포장 · 회수 안내`,"OCAS_무상반품_포장부분",`불량 증상 확인되어 부분 환불 접수 도와드릴게요.\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 돼요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 12 o'clock ]</b> 표기 부탁드려요.\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요.`) + caution(`🎁 증정품 회수 X`))}</div><div class="stack">${col("gray",`💡 복합 유형 (불량 반품 + 단순변심 반품)`,subcard(`포장 · 회수 안내`,"OCAS_무상반품_포장복합",`<b>전액 환불 접수 도와드릴게요.</b>\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 불량 제품은 박스 윗면에만 <b>[ 불량 / CJ대한통운 / 12 o'clock ]</b> 표기 부탁드려요.\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부돼요.`) + caution(`🎁 증정품 회수 O`))}</div><div class="grid2">${macro(`회수지 확인 필요 시`,"공통_반품_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수는 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}${macro(`네이버 스마트스토어 직접 반품 신청 시`,"OCAS_무상반품_네이버",`네이버를 통해 반품 기사님을 신청해 주신 점 확인되었습니다. :)\n미개봉 제품은 전체 다시 택배 박스에 포장해 주시고, 기사님 방문 시 전달해 주시면 수거가 진행될 예정이에요.`)}</div><div class="grp-h">b. 결제수단별 환불 안내</div><div class="grid2">${col("blue","◆ 카드결제",subcard(`i. 카드결제 취소`,"OCAS_무상반품_환불카드",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있어요.\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻`))}${col("pink","◆ 계좌 환불",`<div class="stack">`+subcard(`i. 계좌 환불 (무통장·가상계좌)`,"OCAS_무상반품_환불계좌1",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드려요.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻`)+subcard(`ii. 이후 계좌 정보 확인`,"OCAS_무상반품_환불계좌2",`소중한 정보 확인 감사해요.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요.`)+`</div>`)}</div></div></div><div class="h2lvl as-major" id="paidFlow">🔧 유상 AS</div>

고객님께서 자체 폐기해 주시면 감사하겠습니다.`,`정확한 금액은 아래 [제품별 유상교환 가격표] 참고 · 표에 없는 제품·최신 여부는 CX팀 확인 후 안내`)}

  <div class="lvl2-body"><div class="h3lvl" id="edgeIn">① 품질보증기간(1년) 이내 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 유사 모델을 '유상교환 가격' 으로 구매 안내\n② 고객이 구매를 원하지 않는 경우 단종 보상 기준에 따라 <b>구입가를 계좌로 환급</b></div>${macro(`i. 단종 안내 및 유사 제품 추천`,"OCAS_단종이내_안내",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드려요.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드려요.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 이내 유상 교환 기준을 적용한 ({1년 이내 기준 유상금액}+3000)원으로 접수 도와드릴게요.\n\n아래 주요 기능과 12 o'clock 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(12 o'clock 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 이내 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"OCAS_단종이내_입금",`네 고객님, 이해해 주셔서 감사해요. 😊\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드릴게요.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 이내 유상 교환 금액)\n🏦 기업은행 075-09598004-017 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드릴게요.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"OCAS_단종이내_폐기",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div><div class="flowgroup">${subcard(`i. 유사 제품 구매 미동의_계좌 환불 안내`,"OCAS_단종이내_미동의",`고객님, 다시 한번 불편을 드려 죄송합니다. 🙏🏻\n다른 제품으로 교환을 원치 않으시다면, 구입가 전액을 계좌로 환급해 드리겠습니다.\n환불을 위해 아래 계좌 정보 전달 부탁드려요.\n\n🏦 은행 / 계좌번호 / 예금주`)}${subcard(`ii. 이후 계좌 정보 확인`,"OCAS_단종이내_계좌확인",`소중한 정보 확인 감사해요.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n💸 입금 안내\n영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요.`)}</div></div>${guide(`👉🏻 i. 유사 제품 구매 동의_입금 안내 시 접수 시점에 따라 출고 안내`)}<div class="grid2">${subcard(`i. 월-금 오후 2시 이전 상담`,"OCAS_단종이내_출고A",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 예정 \n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}${subcard(`ii. 월-목 오후 2시 이후 상담`,"OCAS_단종이내_출고B",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}</div>${macro(`iii. 금요일 오후 2시 이후 상담`,"OCAS_단종이내_출고C",`<b>🚚 교환 제품 재출고 일정 안내드릴게요.</b>\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행`)}</div><div class="h3lvl" id="edgeOut">② 품질보증기간(1년) 경과 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 동일 부위·동일 용도의 유사 제품이 있는지 확인\n② 유사 제품을 품질보증기간(1년) 경과 유상 교환 비용으로 구매할 수 있도록 안내\n③ 고객이 유사 제품 구매를 원하지 않는 경우, <b>감가상각을 반영한 잔여 금액에 구입가의 10%를 가산</b>하여 계좌로 환급</div>${macro(`i. 단종 안내 및 유사 제품 추천`,"OCAS_단종경과_안내",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드려요.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드려요.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 경과 유상 교환 기준을 적용한 ({1년 경과 기준 유상금액}+3000)원으로 접수 도와드릴게요.\n\n아래 주요 기능과 12 o'clock 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(12 o'clock 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 경과 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"OCAS_단종경과_입금",`네 고객님, 이해해 주셔서 감사해요. 😊\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드릴게요.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 경과 유상 교환 금액)\n🏦 기업은행 075-09598004-017 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드릴게요.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"OCAS_단종경과_폐기",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div><div class="flowgroup">${subcard(`i. 유사 제품 구매 미동의_감가상각`,"OCAS_단종경과_미동의",`고객님, 다시 한번 불편을 드려 죄송합니다. 🙏🏻\n문의주신 주문 건은 현재 품질보증기간 1년이 경과한 상태로, 구매 당시 결제 금액과 사용 기간을 반영한 기준에 따라 환급을 도와드릴게요.\n고객님께 적용되는 환불 예정 금액은 (환불예정금액)원이며, 영업일 기준 1~2일 정도 소요돼요.\n환불을 위해 아래 계좌 정보 전달 부탁드려요.\n\n🏦 은행 / 계좌번호 / 예금주`)}${subcard(`ii. 이후 계좌 정보 확인`,"OCAS_단종경과_계좌확인",`소중한 정보 확인 감사해요.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n💸 입금 안내\n영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요.`)}</div></div></div></div>
  ${blueNote(`💰 환급금 계산 가이드`,`<div class="refund-guide-grid"><div style="padding-right:18px">① 구입가 확인\n② 사용개월 확인\n③ 아래 계산식 적용\n\n<b>감가상각비</b> = (사용개월 ÷ 60개월) × 구입가\n<b>잔여금</b> = 구입가 - 감가상각비\n<b>최종 환급금</b> = 잔여금 + 구입가의 10%\n\n※ 12 o'clock 제품의 내용연수는 60개월로 적용합니다.<div class="quote-box" style="margin-top:14px"><b>예시)</b> 김햄찌선풍기 · 구입가 21,900원 · 구입일 2024년 7월 · AS 문의일 2026년 7월 · 사용기간 24개월\n\n· 감가상각비 = (24개월 ÷ 60개월) × 21,900원 = 8,760원\n· 잔여금 = 21,900원 - 8,760원 = 13,140원\n· 구입가의 10% = 21,900원 × 10% = 2,190원\n· <b>최종 환급금</b> = 13,140원 + 2,190원 = <b>15,330원</b></div></div><div style="padding-left:18px;border-left:2px dashed #C7DAF2"><div class="refund-calc" style="margin-top:0"><div class="refund-calc-h">🧮 자동 계산기 (숫자만 입력)</div><div class="refund-calc-row"><label>구입가</label><input type="text" inputmode="numeric" data-role="price" placeholder="예: 99000" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">원</span></div><div class="refund-calc-row"><label>사용개월</label><input type="text" inputmode="numeric" data-role="months" placeholder="예: 24" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">개월</span></div><div class="refund-calc-err"></div><div class="refund-calc-out"><div><span>감가상각비</span><b data-out="dep">0원</b></div><div><span>잔여금</span><b data-out="rem">0원</b></div><div><span>구입가의 10%</span><b data-out="add">0원</b></div><div class="final"><span>최종 환급금</span><b data-out="final">0원</b></div></div></div></div></div><details class="legal-fold"><summary>※ 관련 기준 보기</summary><p>공정거래위원회 소비자분쟁해결기준에 따라 품질보증기간이 경과한 후 부품보유기간 내 수리가 불가능한 경우, 정액 감가상각한 잔여 금액에 구입가의 10%를 가산하여 환급합니다.</p></details>`)}

let SEARCH_INDEX=[], CID_RAIL={};
function stripText(html){return String(html).replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/\s+/g," ").trim();}
function buildSearchIndex(){
  SEARCH_INDEX=[]; CID_RAIL={}; var seen={};
  var _tmp=document.createElement("div");
  function indexContent(cid, fullPath, rail){
    CID_RAIL[cid]=rail;
    if(seen[cid]||!CONTENT[cid]) return; seen[cid]=1;
    _tmp.innerHTML=CONTENT[cid];
    var cards=_tmp.querySelectorAll(".macro, .subcard");
    var idxMap=new Map(); cards.forEach(function(el,i){idxMap.set(el,i);});
    var nodes=_tmp.querySelectorAll(".sec-title, .h1lvl, .h2lvl, .typ, .grp-h, .macro, .subcard");
    var lastHead="";
    nodes.forEach(function(el){
      if(el.classList.contains("macro")||el.classList.contains("subcard")){
        var nm=el.querySelector(".mname, .sc-label"); var name=nm?nm.textContent.trim():"";
        var bd=el.querySelector(".macro-body, .subcard-body"); var body=bd?bd.textContent.trim():"";
        SEARCH_INDEX.push({cid:cid, card:idxMap.get(el), path:fullPath+(lastHead?" › "+lastHead:""), name:name, text:(name+" "+body).trim()});
      } else {
        lastHead=el.textContent.replace(/\s+/g," ").trim();
      }
    });
    var clone=_tmp.cloneNode(true);
    clone.querySelectorAll(".macro, .subcard").forEach(function(e){e.remove();});
    var rest=stripText(clone.innerHTML);
    if(rest) SEARCH_INDEX.push({cid:cid, card:-1, path:fullPath, name:"", text:rest});
  }
  function walk(obj,prefix,rail,railTitle){
    for(var key in obj){ var val=obj[key]; if(!val||typeof val!=="object")continue;
      var path=prefix?prefix+" › "+key:key;
      if(val.__content){ indexContent(val.__content, railTitle+" › "+path, rail); }
      var ck=Object.keys(val).filter(function(k){return k.indexOf("__")!==0;});
      if(ck.length) walk(val,path,rail,railTitle);
    }
  }
  walk(COMMON_TREE,"","home","채팅");
  walk(BRAND_TREE,"","home","채팅");
  if(typeof CALL_TREE!=="undefined") walk(CALL_TREE,"","call","유선");
  if(typeof BOARD_TREE!=="undefined") walk(BOARD_TREE,"","board","게시판");
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hl(t,q){const i=t.toLowerCase().indexOf(q.toLowerCase());if(!q||i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));}
function pathHtml(p){const a=p.split(" › ");return `<b>${esc(a[0])}</b>`+a.slice(1).map(x=>" › "+esc(x)).join("");}

/* 트리 렌더 (재귀) */
function buildTree(obj, prefix){
  let html="";
  for(const key in obj){
    const val=obj[key];
    const path=prefix?prefix+" › "+key:key;
    const hasContent=("__content" in val);
    const sections=val.__sections;
    const childKeys=Object.keys(val).filter(k=>!k.startsWith("__"));
    if(hasContent && sections && sections.length){
      // 문의유형 페이지 + 섹션(소제목) 하위 목록 · sub 항목은 부모 아래 접기
      const cid=val.__content; let secHtml="", si=0;
      while(si<sections.length){
        const sMk=sections[si];
        const attrs=`data-content="${cid}" data-anchor="${sMk.anchor}" data-path="${path} › ${sMk.label}"`;
        if(sMk.group){ secHtml+=`<div class="leaf leaf-secgrp" ${attrs} onclick="pickLeaf(this)">${sMk.label}</div>`; si++; }
        else if(!sMk.sub){
          let sj=si+1; const kids=[];
          while(sj<sections.length && sections[sj].sub){ kids.push(sections[sj]); sj++; }
          if(kids.length){
            const kidHtml=kids.map(k=>`<div class="leaf leaf-sub" data-content="${cid}" data-anchor="${k.anchor}" data-path="${path} › ${k.label}" onclick="pickLeaf(this)">${k.label}</div>`).join("");
            secHtml+=`<div class="sec-parent"><div class="leaf leaf-sec sec-parent-h" ${attrs} onclick="toggleSecParent(this)"><span class="sec-caret">▸</span>${sMk.label}</div><div class="sec-children">${kidHtml}</div></div>`;
            si=sj;
          }else{ secHtml+=`<div class="leaf leaf-sec" ${attrs} onclick="pickLeaf(this)">${sMk.label}</div>`; si++; }
        }
        else{ secHtml+=`<div class="leaf leaf-sub" ${attrs} onclick="pickLeaf(this)">${sMk.label}</div>`; si++; }
      }
      html+=`<div class="node"><div class="node-toggle" data-content="${cid}" data-path="${path}" onclick="nodeOpenContent(this)"><span class="arrow">▶</span>${key}</div><div class="node-children">${secHtml}</div></div>`;
    }else if(childKeys.length){
      html+=`<div class="node"><div class="node-toggle" onclick="toggleNode(this)"><span class="arrow">▶</span>${key}</div><div class="node-children">${buildTree(val,path)}</div></div>`;
    }else{
      const cid=hasContent?val.__content:"";
      html+=`<div class="leaf" data-content="${cid}" data-path="${path}" onclick="pickLeaf(this)"><span class="dot"></span>${key}</div>`;
    }
  }
  return html;
}

function renderTree(){
  const cfg=RAIL[curRail];
  const _t=document.getElementById("sbTitle"); if(_t)_t.textContent=cfg.title;
  const _d=document.getElementById("sbDesc"); if(_d)_d.textContent=cfg.desc;
  const tree=document.getElementById("tree");
  if(cfg.type==="dash"){ tree.innerHTML=""; setCrumb("홈"); render(DASH_HOME); return; }
  if(cfg.type==="bm"){ renderBookmarks(); return; }
  if(cfg.type==="brand"){
    tree.innerHTML=`<div class="group-label">공통</div>`
      +buildTree(COMMON_TREE,"")
      +`<div class="tree-divider"></div>`
      +`<div class="group-label">브랜드</div>`
      +buildTree(BRAND_TREE,"");
  }else if(cfg.type==="tree"){
    tree.innerHTML=buildTree(curRail==="board"?BOARD_TREE:CALL_TREE,"");
    tree.querySelectorAll(".node").forEach(n=>n.classList.add("open"));
  }else{
    tree.innerHTML=cfg.items.map((it,i)=>
      `<div class="leaf ${i===0?'active':''}" data-key="${it.key}" onclick="pickList(this,'${it.key}','${it.label}')"><span class="dot"></span>${it.label}</div>`).join("");
  }
}

function closeSiblings(node){var pr=node.parentElement; if(!pr)return; for(var i=0;i<pr.children.length;i++){var ch=pr.children[i]; if(ch!==node&&ch.classList&&ch.classList.contains("node")) ch.classList.remove("open");}}
function toggleNode(el){var node=el.parentElement; var willOpen=!node.classList.contains("open"); if(willOpen) closeSiblings(node); node.classList.toggle("open");}
function toggleSecParent(el){
  const parent=el.closest(".sec-parent"); if(!parent) return;
  const willOpen=!parent.classList.contains("open");
  pickLeaf(el);
  if(willOpen){ parent.parentElement.querySelectorAll(".sec-parent.open").forEach(x=>{ if(x!==parent) x.classList.remove("open"); }); }
  parent.classList.toggle("open");
}

/* 문의유형 라벨 클릭 = 펼치기 + 페이지 로드(맨 위) */
function nodeOpenContent(el){
  const node=el.parentElement;
  const willOpen=!node.classList.contains("open");
  if(willOpen) closeSiblings(node);
  node.classList.toggle("open");
  if(node.classList.contains("open")){
    CUR_CID=el.dataset.content||"";
    document.querySelectorAll(".leaf").forEach(l=>l.classList.remove("active"));
    setCrumb(`${RAIL[curRail].title} › ${el.dataset.path}`);
    render(CONTENT[el.dataset.content] || emptyState(el.dataset.path));
    const c=document.querySelector(".content"); if(c) c.scrollTop=0;
    commitView();
  }
}

function pickLeaf(el){
  CUR_CID=el.dataset.content||"";
  document.querySelectorAll(".leaf").forEach(l=>l.classList.remove("active"));
  el.classList.add("active");
  setCrumb(`${RAIL[curRail].title} › ${el.dataset.path}`);
  render(CONTENT[el.dataset.content] || emptyState(el.dataset.path));
  const a=el.dataset.anchor;
  if(a){ const t=document.getElementById(a); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); }

}
function pickList(el,key,label){
  CUR_CID=key;
  document.querySelectorAll(".leaf").forEach(l=>l.classList.remove("active"));
  el.classList.add("active");
  setCrumb(`${RAIL[curRail].title} › ${label}`);

}

/* 트리에서 특정 콘텐츠로 이동 (조상 토글 열기) */
function openTo(cid){
  CUR_CID=cid;
  const nt=document.querySelector(`.node-toggle[data-content="${cid}"]`);
  if(nt){
    let p=nt.parentElement;
    while(p){ if(p.classList&&p.classList.contains("node")) p.classList.add("open"); p=p.parentElement; }
    document.querySelectorAll(".leaf").forEach(l=>l.classList.remove("active"));
    setCrumb(`${RAIL[curRail].title} › ${nt.dataset.path}`);
    render(CONTENT[cid] || emptyState(nt.dataset.path));
    const c=document.querySelector(".content"); if(c) c.scrollTop=0;
    nt.scrollIntoView({block:"nearest"});
    return;
  }
  const leaf=document.querySelector(`.leaf[data-content="${cid}"]`);
  if(!leaf){render(emptyState(""));return;}
  let p=leaf.parentElement;
  while(p){ if(p.classList&&p.classList.contains("node")) p.classList.add("open"); p=p.parentElement; }
  pickLeaf(leaf);
  leaf.scrollIntoView({block:"nearest"});
}

function renderSearch(query){
  const q=query.trim(); if(!q){restoreView();return;}
  const ql=q.toLowerCase();
  const all=SEARCH_INDEX.filter(r=>r.text.toLowerCase().includes(ql)||r.path.toLowerCase().includes(ql));
  const hits=all.slice(0,60);
  let html=`<div class="sr-title">검색 결과 <span>${all.length}건</span></div>
    <div class="sr-sub">"${esc(q)}" · 브랜드·채널·유형·템플릿 전체 검색`+(all.length>60?` (상위 60건 표시)`:``)+`</div>`;
  if(!hits.length){
    html+=`<div class="sr-none">🔍<br><br>"${esc(q)}"에 대한 결과가 없습니다.</div>`;
  }else{
    html+=hits.map(r=>{
      const t=r.text, li=t.toLowerCase().indexOf(ql);
      let snip;
      if(li<0){ snip=t.slice(0,90); }
      else { const st=Math.max(0,li-30); snip=(st>0?"… ":"")+t.slice(st,li+q.length+60)+" …"; }
      return `<div class="sr-item" onclick="goResult('${r.cid}',${(typeof r.card==="number")?r.card:-1})">
      <div class="sr-path">${pathHtml(r.path)}${r.name?(" › <b>"+r.name.replace(/</g,"&lt;")+"</b>"):""}</div>
      <div class="sr-snip">${hl(snip,q)}</div>
    </div>`;}).join("");
  }
  render(html);
}

function linkifyPage(){
  var page=document.getElementById("page"); if(!page||!document.createTreeWalker) return;
  var walker=document.createTreeWalker(page, NodeFilter.SHOW_TEXT, null), targets=[], n;
  while((n=walker.nextNode())){
    if(!n.nodeValue || n.nodeValue.indexOf('http')<0) continue;
    var pe=n.parentNode; if(pe && pe.closest && pe.closest('a')) continue;
    if(/https?:\/\//.test(n.nodeValue)) targets.push(n);
  }
  targets.forEach(function(node){
    var parts=node.nodeValue.split(/(https?:\/\/[^\s]+)/g);
    if(parts.length<2) return;
    var frag=document.createDocumentFragment();
    parts.forEach(function(p){
      if(/^https?:\/\//.test(p)){
        var url=p, tail=''; var mt=url.match(/[)\]\.,!?]+$/); if(mt){tail=mt[0]; url=url.slice(0,url.length-tail.length);}
        var a=document.createElement('a'); a.href=url; a.target="_blank"; a.rel="noopener"; a.className="auto-link"; a.textContent=url;
        frag.appendChild(a); if(tail) frag.appendChild(document.createTextNode(tail));
      } else if(p){ frag.appendChild(document.createTextNode(p)); }
    });
    node.parentNode.replaceChild(frag,node);
  });
}

/* 💰 단종 환급금 자동 계산기 (구입가/사용개월 입력 → 감가상각비·잔여금·최종 환급금 자동 산출) */
function calcRefund(el){
  const wrap = el.closest(".refund-calc");
  if(!wrap) return;
  const priceEl = wrap.querySelector('[data-role="price"]');
  const monthEl = wrap.querySelector('[data-role="months"]');
  const errEl = wrap.querySelector(".refund-calc-err");
  let price = parseInt((priceEl.value||"").replace(/[^0-9]/g,""), 10);
  let months = parseInt((monthEl.value||"").replace(/[^0-9]/g,""), 10);
  if(isNaN(price) || price<0) price = 0;
  if(isNaN(months) || months<0) months = 0;
  if(months > 60){
    months = 60;
    errEl.textContent = "※ 사용개월은 내용연수(60개월)까지만 반영됩니다.";
    errEl.style.display = "block";
  } else {
    errEl.style.display = "none";
  }
  const dep = Math.round((months/60) * price);
  const rem = Math.max(price - dep, 0);
  const add = Math.round(price * 0.1);
  const total = rem + add;
  wrap.querySelector('[data-out="dep"]').textContent = dep.toLocaleString()+"원";
  wrap.querySelector('[data-out="rem"]').textContent = rem.toLocaleString()+"원";
  wrap.querySelector('[data-out="add"]').textContent = add.toLocaleString()+"원";
  wrap.querySelector('[data-out="final"]').textContent = total.toLocaleString()+"원";
}

/* 사이드바 너비 드래그 조절 */
(function(){
  const sb=document.querySelector(".sidebar");
  const rz=document.getElementById("sidebarResizer");
  if(!sb||!rz) return;
  const MIN=160,MAX=520;
  try{ const w=parseInt(localStorage.getItem("olit_sidebar_w"),10);
       if(w>=MIN&&w<=MAX) sb.style.width=w+"px"; }catch(e){}
  let dragging=false;
  rz.addEventListener("mousedown",e=>{
    dragging=true; document.body.classList.add("col-resizing"); rz.classList.add("dragging"); e.preventDefault();
  });
  document.addEventListener("mousemove",e=>{
    if(!dragging) return;
    let w=e.clientX-sb.getBoundingClientRect().left;
    if(w<MIN)w=MIN; if(w>MAX)w=MAX;
    sb.style.width=w+"px";
  });
  document.addEventListener("mouseup",()=>{
    if(!dragging) return;
    dragging=false; document.body.classList.remove("col-resizing"); rz.classList.remove("dragging");
    try{ localStorage.setItem("olit_sidebar_w", parseInt(sb.style.width,10)); }catch(e){}
  });
})();

/* 스크롤 위치에 맞춰 트리 소제목 색인 (스크롤스파이) */
function updateScrollSpy(){
  if(!CUR_CID) return;
  const c=document.querySelector(".content"); if(!c) return;
  const leaves=[];
  document.querySelectorAll(".leaf[data-anchor]").forEach(l=>{ if(l.dataset.content===CUR_CID) leaves.push(l); });
  if(!leaves.length) return;
  const cTop=c.getBoundingClientRect().top;
  let best=null,bestPos=-1e9;
  leaves.forEach(l=>{
    const el=document.getElementById(l.dataset.anchor); if(!el) return;
    const rel=el.getBoundingClientRect().top-cTop;
    if(rel<=110 && rel>bestPos){ bestPos=rel; best=l; }
  });
  if(!best) best=leaves[0];
  if(best.classList.contains("active")) return;
  document.querySelectorAll(".leaf.active").forEach(l=>l.classList.remove("active"));
  best.classList.add("active");
  if(best.classList.contains("leaf-sub")){
    const sp=best.closest(".sec-parent");
    if(sp && !sp.classList.contains("open")){
      sp.parentElement.querySelectorAll(".sec-parent.open").forEach(x=>x.classList.remove("open"));
      sp.classList.add("open");
    }
  }
}
(function(){
  const c=document.querySelector(".content"); if(!c) return;
  let ticking=false;
  c.addEventListener("scroll",()=>{
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{ updateScrollSpy(); ticking=false; });
  });
})();

 상담 가능 시간 : 월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)"}, {"i": 3, "html": "남겨주신 반품 사유와 같이 이미 개봉·사용하신 뒤 불만족으로 반품을 희망하시는 경우, 공식몰에서 주문하신 고객님에 한하여 [100% 환불이벤트]를 진행해드리고 있어요.\n\n30일 이내 무조건 반품이 아닌, 수령하신 뒤 30일 이후 ~ 40일 이내 접수 가능해요.\n(*공식몰 주문 건에 한하여 단 1회, 상품 1종 적용 가능)\n\n[100% 환불 이벤트]는 제품을 꾸준히 사용해 보신 후에도 만족하시지 못한 경우, 수령일 기준 30~40일 이내 환불을 도와드리는 서비스입니다. (*왕복 배송비 6,000원 차감)\n\n따라서 번거로우시겠지만, 이벤트 기간인 (주문 건별 신청 가능일자 기재) 내 다시 접수가 필요해요.\n현재 고객님의 접수 가능 기간이 아니기에 접수가 어려운 상황으로, 불만족 시 이벤트 기간 내 채팅 상담으로 접수 부탁드려요.\n\n👉🏻 셀올로지 채팅 상담 바로가기 : http://cellology.channel.io/\n※ 상담 가능 시간 : 월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)"}, {"i": 4, "html": "고객님, 제품은 꾸준히 사용하실수록 만족도가 높다는 후기가 많아 꾸준한 사용을 권장드리고 있어요.\n\n만약 사용법에 맞게 지속적으로 사용하셨음에도 만족스럽지 않으셨다면,  기간 내 문의 주시는 경우 이벤트 조건에 맞춰 환불 절차 안내 도와드리고 있어요.\n\n저희 셀올로지를 믿고 조금만 더 사용해 보신 뒤 기간 내 채팅 상담으로 접수 부탁드려요💙\n\n👉🏻 셀올로지 채팅 상담 바로가기 : http://cellology.channel.io/\n※ 상담 가능 시간 : 월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)"}, {"i": 5, "html": "더불어 개봉 후 사용하신 제품은 남겨주신 반품 사유와 같이 사용 후 불만족으로 인해 원칙적으로 반품이 불가한 품목입니다. 💧\n\n아래 유사한 소비자원 사례 전달드리며, 말씀드린 내용처럼 본래 반품이 불가한 상황이나 꾸준히 사용해 보셨음에도 불만족하시는 경우 예외 반품을 도와드리는 100% 환불 이벤트를 진행하고 있으니 해당 기간에 맞춰 신청을 부탁드릴게요."}, {"i": 6, "html": "네, 고객님. 이용에 번거로움을 드려 죄송합니다. 🙏🏻\n\n 상세 조건이 안내된 페이지도 함께 전달드려요. 💙\n내용 확인 후, 기간 내 채팅 상담으로 접수 부탁드려요.\n\n궁금하신 점이나 어려우신 부분 있으시면 언제든 편하게 말씀해 주세요💙\n\n👉🏻 상세 조건 : https://cellology.cafe24.com/skin-skin4/article/%EA%B3%B5%EC%A7%80%EC%82%AC%ED%95%AD/1/76/\n👉🏻 셀올로지 채팅 상담 바로가기 : http://cellology.channel.io/\n※ 상담 가능 시간 : 월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)"}, {"i": 7, "html": "네, 고객님. 제품 사용 후 기대하신 만족을 드리지 못해 안타까워요. 💧\n다만 앞서 안내드린 것처럼, 개봉하여 사용하신 제품은 원칙적으로 반품이 어려워요.\n\n또한 셀올로지에서 운영 중인 는 제품군별로 신청·환불 기준이 다릅니다.\n· 디바이스 : 배송 완료 후 40일 이내 신청 / 수령 후 30일 동안 꾸준히 사용\n· 화장품 : 배송 완료 후 40일 이내 신청 / 수령 후 30일 이내, 2/3 사용\n\n고객님의 경우 (배송 완료일) 배송 완료 기준으로 신청 가능 기간이 경과되어 환불 도움을 드리기 어려운 점 양해 부탁드려요."}, {"i": 8, "html": "네, 고객님. 제품 사용 후 기대하신 만족을 드리지 못해 안타까워요. 💧\n\n현재 셀올로지에서는 첫 구매 고객님을 위한 를 운영 중입니다💙\n수령일 기준 30일간 꾸준히 사용하신 뒤에도 만족하지 못하신 경우, 해당 조건에 따라 환불을 도와드리고 있어요.\n\n 참여를 원하신다면 바로 안내 도와드릴게요!"}, {"i": 9, "html": "는 제품을 30일간 꾸준히 사용하신 경우, 배송 완료 후 40일 이내 신청 가능해요💙\n\n해당 서비스는 첫 구매 고객님을 위한 1회 한정 체험 혜택으로, 1회 이상 환불 이력이 있을 경우 대상에서 제외돼요.\n\n또한, 구매하신 제품 구성에 따라 적용 조건이 다를 수 있으니 자세한 내용은 아래 링크를 꼭 참고 부탁드려요.\n\n👉🏻 상세 조건 확인하기 : https://cellology.cafe24.com/skin-skin4/article/%EA%B3%B5%EC%A7%80%EC%82%AC%ED%95%AD/1/76/"}, {"i": 10, "html": "네이버페이 결제는 부분 취소가 어려워 반품 배송비 6,000원 입금 후 반품이 가능해요.\n\n반품 배송비 : 6,000원\n🏦 기업은행 078-219021-04-021 (예금주: 주식회사 더마)\n\n위 계좌로 송금해 주신 다음 '입금자명'을 말씀해 주시면 확인 후 도와드리겠습니다."}, {"i": 11, "html": "반품 배송비 6,000원 제외 후 반품으로 진행해 드려요."}, {"i": 12, "html": "접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 제품 전체\n■ 구성품 전체 (케이블·설명서 등)\n■ 사은품·증정품(받으신 경우)\n\n✍🏽 택배 박스 윗면에 [★100% 환불★] 기재 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요.\n\n※ 화장품은 케이블·설명서 등 별도 구성품이 없는 경우 해당 항목에서 제외해 주세요."}, {"i": 13, "html": "고객님, 동일한 상품을 1개 이상 구매하신 경우에는 체험용 1개 외 나머지 상품은 개봉 또는 손상 없이 보관된 경우에만 전액 환불이 가능해요.\n\n체험 상품 1개를 제외하고, 나머지 상품 모두 미개봉 상태가 맞으실까요? 확인 부탁드려요. 💙"}, {"i": 14, "html": "네이버페이 결제는 부분 취소가 어려워 반품 배송비 6,000원 입금 후 반품이 가능해요.\n\n반품 배송비 : 6,000원\n🏦 기업은행 078-219021-04-021 (예금주: 주식회사 더마)\n\n위 계좌로 송금해 주신 다음 '입금자명'을 말씀해 주시면 확인 후 도와드리겠습니다."}, {"i": 15, "html": "반품 배송비 6,000원 제외 후 반품으로 진행해 드려요."}, {"i": 16, "html": "접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 돼요.\n\n✍🏽 택배 박스 윗면에 [★100% 환불★] 기재 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 17, "html": "확인해 주셔서 감사해요. 💙\n\n다만, 동일 상품을 1개 이상 또는 세트로 구매하신 경우 체험 상품 1개 외에는 미개봉 상태일 때만 전액 환불이 가능해요.\n\n현재 (개봉된 박스 개수 기재)개 개봉된 상태로 확인되어, 개봉 상품에 대해서는 차감 후 환불이 가능해요.\n(상품명) (개봉된 박스 개수 기재) (금액)과 반품 배송비 6,000원을 제외한 환불 금액 안내 도와드릴게요."}, {"i": 18, "html": "네이버페이 결제는 부분 취소가 어려워, 사용하신 제품 금액과 반품 배송비를 입금해 주신 후 반품 처리가 가능해요.\n\n(제품명) : (가격)\n반품 배송비 : 6,000원\n🏦 기업은행 078-219021-04-021 (예금주: 주식회사 더마)\n\n위 계좌로 송금해 주신 다음 '입금자명'을 말씀해 주시면 확인 후 도와드리겠습니다."}, {"i": 19, "html": "반품 배송비 6,000원과 개봉하여 반품이 어려운 (사용할 제품명) (정가) 제외 후 반품으로 진행해 드려요."}, {"i": 20, "html": "접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 제품 전체\n■ 구성품 전체 (케이블·설명서 등)\n■ 사은품·증정품(받으신 경우)\n\n✍🏽 택배 박스 윗면에 [★100% 환불★] 기재 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요.\n\n※ 화장품은 케이블·설명서 등 별도 구성품이 없는 경우 해당 항목에서 제외해 주세요."}, {"i": 22, "html": "구성이 다른 세트 상품을 구매해 주셨기 때문에, 각 상품을 모두 개봉해 체험하신 경우에도 왕복 배송비를 제외한 전액 환불이 가능해요."}, {"i": 23, "html": "네이버페이 결제는 부분 취소가 어려워 반품 배송비 6,000원 입금 후 반품이 가능해요.\n\n반품 배송비 : 6,000원\n🏦 기업은행 078-219021-04-021 (예금주: 주식회사 더마)\n\n위 계좌로 송금해 주신 다음 '입금자명'을 말씀해 주시면 확인 후 도와드리겠습니다."}, {"i": 24, "html": "반품 배송비 6,000원 제외 후 반품으로 진행해 드려요."}, {"i": 25, "html": "접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 제품 전체\n■ 구성품 전체 (케이블·설명서 등)\n■ 사은품·증정품(받으신 경우)\n\n✍🏽 택배 박스 윗면에 [★100% 환불★] 기재 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 26, "html": "고객님의 경우, 하나의 주문에서 여러 제품을 구매하신 세트 구성 형태가 아닌 개별 주문건으로 확인되고 있어요.\n\n는 공지사항에 안내된 대로 회원당 1회만 신청 가능한 첫 구매 체험 서비스이기 때문에, 주문 1건에 한해서만 이벤트 신청이 가능한 점 양해 부탁드려요."}, {"i": 27, "html": "고객님의 경우, 셀올로지에서 제공하는 세트 구성 상품이 아닌 원하시는 제품을 개별로 선택해 구매하신 주문건으로 확인돼요.\n\n는 공지사항에 안내된 대로, 상품명에 '세트(SET)'가 포함된 세트 구성만 '구성이 다른 세트 상품'에 해당되는 점 양해 부탁드려요."}, {"i": 29, "html": "환불은 아래 절차를 거쳐 진행되며, 영업일 기준 약 6~8일 정도 소요돼요.\n\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는 반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있어요."}, {"i": 30, "html": "환불은 아래 절차를 거쳐 진행되며, 영업일 기준 약 6~8일 정도 소요돼요.\n\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해 주신 점 확인되어, 환불을 위해 아래 계좌 정보 전달해 주세요.\n\n🏦 은행 / 계좌번호 / 예금주"}, {"i": 31, "html": "정보 확인해 주셔서 감사해요. 💙\n해당 계좌로 환불 계좌 등록이 완료되었어요.\n\n💸 입금 안내\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요."}], "cel_as": [{"i": 0, "html": "제품 사용 후 만족스러운 경험을 드리지 못해 정말 죄송합니다. 🙏🏻"}, {"i": 1, "html": "고객님, 번거로우시겠지만\n불량으로 의심되는 증상에 대해 조금 더 자세히 말씀해 주실 수 있을까요?\n\n말씀해 주신 내용을 바탕으로 정확하게 안내 도와드릴게요. 💙"}, {"i": 2, "html": "고객님, 문의주신 (제품명)의 올바른 사용법 먼저 안내드려요.\n\n사용법과 다르게 사용하실 경우 정상 작동이 어려울 수 있어, 안내드린 방식대로 사용해 보셨는지 확인 부탁드려요. 💙"}, {"i": 4, "html": "(제품명)은 정격 전압이 5V 2A 제품으로, 고속 충전기 사용 시 기기가 고장 날 수 있어요.\n\n동봉된 전용 케이블과 함께 5V 2A 어댑터 (셀올로지 전용 어댑터 사용 가능) 또는 PC/노트북의 USB 포트를 이용해 충전해 주세요.\n\n또한 해당 제품은 무선 제품으로, 충전 중에는 작동되지 않습니다.\n번거로우시겠지만, 위 안내 방식대로 충전 및 사용해주셨는지 확인 부탁드려요. 💙"}, {"i": 5, "html": "휴대폰 충전용 고속 충전기를 사용하실 경우, 기기 고장의 원인이 될 수 있어요.\n\n번거로우시겠지만,\n동봉된 전용 케이블과 함께 5V 2A 어댑터 (셀올로지 전용 어댑터 사용 가능) 또는 PC/노트북의 USB 포트를 이용해 충전해 주세요."}, {"i": 6, "html": "(제품명)은 정격 전압이 5V 1A 제품으로, 고속 충전기 사용 시 기기가 고장 날 수 있어요.\n\n동봉된 전용 케이블과 함께 5V 1A 어댑터 또는 PC/노트북의 USB 포트를 이용해 충전해 주세요.\n\n또한 해당 제품은 무선 제품으로, 충전 중에는 작동되지 않습니다.\n번거로우시겠지만, 위 안내 방식대로 충전 및 사용해주셨는지 확인 부탁드려요. 💙"}, {"i": 7, "html": "(제품명)은 정격 전압이 5V 1A 제품으로, 고속 충전기 사용 시 기기가 고장 날 수 있어요.\n\n동봉된 전용 케이블과 함께 5V 1A 어댑터 또는 PC/노트북의 USB 포트를 이용해 충전해 주세요.\n\n또한 해당 제품은 무선 제품으로, 충전 중에는 작동되지 않습니다.\n번거로우시겠지만, 위 안내 방식대로 충전 및 사용해주셨는지 확인 부탁드려요. 💙"}, {"i": 8, "html": "(ex. 충전이 안 돼요. 충전하는데 빨간불이 안들어와요 등)\n\n📷 고객님, 정확한 불량 증상 확인을 위해\n번거로우시겠지만 아래 4가지가 모두 확인되도록 촬영 부탁드려요.\n\n1️⃣ 충전 중인 제품 상태\n2️⃣ 충전기(어댑터) 정격전압의 ( 5V 2A or 5V 1A ) 표시\n3️⃣ 전용 케이블 연결 상태 (케이블선이 연결된 모습 포함)\n4️⃣ 충전 시 LED 표시등 작동 여부"}, {"i": 9, "html": "(ex. 충전 후 전원을 눌러도 작동이 안 돼요 등)\n\n📷 고객님, 정확한 불량 증상 확인을 위해\n번거로우시겠지만 아래 3가지가 모두 확인되도록 촬영 부탁드려요.\n\n1️⃣ 충전기(어댑터) 정격전압의 ( 5V 2A or 5V 1A ) 표시\n2️⃣ 충전 시 사용된 케이블\n3️⃣ 케이블선 제거 후 제품 버튼을 눌러도 작동하지 않는 장면"}, {"i": 10, "html": "고객님, 첨부해주신 사진/영상은 확인되었어요💙\n다만, 정격전압 확인이 어려워 어댑터의 ( 5V 2A or 5V 1A ) 표기가 보이도록 추가 촬영 부탁드려요 🙏🏽\n\n※ 적정 정격전압이 아닌 충전기 사용 시 제품 작동 이상이나 고장의 원인이 될 수 있어 확인이 필요한 점 양해 부탁드려요.\n\n※ 숫자와 표기가 선명하게 보이도록 가까이서 촬영 부탁드려요."}, {"i": 11, "html": "📷 고객님, 정확한 불량 증상 확인을 위해\n번거로우시겠지만 아래 2가지가 모두 확인되도록 촬영 부탁드려요.\n\n1️⃣ 불량 증상이 나타나는 장면 (작동 시도 영상)\n2️⃣ 충전기(어댑터) 정격전압의 5V 2A 표시\n\n※ 정격전압이 아닌 충전기 사용 시 제품 오작동 및 고장의 원인이 될 수 있어 확인이 필요한 점 양해 부탁드려요."}, {"i": 12, "html": "고객님, 번거로우시겠지만 수령하신 제품의 (스크래치·이물질) 상태가 확인되도록 사진을 보내주시면 빠르게 확인 후 안내드릴게요. 💙"}, {"i": 13, "html": "제품 (스크래치·이물질)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드려요. 💧"}, {"i": 14, "html": "고객님, 앞서 안내드린 것처럼 제품 (스크래치·이물질)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 스크래치·이물질 상태가 확인되도록 사진 전송 부탁드려요.\n확인 후 안내드릴게요. 💙"}, {"i": 15, "html": "불편을 드려 죄송합니다. 🙏🏻\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있어요.\n어떤 방법으로 진행해 드릴까요?💙"}, {"i": 16, "html": "고객님, 번거로우시겠지만 수령하신 제품의 구성품 전체가 확인되도록 사진을 보내주시면\n빠르게 확인 후 안내드릴게요. 💙"}, {"i": 17, "html": "구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드려요. 💧"}, {"i": 18, "html": "고객님, 앞서 안내드린 것처럼 구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능해요.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 구성품 전체가 확인되도록 사진 전송 부탁드려요.\n확인 후 안내드릴게요. 💙"}, {"i": 19, "html": "확인해 주셔서 감사해요. 💙\n이용에 불편을 드려 정말 죄송합니다. 🙏🏻\n누락된 (구성품명)은 재출고로 진행해 드리겠습니다."}, {"i": 21, "html": "확인해 주셔서 감사해요. 💙\n\n🚚 재출고 일정 안내드릴게요.\n\n· 출고 : 영업일 2일 이내\n· 배송 : 접수일로부터 영업일 5~6일 소요\n· 택배사 : CJ대한통운\n\n※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 양해 부탁드려요."}, {"i": 22, "html": "전액 환불 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 23, "html": "환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있어요.\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻"}, {"i": 24, "html": "환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해 주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달해 주세요.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻"}, {"i": 25, "html": "정보 확인해 주셔서 감사해요. 💙\n해당 계좌로 환불 계좌 등록이 완료되었어요.\n\n💸 입금 안내\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요."}, {"i": 26, "html": "교환 받으신 제품에서도 동일한 증상이 발생하여 많이 당황스러우셨을 것 같아요.\n다시 한 번 불편을 드리게 된 점 진심으로 사과드려요. 💧"}, {"i": 27, "html": "불편을 드려 죄송합니다. 🙏🏻\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있어요.\n어떤 방법으로 진행해 드릴까요?💙"}, {"i": 28, "html": "불량 증상 확인되어 교환 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 돼요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 30, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운"}, {"i": 31, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운"}, {"i": 32, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행"}, {"i": 33, "html": "불량 증상 확인되어 전액 환불 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 34, "html": "불량 증상 확인되어 부분 환불 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 돼요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 35, "html": "전액 환불 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 불량 제품은 박스 윗면에만 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 37, "html": "네이버를 통해 반품 기사님을 신청해 주신 점 확인되었어요. 💙\n미개봉 제품은 전체 다시 택배 박스에 포장해 주시고, 기사님 방문 시 전달해 주시면 수거가 진행될 예정이에요."}, {"i": 38, "html": "환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있어요.\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻"}, {"i": 39, "html": "환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해 주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달해 주세요.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻"}, {"i": 40, "html": "정보 확인해 주셔서 감사해요. 💙\n해당 계좌로 환불 계좌 등록이 완료되었어요.\n\n💸 입금 안내\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요."}, {"i": 41, "html": "셀올로지 디바이스의 AS 품질 보증 기간은 상품 수령일 기준 1년이며, 이는 무상·유상 AS를 모두 포함한 전체 기간입니다.\n\n상세 AS 기준은 아래와 같아요.\n\n■ 상품 수령 후 6개월 이내\n • 제품 자체 고장 → 무상 AS\n • 소비자 과실 → 유상 AS (유상 교환)\n\n■ 상품 수령 후 6개월 ~ 1년 이내\n • 원인 불문 → 유상 AS (유상 교환)\n\n셀올로지의 유상 AS는 동일한 새 제품 교환으로 진행돼요.\n\n✅ 기존 제품은 별도 회수 없이,\n고객님께서 자체 폐기해 주시면 감사하겠습니다."}, {"i": 42, "html": "제품을 수령하신 지 1년이 경과하여 공식 품질보증기간은 종료된 것으로 확인돼요.\n\n다만 보증기간이 지나 제품에 대한 서비스를 받지 못하신 채 그대로 폐기하시거나, 새 제품을 다시 구매하시기에는 비용적으로 많이 부담스러우실 것 같아요.\n\n이러한 고객님의 부담을 덜어드리고자, 보증기간이 경과한 제품이라도 유상 AS(유상 교환) 서비스를 통해 지속해서 제품을 사용하실 수 있도록 도와도와드리려고 해요."}, {"i": 43, "html": "우선 {주문일시} 주문 건으로 무상 보증기간이 경과하여,\n제품 불량 확인 후 유상AS로만 접수 가능한 점 양해 부탁드려요.\n\n결제는 무통장 입금으로만 가능하며,\n배송비 3,000원을 포함해 총 ({제품별 유상금액}+3000)원입니다.\n\n이 부분 진행 의사가 있다 하시면\n\n▶ 기업은행 078-219021-04-021 (예금주: 더마)\n\n위 계좌로 송금해 주신 다음\n[입금자 성함, 수령인 성함, 주소, 핸드폰번호]를 답장으로 말씀해 주세요."}, {"i": 44, "html": "고객님, 기존 제품 회수도 가능하나,\n회수 진행 시 수거비 3,000원이 추가돼요.\n\n이 경우 왕복 배송비 6,000원(수거+배송)을 포함해 총 {(제품별 유상금액) + 6000}원입니다.\n\n기존 제품 회수까지 함께 진행해 드릴까요?"}, {"i": 45, "html": "고객님, 유상 교환 비용이 부담스럽게 느껴지실 수 있는 점 충분히 충분히 이해합니다. 🥲\n\n셀올로지 제품의 AS 품질보증기간은 상품 수령일로부터 1년이며, 해당 기간 내에는 품질보증 기준에 따라 무상 또는 유상 AS를 제공하고 있어요.\n다만, 품질보증기간이 경과한 이후에도 제품을 계속 사용하고자 하시는 고객님들을 위해 유상 AS (유상 교환 서비스)를 운영하고 있어요.\n\n현재 안내드린 금액은 품질보증기간 경과 후 유상 교환 서비스를 이용하실 때 적용되는 비용인 점 양해 부탁드려요."}, {"i": 46, "html": "🚚 입금이 정상적으로 확인되어 새 제품 출고를 진행해 드리겠습니다.\n\n· 출고 : 오늘 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 제품의 안전한 사용을 위해 동봉된 사용설명서와 정격 전압 어댑터(전용 케이블) 사용을 꼭 안내드려요."}, {"i": 47, "html": "🚚 입금이 정상적으로 확인되어 새 제품 출고를 진행해 드리겠습니다.\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 제품의 안전한 사용을 위해 동봉된 사용설명서와 정격 전압 어댑터(전용 케이블) 사용을 꼭 안내드려요."}, {"i": 48, "html": "🚚 입금이 정상적으로 확인되어 새 제품 출고를 진행해 드리겠습니다.\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행\n※ 제품의 안전한 사용을 위해 동봉된 사용설명서와 정격 전압 어댑터(전용 케이블) 사용을 꼭 안내드려요."}, {"i": 49, "html": "고객님, 안내드린 계좌로 입금이 확인되지 않아 이번 유상 교환 접수는 종료돼요.\n\n편하게 고민해 보시고 의사가 있다 하시면, 위 안내드린 계좌에 입금해 주신 후 다시 문의 부탁드려요. 💙"}, {"i": 50, "html": "고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드려요.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드려요.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 이내 유상 교환 기준을 적용한 ({1년 이내 기준 유상금액}+3000)원으로 접수 도와드릴게요.\n\n아래 주요 기능과 셀올로지 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(셀올로지 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)"}, {"i": 51, "html": "네, 고객님. 이해해 주셔서 감사해요. 💙\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드릴게요.\n\n💳 입금 금액\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 이내 유상 교환 금액)\n🏦 기업은행 078-219021-04-021 (예금주 : 더마)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드릴게요."}, {"i": 53, "html": "고객님, 다시 한번 불편을 드려 죄송합니다. 🙏🏻\n다른 제품으로 교환을 원치 않으시다면, 구입가를 공식몰 포인트로 환급해 드리겠습니다.\n포인트는 주문하신 계정과 동일한 계정으로 지급되며, 지급까지는 영업일 기준 1~2일 정도 소요돼요."}, {"i": 54, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운"}, {"i": 55, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운"}, {"i": 56, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행"}, {"i": 57, "html": "고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드려요.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드려요.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 경과 유상 교환 기준을 적용한 ({1년 경과 기준 유상금액}+3000)원으로 접수 도와드릴게요.\n\n아래 주요 기능과 셀올로지 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(셀올로지 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)"}, {"i": 58, "html": "네, 고객님. 이해해 주셔서 감사해요. 💙\n\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드릴게요.\n\n💳 입금 금액\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 경과 유상 교환 금액)\n🏦 기업은행 078-219021-04-021 (예금주 : 더마)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드릴게요."}, {"i": 60, "html": "고객님, 다시 한번 불편을 드려 죄송합니다. 🙏🏻\n\n문의주신 주문 건은 현재 품질보증기간 1년이 경과한 상태로, 구매 당시 결제 금액과 사용 기간을 반영한 기준에 따라 환급을 도와드릴게요.\n\n고객님께 적용되는 환불 예정 금액은 (환불예정금액)원이며, 영업일 기준 1~2일 정도 소요돼요.\n환불을 위해 아래 계좌 정보 전달해 주세요.\n\n🏦 은행 / 계좌번호 / 예금주"}, {"i": 61, "html": "정보 확인해 주셔서 감사해요. 💙\n해당 계좌로 환불 계좌 등록이 완료되었어요.\n\n💸 입금 안내\n영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요."}, {"i": 62, "html": "안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드려요.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n전액 환불로 처리해 드리겠습니다.\n\n카드 승인 취소(환불 완료)까지 영업일 기준 3~5일 소요될 수 있어요.\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드려요.\n\n👉🏻 셀올로지 채팅상담\n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 정말 죄송합니다. 🙏🏻"}, {"i": 63, "html": "안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 '검수 결과'를 안내드려요.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n전액 환불로 처리해 드리겠습니다.\n\n접수 시 말씀해주신 고객님 명의 계좌로 환불 등록해 드렸으며,\n입금까지 영업일 기준 1~2일 소요될 수 있는 점 참고 부탁드려요.\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드려요.\n\n👉🏻 셀올로지 채팅상담\n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 정말 죄송합니다. 🙏🏻"}, {"i": 64, "html": "안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드려요.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n교환 제품은 접수 시 요청하신 주소로 발송 예정이에요.\n\n🚚 재출고 일정\n· 출고 : 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드려요.\n\n👉🏻 셀올로지 채팅상담\n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 정말 죄송합니다. 🙏🏻"}, {"i": 65, "html": "안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드려요.\n\n■ 제품명 :\n■ 확인 결과 : 정상\n\n※ 정상 제품은 수거 시 등록된 주소로 재발송 진행 예정이며,\n시간이 다소 소요되어 불편을 드린 점 정말 죄송합니다. 🙏🏻\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드려요.\n\n👉🏻 셀올로지 채팅상담\n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 정말 죄송합니다. 🙏🏻"}, {"i": 66, "html": "제품 사용 후 기대하신 만족을 드리지 못해 정말 죄송합니다. 🙏🏻"}, {"i": 67, "html": "고객님, 번거로우시겠지만\n불량으로 의심되는 증상에 대해 조금 더 자세히 말씀해 주실 수 있을까요?\n\n말씀해 주신 내용을 바탕으로 정확하게 안내 도와드릴게요. 💙"}, {"i": 68, "html": "고객님, 버블이 잘 생성되지 않아 많이 당황스러우셨을 것 같아요. 💧\n\n혹시 사용하실 때 얼굴이나 손에 물기가 남아있는 상태에서 사용하셨을까요?\n\n율무 톡스 버블팩은 물기가 없는 마른 얼굴에 사용해야 버블이 정상적으로 생성돼요.\n물기가 있는 상태에서 사용하시면 버블이 약하게 올라오거나 생성되지 않을 수 있어요.\n\n번거로우시겠지만, 아래 순서대로 다시 한번 사용해 보시길 부탁드려요.\n\n📋 올바른 사용 방법\n\n① 세안 후 얼굴의 물기를 완전히 닦아냅니다.\n② 물기가 없는 얼굴에 적당량을 골고루 펴 발라줍니다.\n③ 약 2~3분 후 버블이 충분히 올라오면, 손에 물을 살짝 묻혀 부드럽게 롤링하며 마사지한 뒤 미온수로 깨끗하게 헹궈주세요.\n\n위와 같이 물기가 없는 상태에서 사용하셨음에도 버블이 전혀 생성되지 않는다면, 다시 말씀해 주세요.\n제품 상태를 빠르게 확인하여 안내 도와드릴게요. 💙"}, {"i": 69, "html": "고객님, 번거로우시겠지만 말씀해주신 증상이 확인될 수 있는 사진이나 영상을 보내주실 수 있을까요?\n보내주신 자료를 확인한 후 정확한 안내 도와드릴게요. 💙"}, {"i": 70, "html": "불편을 드려 죄송합니다. 🙏🏻\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있어요.\n어떤 방법으로 진행해 드릴까요?💙"}, {"i": 71, "html": "불량 증상 확인되어 교환 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 돼요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 73, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운"}, {"i": 74, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운"}, {"i": 75, "html": "🚚 교환 제품 재출고 일정 안내드릴게요.\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행"}, {"i": 76, "html": "불량 증상 확인되어 전액 환불 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 77, "html": "불량 증상 확인되어 부분 환불 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 돼요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 78, "html": "전액 환불 접수 도와드릴게요.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 불량 제품은 박스 윗면에만 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 방문 시 직접 전달 또는 문 앞 보관 부탁드려요.\n\n💡 택배·제품 자체 박스가 없는 경우 대체 가능한 택배 박스에 포장해 주세요.\n⚠️ 박스 포장이 아닐 경우 수거가 거부될 수 있어요."}, {"i": 80, "html": "네이버를 통해 반품 기사님을 신청해 주신 점 확인되었어요. 💙\n미개봉 제품은 전체 다시 택배 박스에 포장해 주시고, 기사님 방문 시 전달해 주시면 수거가 진행될 예정이에요."}, {"i": 81, "html": "환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있어요.\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻"}, {"i": 82, "html": "환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요돼요.\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해 주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달해 주세요.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다. 🙏🏻"}, {"i": 83, "html": "정보 확인해 주셔서 감사해요. 💙\n해당 계좌로 환불 계좌 등록이 완료되었어요.\n\n💸 입금 안내\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있어요."}, {"i": 84, "html": "네, 고객님. (쿠팡 또는 네이버)를 통해 회수 진행 중인 점 확인되었어요.\n다만, 상품이 물류센터에 입고된 뒤 검수 절차를 거쳐야 하므로 즉시 처리는 어려운 점 양해 부탁드려요. 💙\n\n회수 완료 후 영업일 기준 2~3일 정도 소요될 수 있으니 참고 부탁드려요."}, {"i": 85, "html": "고객님께서 말씀해주신 증상을 기준으로 검수 도와드릴 예정이에요.\n\n번거로우시겠지만\n불량 증상에 대해 조금 더 자세히 말씀해주실 수 있을까요?\n\n말씀해 주신 내용을 바탕으로 정확한 접수 도와드릴게요. 💙\n\n예: 충전했는데 전원이 켜지지 않음 / 버튼 눌러도 반응 없음 등"}, {"i": 86, "html": "물류센터로 고객님의 제품이 입고되면,\n접수해 주신 증상을 바탕으로 검수를 진행하여 최종 불량 여부를 확인하게 돼요.\n\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n검수는 회수 완료 후 영업일 기준 2~3일 정도 소요되며,\n불량으로 확인될 경우 문자 안내 후 결제하신 수단으로 환불을 도와드릴게요.\n\n최대한 빠르게 처리될 수 있도록 노력하겠습니다. 🙂\n\n※ 검수 결과는 문자로 별도 안내드려요.\n※ 정상 제품으로 확인될 경우에는 제품이 고객님께 반송될 수 있어요."}, {"i": 87, "html": "네, 고객님. (쿠팡 또는 네이버)를 통해 회수 진행 중인 점 확인되었어요.\n상품이 물류센터에 입고되면, 말씀해주신 증상을 기준으로 검수를 진행할 예정이에요.\n\n번거로우시겠지만, 어떤 증상이 있었는지 조금 더 자세히 알려주시면 감사하겠습니다💙"}, {"i": 88, "html": "고객님께서 말씀해 주신 불량 증상을 바탕으로 교환 처리 도와드릴게요.\n이용에 불편을 드려 정말 죄송합니다. 🙏🏻"}],};
  function closeOf(s,start){var depth=0,re=/<div\b|<\/div>/g;re.lastIndex=start;var m;while((m=re.exec(s))){depth+=(m[0]==='</div>'?-1:1);if(depth===0)return re.lastIndex;}return s.length;}
  Object.keys(MAP).forEach(function(key){
    var s=CONTENT[key]; if(!s) return;
    var re=/<div class="(?:macro-body|subcard-body)">/g,mm,list=[];
    while((mm=re.exec(s))){list.push({open:mm.index,innerStart:mm.index+mm[0].length});}
    var reps=MAP[key].filter(function(x){return x.i<list.length;}).slice().sort(function(a,b){return b.i-a.i;});
    reps.forEach(function(rep){var it=list[rep.i];var end=closeOf(s,it.open);s=s.slice(0,it.innerStart)+rep.html+s.slice(end-6);});
    CONTENT[key]=s;

    var re=/<div class="(?:macro-body|subcard-body)">/g,mm,list=[];
    while((mm=re.exec(s))){list.push({open:mm.index,innerStart:mm.index+mm[0].length});}
    var reps=MAP[key].filter(function(x){return x.i<list.length;}).slice().sort(function(a,b){return b.i-a.i;});
    reps.forEach(function(rep){var it=list[rep.i];var end=closeOf(s,it.open);s=s.slice(0,it.innerStart)+rep.html+s.slice(end-6);});
