<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올릿 CX 응대 템플릿</title>
<style>
  :root{
    /* 슬룸 팔레트 */
    --trust-blue:#002454;
    --trust-blue-2:#0a3468;
    --vanilla:#ECDDCD;
    --beige:#E5CDB5;
    --skyblue:#ADC8E8;
    --peanut:#B69A81;
    /* 파생 톤 (밝게) */
    --skyblue-soft:#E8F0FA;
    --vanilla-soft:#FAF4EC;
    --beige-soft:#F5EBDF;
    --line:#E6E8EC;
    --ink:#1e2a3a;
    --ink-soft:#5a6675;
    --white:#ffffff;
    --bg:#F7F8FA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  /* ── 1) 아이콘 레일 ── */
  .rail{
    width:72px;background:var(--trust-blue);
    display:flex;flex-direction:column;align-items:center;
    padding:14px 0;gap:6px;flex-shrink:0;
  }
  .rail .logo{
    color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;
    text-align:center;line-height:1.1;margin-bottom:14px;
  }
  .rail .logo small{display:block;font-weight:400;font-size:9px;color:var(--skyblue);}
  .rail-btn{
    width:52px;height:52px;border-radius:14px;border:none;cursor:pointer;
    background:transparent;color:#9fb3cf;font-size:25px;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;position:relative;
  }
  .rail-btn:hover{background:var(--trust-blue-2);color:#fff;}
  .rail-btn.active{background:var(--skyblue);color:var(--trust-blue);}
  .rail-div{width:34px;height:1px;background:rgba(255,255,255,.18);margin:8px 0;}
  .rail-cap{font-size:8px;color:#6f86a8;font-weight:700;letter-spacing:.3px;margin:2px 0;}

  /* ── 2) 2차 트리 메뉴 ── */
  .sidebar{
    width:248px;background:var(--white);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0;
  }
  .sidebar-head{
    padding:18px 18px 12px;border-bottom:1px solid var(--line);
  }
  .sidebar-head h2{font-size:16px;color:var(--trust-blue);font-weight:800;}
  .sidebar-head p{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .search{
    margin:12px 14px 4px;display:flex;align-items:center;gap:6px;
    background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
  }
  .search input{border:none;background:transparent;outline:none;font-size:12px;width:100%;color:var(--ink);}
  .tree{flex:1;overflow-y:auto;padding:8px 8px 20px;}
  .tree::-webkit-scrollbar{width:6px;}
  .tree::-webkit-scrollbar-thumb{background:#d5dae2;border-radius:3px;}

  .group-label{
    font-size:10px;font-weight:700;color:var(--peanut);letter-spacing:.5px;
    padding:12px 12px 6px;text-transform:uppercase;
  }
  .node{user-select:none;}
  .node-toggle{
    display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
    cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);transition:.12s;
  }
  .node-toggle:hover{background:var(--skyblue-soft);}
  .node-toggle .arrow{font-size:10px;color:var(--ink-soft);transition:.2s;width:10px;}
  .node.open>.node-toggle .arrow{transform:rotate(90deg);}
  .node-children{display:none;padding-left:12px;}
  .node.open>.node-children{display:block;}
  .leaf{
    display:flex;align-items:center;gap:7px;padding:8px 12px 8px 20px;border-radius:9px;
    cursor:pointer;font-size:12.5px;color:var(--ink-soft);transition:.12s;
  }
  .leaf:hover{background:var(--skyblue-soft);color:var(--ink);}
  .leaf.active{background:var(--skyblue);color:var(--trust-blue);font-weight:700;}
  .leaf .dot{width:5px;height:5px;border-radius:50%;background:var(--peanut);flex-shrink:0;}
  .leaf.active .dot{background:var(--trust-blue);}
  .divider{height:1px;background:var(--line);margin:10px 14px;}
  .tree-divider{border-top:1px dashed #c3cad4;margin:10px 16px 6px;}

  /* ── 3) 콘텐츠 ── */
  .content{flex:1;overflow-y:auto;padding:0;}
  .content::-webkit-scrollbar{width:9px;}
  .content::-webkit-scrollbar-thumb{background:#d5dae2;border-radius:4px;}
  .topbar{
    position:sticky;top:0;z-index:5;background:rgba(247,248,250,.92);backdrop-filter:blur(6px);
    padding:14px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .crumb{font-size:12px;color:var(--ink-soft);}
  .crumb b{color:var(--trust-blue);}
  /* 우측 상단 검색 */
  .topbar-search{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:24px;padding:9px 16px;width:340px;flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,36,84,.05);transition:.15s;
  }
  .topbar-search:focus-within{border-color:var(--skyblue);box-shadow:0 0 0 3px var(--skyblue-soft);}
  .topbar-search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink);}
  /* 검색 결과 */
  .sr-title{font-size:23px;font-weight:800;color:var(--trust-blue);margin-bottom:3px;}
  .sr-title span{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .sr-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
  .sr-item{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;
    margin-bottom:12px;cursor:pointer;transition:.12s;
  }
  .sr-item:hover{border-color:var(--skyblue);box-shadow:0 2px 12px rgba(0,36,84,.08);}
  .sr-path{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:7px;}
  .sr-path b{color:var(--trust-blue);font-weight:800;}
  .sr-snip{font-size:13.5px;color:var(--ink);line-height:1.6;}
  .sr-tag{color:var(--trust-blue);font-weight:800;}
  .sr-snip mark{background:var(--skyblue);color:var(--trust-blue);padding:0 3px;border-radius:3px;}
  .sr-none{text-align:center;padding:70px 20px;color:var(--ink-soft);font-size:14px;}
  .page{padding:24px 28px 60px;max-width:1080px;}
  .page h1{
    font-size:26px;color:var(--trust-blue);font-weight:800;margin-bottom:4px;
    display:flex;align-items:center;gap:10px;
  }
  .page .sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

  /* 챕터(단계 내 구간) */
  .chapter{margin:0 0 34px;}
  .section-title{
    font-size:20px;font-weight:800;color:var(--trust-blue);margin:0 0 16px;
    display:flex;align-items:center;gap:9px;
    padding-bottom:10px;border-bottom:2px solid var(--vanilla);
  }
  .section-title .ic{font-size:20px;}

  /* 💡 응대지침 & 전산 업무 (내부용) */
  .guide-card{
    background:var(--beige-soft);border:1px solid #e7d5c0;border-left:4px solid var(--peanut);
    border-radius:12px;padding:15px 18px;margin:14px 0 6px;
  }
  .guide-head{
    font-weight:800;color:#8a5a3c;font-size:14px;margin-bottom:9px;
    display:flex;align-items:center;gap:8px;
  }
  .badge-int{font-size:10px;background:var(--peanut);color:#fff;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.3px;}
  .guide-body{font-size:13px;line-height:1.75;color:#5c4a38;}
  .guide-body ul{list-style:none;}
  .guide-body li{position:relative;padding-left:18px;margin:5px 0;}
  .guide-body li:before{content:"→";position:absolute;left:0;color:var(--peanut);font-weight:700;}
  .guide-body a{color:#8a5a3c;font-weight:700;}

  /* 카드 그리드 */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:820px){.grid2{grid-template-columns:1fr;}}

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:0 1px 3px rgba(0,36,84,.04);
  }
  .card-head{
    padding:11px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;
  }
  .card-head.ok{background:var(--skyblue-soft);color:var(--trust-blue);}
  .card-head.no{background:var(--beige-soft);color:#8a5a3c;}
  .card-head.blue{background:var(--skyblue);color:var(--trust-blue);}
  .card-head.pink{background:var(--vanilla);color:#8a5a3c;}
  .card-body{padding:14px 16px;font-size:13px;line-height:1.7;color:var(--ink);}
  .card-body ul{list-style:none;}
  .card-body li{position:relative;padding-left:16px;margin:5px 0;}
  .card-body li:before{content:"·";position:absolute;left:4px;color:var(--peanut);font-weight:700;}
  .card-body .warn{color:#b5641e;font-weight:600;}
  .card-body .kv{display:flex;gap:6px;margin:4px 0;}
  .card-body .kv b{color:var(--trust-blue);min-width:78px;flex-shrink:0;}

  /* 응대 flow 스텝 */
  .flow-step{
    display:flex;gap:10px;align-items:center;margin:10px 0;font-weight:700;
    font-size:14px;color:var(--trust-blue);
  }
  .flow-num{
    width:24px;height:24px;border-radius:7px;background:var(--trust-blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
  }

  /* 템플릿(매크로) 카드 */
  .macro{
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    margin:12px 0;overflow:hidden;
  }
  .macro-head{
    display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--vanilla-soft);
    border-bottom:1px solid var(--line);
  }
  .macro-head.plain{background:#F2F5F9;}
  .macro-head.plain .mname{color:var(--trust-blue);font-weight:800;}
  .macro-head .gdot{width:10px;height:10px;border-radius:50%;background:#3ac06a;flex-shrink:0;}
  .macro-head .mname{font-weight:700;font-size:13px;color:var(--ink);}
  .macro-head .tag{
    font-size:11px;color:var(--trust-blue);background:var(--skyblue-soft);
    padding:2px 8px;border-radius:20px;font-weight:600;
  }
  .macro-head .spacer{flex:1;}
  .copy-btn{
    border:1px solid var(--trust-blue);background:#fff;color:var(--trust-blue);
    font-size:11px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;
    transition:.12s;display:flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .copy-btn:hover{background:var(--trust-blue);color:#fff;}
  .copy-btn.done{background:#3ac06a;border-color:#3ac06a;color:#fff;}
  .macro-body{
    padding:14px 16px;font-size:13px;line-height:1.75;color:var(--ink);white-space:pre-wrap;
  }

  .hint{
    background:var(--skyblue-soft);border:1px solid #cddcf0;border-radius:12px;
    padding:12px 16px;font-size:12.5px;color:var(--trust-blue);line-height:1.6;margin:16px 0;
  }
  .hint b{font-weight:800;}
  .empty{
    text-align:center;padding:80px 20px;color:var(--ink-soft);
  }
  .empty .big{font-size:40px;margin-bottom:12px;}
  .hidden{display:none;}
</style>
</head>
<body>

  <!-- 1) 아이콘 레일 -->
  <nav class="rail">
    <div class="logo">OLIT<small>CX team</small></div>
    <div class="rail-cap">채팅</div>
    <button class="rail-btn active" data-rail="home" title="채팅 (공통 IB/OB + 브랜드별 템플릿)">💬</button>
    <div class="rail-div"></div>
    <div class="rail-cap">기타</div>
    <button class="rail-btn" data-rail="call" title="유선 응대">📞</button>
    <button class="rail-btn" data-rail="board" title="게시판">📝</button>
  </nav>

  <!-- 2) 2차 트리 메뉴 -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2 id="sbTitle">홈 · 브랜드</h2>
      <p id="sbDesc">브랜드별 채팅 응대 템플릿</p>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <!-- 3) 콘텐츠 -->
  <main class="content">
    <div class="topbar">
      <span class="crumb" id="crumb"><b>홈 · 브랜드</b> › 슬룸 › 반품</span>
      <div class="topbar-search">
        🔍<input type="text" placeholder="템플릿·키워드 검색" id="searchInput" autocomplete="off">
      </div>
    </div>
    <div class="page" id="page"></div>
  </main>

<script>
/* =========================================================
   데이터 (이미지 ④⑤ 기반 샘플 + 문구 다듬음)
   실제 전체 문구는 [공통] IB/OB/CS 엑셀로 교체 예정
========================================================= */
const BRAND_LIST = ["슬룸","심플리케어","얼라인랩","빌바","셀올로지","코코다움","12 o'clock","닥터맨즈","와이브닝","마넬","닥터아망"];
const INQUIRY_TYPES = ["단순변심 교환","단순변심 반품","100%환불이벤트","A/S 및 불량","유상 A/S","부작용"];

/* 콘텐츠 렌더 함수들 -------------------------------------- */
function macro(name, tag, body){
  return `<div class="macro">
    <div class="macro-head">
      <span class="gdot"></span>
      <span class="mname">${name}</span>
      <span class="tag">#${tag}</span>
      <span class="spacer"></span>
      <button class="copy-btn" onclick="copyMacro(this)">📋 복사</button>
    </div>
    <div class="macro-body">${body}</div>
  </div>`;
}

/* 💡 응대지침 & 전산 업무 (내부용 카드) */
function guide(body){
  return `<div class="guide-card">
    <div class="guide-head">💡 응대지침 & 전산 업무 <span class="badge-int">내부용</span></div>
    <div class="guide-body">${body}</div>
  </div>`;
}

/* 매크로명 없는 일반 카드 (유선·게시판용) */
function note(title, body){
  return `<div class="macro note">
    <div class="macro-head plain">
      <span class="mname">${title}</span>
      <span class="spacer"></span>
      <button class="copy-btn" onclick="copyMacro(this)">📋 복사</button>
    </div>
    <div class="macro-body">${body}</div>
  </div>`;
}

/* 슬룸 > 반품 > 단순변심 반품 · 단계별 (이미지 ④⑤ 재구성) */
const STEP_REF_1 = `
  <h1>1️⃣ 반품 가능 여부 확인</h1>
  <div class="sub">배송 완료 후 7일 경과 여부와 반품 사유부터 확인합니다.</div>

  <div class="chapter">
    <div class="section-title"><span class="ic">📋</span>반품 가능 여부 (기준 요약)</div>
    <div class="grid2">
      <div class="card">
        <div class="card-head ok">⭕ 신청 가능</div>
        <div class="card-body"><ul>
          <li>제품 수령일로부터 <b>7일 이내</b></li>
          <li>미개봉 또는 개봉 후 미사용 상태</li>
          <li>구성 확인 목적으로 <b>포장만</b> 개봉한 경우 (개봉 후 미사용)</li>
          <li class="warn">⚠️ 전자제품은 어댑터 연결·작동 이력이 1회라도 있으면 '미사용'에 해당하지 않습니다.</li>
        </ul></div>
      </div>
      <div class="card">
        <div class="card-head no">❌ 신청 불가</div>
        <div class="card-body"><ul>
          <li>사용 또는 개봉 사용으로 재화 가치가 현저히 감소·훼손된 경우</li>
          <li>수령일로부터 <b>7일이 경과</b>한 경우</li>
          <li>제품 또는 구성품을 분실한 경우</li>
        </ul></div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="section-title"><span class="ic">🧭</span>응대 흐름</div>
    <div class="flow-step"><span class="flow-num">1</span>배송 완료 후 7일 경과 여부 · 사유 확인</div>
    <div class="grid2">
      <div class="card">
        <div class="card-head ok">⭕ 수령일로부터 7일 이내</div>
        <div class="card-body">반품·교환 사유에 따라 <b>유형별 템플릿</b>으로 안내합니다. 사유 미언급 시 사유·사용 여부부터 확인하세요.</div>
      </div>
      <div class="card">
        <div class="card-head no">❌ 수령일로부터 7일 경과</div>
        <div class="card-body">단순 변심 반품·교환은 배송 완료일로부터 7일 이내에만 신청이 가능합니다.</div>
      </div>
    </div>
  </div>

  ${guide(`<ul>
    <li>고객이 사유를 언급하지 않으면 <b>사유·사용 여부</b>부터 확인</li>
    <li>수령일 7일 경과 건은 전산상 단순변심 반품 접수 <b>불가</b> 처리</li>
    <li>사용/개봉 여부 확인 후 <b>2️⃣ 반품 유형</b> 단계로 진행</li>
  </ul>`)}

  ${macro("사유 확인 (사유 미언급 시)","반품_사유확인",
`반품을 원하시는 사유가 어떻게 되실까요? :)
개봉 후 사용하지 않으신 제품은 반품이 가능하지만, 사용하신 제품은 반품이 어려운 점 참고 부탁드립니다.
제품 사용 여부도 함께 확인 부탁드립니다.`)}
  ${macro("7일 경과 안내","반품_7일경과",
`단순 변심에 의한 반품·교환은 배송 완료일로부터 7일 이내에만 신청이 가능합니다.
현재는 신청 가능 기간이 지나 도움드리기 어려운 점 양해 부탁드립니다.`)}
`;

const STEP_REF_2 = `
  <h1>2️⃣ 반품 유형 (전체 / 부분)</h1>
  <div class="sub">전체 반품인지 부분 반품인지 구분해 회수 범위를 정합니다.</div>

  <div class="chapter">
    <div class="section-title"><span class="ic">📦</span>전체 / 부분 반품 기준</div>
    <div class="grid2">
      <div class="card">
        <div class="card-head blue">A. 전체 반품</div>
        <div class="card-body">
          <div class="kv"><b>조건</b><span>주문 건의 제품 전부 미사용 (예: 박스만 열어보고 미사용)</span></div>
          <div class="kv"><b>반품 배송비</b><span>6,000원</span></div>
          <div class="kv"><b>회수 품목</b><span>주문 제품(구성품 포함) · 증정품이 있으면 함께 회수</span></div>
        </div>
      </div>

let curRail="home";

/* 이스케이프 / 하이라이트 / 경로표시 */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hl(t,q){const i=t.toLowerCase().indexOf(q.toLowerCase());if(!q||i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));}
function pathHtml(p){const a=p.split(" › ");return `<b>${esc(a[0])}</b>`+a.slice(1).map(x=>" › "+esc(x)).join("");}

/* 트리 렌더 (재귀) */
function buildTree(obj, prefix){
  let html="";
  for(const key in obj){
    const val=obj[key];
    const childKeys=Object.keys(val).filter(k=>k!=="__content");
    const isLeaf=("__content" in val)||childKeys.length===0;
    const path=prefix?prefix+" › "+key:key;
    if(isLeaf){
      const cid=val.__content||"";
      html+=`<div class="leaf" data-content="${cid}" data-path="${path}" onclick="pickLeaf(this)"><span class="dot"></span>${key}</div>`;
    }else{
      html+=`<div class="node"><div class="node-toggle" onclick="toggleNode(this)"><span class="arrow">▶</span>${key}</div><div class="node-children">${buildTree(val,path)}</div></div>`;
    }
  }
  return html;
}

function renderTree(){
  const cfg=RAIL[curRail];
  document.getElementById("sbTitle").textContent=cfg.title;
  document.getElementById("sbDesc").textContent=cfg.desc;
  const tree=document.getElementById("tree");
  if(cfg.type==="brand"){
    tree.innerHTML=buildTree(COMMON_TREE,"")
      +`<div class="tree-divider"></div>`
      +`<div class="group-label">브랜드</div>`
      +buildTree(BRAND_TREE,"");
  }else{
    tree.innerHTML=cfg.items.map((it,i)=>
      `<div class="leaf ${i===0?'active':''}" data-key="${it.key}" onclick="pickList(this,'${it.key}','${it.label}')"><span class="dot"></span>${it.label}</div>`).join("");
  }
}

function toggleNode(el){el.parentElement.classList.toggle("open");}

function pickLeaf(el){
  document.querySelectorAll(".leaf").forEach(l=>l.classList.remove("active"));
  el.classList.add("active");
  setCrumb(`${RAIL[curRail].title} › ${el.dataset.path}`);
  render(CONTENT[el.dataset.content] || emptyState(el.dataset.path));
}
function pickList(el,key,label){
  document.querySelectorAll(".leaf").forEach(l=>l.classList.remove("active"));
  el.classList.add("active");
  setCrumb(`${RAIL[curRail].title} › ${label}`);
  render(CONTENT[key] || emptyState(label));
}

/* 트리에서 특정 콘텐츠로 이동 (조상 토글 열기) */
function openTo(cid){
  const leaf=document.querySelector(`.leaf[data-content="${cid}"]`);
  if(!leaf){render(emptyState(""));return;}
  let p=leaf.parentElement;
  while(p){ if(p.classList&&p.classList.contains("node")) p.classList.add("open"); p=p.parentElement; }
  pickLeaf(leaf);
  leaf.scrollIntoView({block:"nearest"});
}

/* 검색 결과 화면 */
function renderSearch(query){
  const q=query.trim();
  const hits=SEARCH_INDEX.filter(r=>(r.path+" "+(r.tag||"")+" "+r.snippet).toLowerCase().includes(q.toLowerCase()));
  let html=`<div class="sr-title">검색 결과 <span>${hits.length}건</span></div>
    <div class="sr-sub">"${esc(q)}" · 브랜드·유형·템플릿·매크로 전체 검색</div>`;
  if(!hits.length){
    html+=`<div class="sr-none">🔍<br><br>"${esc(q)}"에 대한 결과가 없습니다.</div>`;
  }else{
    html+=hits.map(r=>`<div class="sr-item" onclick="goResult('${r.cid}')">
      <div class="sr-path">${pathHtml(r.path)}</div>
      <div class="sr-snip">${r.tag?`<span class="sr-tag">#${esc(r.tag)}</span><br>`:""}${hl(r.snippet,q)}</div>
    </div>`).join("");
  }
  render(html);
}
function goResult(cid){
  document.getElementById("searchInput").value="";
  const rail = ["call"].includes(cid) ? "call" : (cid==="board") ? "board" : "home";
  const btn=document.querySelector(`.rail-btn[data-rail="${rail}"]`);
  document.querySelectorAll(".rail-btn").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active"); curRail=rail; renderTree();
  if(rail==="home"){ openTo(cid); }
  else { const t=document.querySelector(`.leaf[data-key="${cid}"]`); if(t)t.click(); }
}

function emptyState(path){
  return `<div class="empty"><div class="big">🗂️</div>
    <b>${esc(path||"")}</b><br><br>
    이 항목은 아직 등록 전입니다.<br>
    <span style="font-size:12px;">[공통] IB/OB/CS 엑셀을 주시면 채워 넣겠습니다.</span></div>`;
}
function setCrumb(t){
  const parts=t.split(" › ");
  document.getElementById("crumb").innerHTML=`<b>${parts[0]}</b>`+parts.slice(1).map(p=>" › "+p).join("");
}
function render(html){document.getElementById("page").innerHTML=html;}

/* 복사 버튼 */
function copyMacro(btn){
  const text=btn.closest(".macro").querySelector(".macro-body").innerText;
  navigator.clipboard.writeText(text).then(()=>{
    const orig=btn.innerHTML;
    btn.innerHTML="✓ 복사됨";btn.classList.add("done");
    setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove("done");},1400);
  });
}

/* 레일 전환 */
document.querySelectorAll(".rail-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".rail-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    curRail=b.dataset.rail;
    renderTree();
    // 첫 항목 자동 선택
    const first=document.querySelector(".tree .leaf");
    if(curRail==="home"){ openTo("slm_ref_1"); }
    else if(first){ first.click(); }
  });
});

/* 검색 → 결과 화면 (② 레퍼런스 방식) */
document.getElementById("searchInput").addEventListener("input",e=>{
  const q=e.target.value;
  if(q.trim()) renderSearch(q);
  else restoreView();
});
function restoreView(){
  const active=document.querySelector(".leaf.active");
  if(active) active.click(); else openTo("slm_ref_1");
}

/* 초기 렌더 */
renderTree();
openTo("slm_ref_1");
</script>
</body>
</html>
