<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>올릿 CX 응대 템플릿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #234a86;
        --primary-bg: #f4f8fd;
        --secondary: #9b6829;
        --secondary-bg: #faf5ea;
        --info: #dce8f7;
        --title: #0d253d;
        --text: #273951;
        --subtext: #64748d;
        /* 기존 변수명 → 신규 팔레트 매핑 (DESIGN.md 기준) */
        --trust-blue: #234a86;
        --trust-blue-2: #1b3a68;
        --trust-blue-press: #15294a;
        --vanilla: #f5e9d4;
        --beige: #e8dcc3;
        --skyblue: #c7daf2;
        --peanut: #9b6829;
        --skyblue-soft: #f4f8fd;
        --vanilla-soft: #faf5ea;
        --beige-soft: #faf5ea;
        --line: #e3e8ee;
        --ink: #0d253d;
        --ink-soft: #64748d;
        --white: #ffffff;
        --bg: #ffffff;
        /* DESIGN.md 신규 토큰 : 라운드 / 그림자 / 폰트 */
        --radius-xs: 4px;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-pill: 9999px;
        --shadow-1: 0 1px 3px rgba(0, 55, 112, 0.08);
        --shadow-2:
          0 8px 24px rgba(0, 55, 112, 0.08), 0 2px 6px rgba(0, 55, 112, 0.04);
        --font-ui:
          'Inter', 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo',
          sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-ui);
        font-feature-settings: 'ss01', 'tnum';
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        height: calc(100vh / 1.1);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        zoom: 1.1;
      }

      /* ── 0) 상단 가로 헤더 ── */
      .appbar {
        height: 58px;
        flex-shrink: 0;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        gap: 16px;
        z-index: 20;
        box-shadow:
          0 1px 0 rgba(0, 55, 112, 0.04),
          0 2px 10px rgba(0, 55, 112, 0.03);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand .logo-txt {
        font-size: 23px;
        font-weight: 800;
        color: var(--trust-blue);
        letter-spacing: -0.5px;
      }
      .brand .app-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        padding-left: 14px;
        border-left: 1px solid var(--line);
      }
      .brand .beta {
        font-size: 10px;
        font-weight: 800;
        color: var(--trust-blue);
        background: var(--skyblue-soft);
        border: 1px solid #d6d3fb;
        padding: 2px 9px;
        border-radius: var(--radius-pill);
        letter-spacing: 0.5px;
      }
      .appbar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f3f5f7;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 9px 16px;
        width: 400px;
        max-width: 42vw;
        flex-shrink: 0;
        transition: 0.15s;
      }
      .appbar-search:focus-within {
        border-color: var(--skyblue);
        box-shadow: 0 0 0 3px var(--skyblue-soft);
        background: #fff;
      }
      .appbar-search input {
        border: none;
        outline: none;
        background: transparent;
        width: 100%;
        font-size: 13px;
        color: var(--ink);
      }
      .appbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .user-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .ub-email {
        font-size: 13px;
        color: var(--ink-soft);
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ub-btn {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 6px 12px;
        cursor: pointer;
        text-decoration: none;
        transition: 0.15s;
        white-space: nowrap;
      }
      .ub-btn:hover {
        border-color: var(--skyblue);
        color: var(--trust-blue);
        background: var(--skyblue-soft);
      }
      /* 북마크 UI */
      .bm-star {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 15px;
        color: #c9ccd1;
        padding: 0 5px;
        margin-left: 14px;
        line-height: 1;
        transition: 0.12s;
      }
      .bm-star:hover,
      .bm-star.on {
        color: #f5b800;
      }
      .page-star {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        cursor: pointer;
        flex-shrink: 0;
        transition: 0.12s;
      }
      .page-star.on {
        color: #e0a800;
        border-color: #f3d68a;
        background: #fffaf0;
      }
      .page-star:hover {
        border-color: #f3d68a;
      }
      .bm-page {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 13px;
        color: var(--ink);
        background: #fff;
        transition: 0.12s;
      }
      .bm-page:hover {
        border-color: var(--skyblue);
        background: var(--skyblue-soft);
      }
      .bm-page .bm-star {
        cursor: default;
      }
      .bm-del {
        background: none;
        border: none;
        color: #c9ccd1;
        cursor: pointer;
        font-size: 13px;
        margin-left: auto;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
      }
      .bm-del:hover {
        color: #e5484d;
        background: #fdeaea;
      }
      .bm-empty {
        padding: 14px 16px;
        color: var(--ink-soft);
        font-size: 13px;
        background: var(--bg);
        border: 1px dashed var(--line);
        border-radius: var(--radius-md);
        margin-bottom: 8px;
      }
      .body-row {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* ── 1) 아이콘 레일 ── */
      .rail {
        width: 54px;
        background: #f7fafb;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 0;
        gap: 6px;
        flex-shrink: 0;
      }
      .rail-btn {
        width: 42px;
        height: 42px;
        border-radius: var(--radius-lg);
        border: none;
        cursor: pointer;
        background: transparent;
        color: #64748d;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.15s;
        position: relative;
      }
      .rail-btn:hover {
        background: #edf1f8;
        color: var(--primary);
      }
      .rail-btn.active {
        background: var(--primary);
        color: #fff;
      }
      .rail-div {
        width: 26px;
        height: 1px;
        background: rgba(0, 0, 0, 0.08);
        margin: 8px 0;
      }
      .rail-cap {
        font-size: 8px;
        color: #9aa2ad;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin: 2px 0;
      }

      /* ── 2) 2차 트리 메뉴 ── */
      .sidebar {
        width: 248px;
        min-width: 160px;
        max-width: 520px;
        background: var(--white);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      /* 사이드바 너비 조절 핸들 */
      .resizer {
        width: 6px;
        flex-shrink: 0;
        cursor: col-resize;
        background: transparent;
        position: relative;
        z-index: 5;
        margin-left: -3px;
      }
      .resizer::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: transparent;
        transition: 0.15s;
      }
      .resizer:hover::before,
      .resizer.dragging::before {
        background: var(--skyblue);
      }
      body.col-resizing {
        cursor: col-resize;
        user-select: none;
      }
      body.col-resizing .content {
        pointer-events: none;
      }
      .sidebar-head {
        padding: 18px 18px 12px;
        border-bottom: 1px solid var(--line);
      }
      .sidebar-head h2 {
        font-size: 16px;
        color: var(--trust-blue);
        font-weight: 800;
      }
      .sidebar-head p {
        font-size: 11px;
        color: var(--ink-soft);
        margin-top: 3px;
      }
      .search {
        margin: 12px 14px 4px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 8px 10px;
      }
      .search input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 12px;
        width: 100%;
        color: var(--ink);
      }
      .tree {
        flex: 1;
        overflow-y: auto;
        padding: 8px 8px 20px;
      }
      .tree::-webkit-scrollbar {
        width: 6px;
      }
      .tree::-webkit-scrollbar-thumb {
        background: #d5dae2;
        border-radius: 3px;
      }

      .group-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--peanut);
        letter-spacing: 0.5px;
        padding: 12px 12px 6px;
        text-transform: uppercase;
      }
      .node {
        user-select: none;
      }
      .node-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        transition: 0.12s;
      }
      .node-toggle:hover {
        background: var(--skyblue-soft);
      }
      .node-toggle .arrow {
        font-size: 10px;
        color: var(--ink-soft);
        transition: 0.2s;
        width: 10px;
      }
      .node.open > .node-toggle .arrow {
        transform: rotate(90deg);
      }
      .node-children {
        display: none;
        margin-left: 15px;
        padding-left: 6px;
        border-left: 1px solid #e9ecf1;
      }
      .node.open > .node-children {
        display: block;
      }
      .leaf {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px 8px 20px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 12.5px;
        color: var(--ink-soft);
        transition: 0.12s;
      }
      .leaf:hover {
        background: var(--skyblue-soft);
        color: var(--ink);
      }
      .leaf.active {
        background: var(--skyblue);
        color: var(--trust-blue);
        font-weight: 700;
      }
      .leaf .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--peanut);
        flex-shrink: 0;
      }
      .leaf.active .dot {
        background: var(--trust-blue);
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 10px 14px;
      }
      .tree-divider {
        border-top: 1px dashed #c3cad4;
        margin: 10px 16px 6px;
      }

      /* ── 3) 콘텐츠 ── */
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 0;
      }
      .content::-webkit-scrollbar {
        width: 9px;
      }
      .content::-webkit-scrollbar-thumb {
        background: #d5dae2;
        border-radius: 4px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(6px);
        padding: 14px 28px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .back-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--trust-blue);
        font-size: 12px;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: 0.12s;
        flex-shrink: 0;
      }
      .back-btn:hover {
        background: var(--skyblue);
      }
      .crumb {
        font-size: 12px;
        color: var(--ink-soft);
      }
      .crumb b {
        color: var(--title);
      }
      /* 우측 상단 검색 */
      .topbar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 9px 16px;
        width: 340px;
        flex-shrink: 0;
        box-shadow: 0 1px 3px rgba(0, 55, 112, 0.05);
        transition: 0.15s;
      }
      .topbar-search:focus-within {
        border-color: var(--skyblue);
        box-shadow: 0 0 0 3px var(--skyblue-soft);
      }
      .topbar-search input {
        border: none;
        outline: none;
        background: transparent;
        width: 100%;
        font-size: 13px;
        color: var(--ink);
      }
      /* 검색 결과 */
      .sr-title {
        font-size: 23px;
        font-weight: 800;
        color: var(--title);
        margin-bottom: 3px;
      }
      .sr-title span {
        font-size: 14px;
        color: var(--ink-soft);
        font-weight: 600;
      }
      .sr-sub {
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-bottom: 22px;
      }
      .sr-item {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 15px 18px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: 0.12s;
      }
      .sr-item:hover {
        border-color: var(--skyblue);
        box-shadow: 0 2px 12px rgba(0, 55, 112, 0.08);
      }
      .sr-path {
        font-size: 12px;
        color: var(--ink-soft);
        font-weight: 600;
        margin-bottom: 7px;
      }
      .sr-path b {
        color: var(--trust-blue);
        font-weight: 800;
      }
      .sr-snip {
        font-size: 13.5px;
        color: var(--ink);
        line-height: 1.6;
      }
      .sr-tag {
        color: var(--trust-blue);
        font-weight: 800;
      }
      .sr-snip mark {
        background: var(--skyblue);
        color: var(--trust-blue);
        padding: 0 3px;
        border-radius: 3px;
      }
      .sr-none {
        text-align: center;
        padding: 70px 20px;
        color: var(--ink-soft);
        font-size: 14px;
      }
      .page {
        padding: 32px 32px 88px;
        max-width: 1080px;
      }
      .page h1 {
        font-size: 26px;
        color: var(--title);
        font-weight: 800;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page .sub {
        font-size: 13px;
        color: var(--ink-soft);
        margin-bottom: 22px;
      }

      /* 챕터(단계 내 구간) */
      .chapter {
        margin: 0 0 34px;
      }
      .section-title {
        font-size: 20px;
        font-weight: 800;
        color: var(--title);
        margin: 0 0 16px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      .section-title .ic {
        font-size: 20px;
      }

      /* 📌 참고사항 (내부용) — 연회색 틴트로 템플릿(화이트)과 구분 */
      .guide-card {
        background: var(--vanilla-soft);
        border: 1px solid #e8dcc3;
        border-radius: var(--radius-lg);
        padding: 16px 20px;
        margin: 10px 0 22px;
        box-shadow: none;
      }
      .guide-head {
        font-weight: 800;
        color: var(--ink);
        font-size: 14px;
        margin-bottom: 9px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge-int {
        font-size: 10px;
        background: var(--ink-soft);
        color: #fff;
        padding: 2px 8px;
        border-radius: var(--radius-pill);
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .guide-body {
        font-size: 13px;
        line-height: 1.8;
        color: #5c4a38;
        white-space: pre-line;
      }
      .sub-ex {
        font-size: 12px;
        color: #9b6829;
        margin: 2px 0 12px;
        line-height: 1.5;
      }
      .flow-diagram {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 6px;
        margin: 16px 0;
      }
      .fd-box {
        flex: 1 1 130px;
        min-width: 118px;
        background: #fff;
        border: 1.5px solid var(--trust-blue);
        border-radius: var(--radius-md);
        padding: 12px 10px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink);
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.4;
      }
      .fd-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--trust-blue);
        font-weight: 800;
        flex: 0 0 auto;
        font-size: 14px;
      }
      .fork {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 6px 0 16px;
        padding: 12px 0 4px 18px;
        border-left: 3px dashed var(--trust-blue);
      }
      @media (max-width: 820px) {
        .fork {
          grid-template-columns: 1fr;
        }
      }
      .fork-label {
        display: inline-block;
        font-size: 11.5px;
        font-weight: 800;
        color: #fff;
        background: var(--trust-blue);
        padding: 3px 12px;
        border-radius: var(--radius-pill);
        margin-bottom: 8px;
      }
      .fork-branch.b2 .fork-label {
        background: #9b6829;
      }
      .fork.fork-split {
        border-left: none;
        padding: 12px 0 4px 0;
        gap: 0;
      }
      .fork.fork-split .fork-branch {
        padding: 0 20px;
      }
      .fork.fork-split .fork-branch:first-child {
        border-right: 2px dashed var(--trust-blue);
      }
      .fork .flow-diagram {
        margin: 0;
      }
      .fork-label-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .fork-label-row .fork-label {
        margin-bottom: 0;
        flex: none;
      }
      .fork-label-line {
        flex: 1;
        border-top: 2px dashed var(--trust-blue);
        height: 0;
        margin-top: 1px;
      }
      .fork-branch.b2 .fork-label-line {
        border-top-color: #9b6829;
      }
      .fork-label-desc {
        flex: none;
        font-size: 12px;
        font-weight: 700;
        color: var(--trust-blue);
        white-space: nowrap;
      }
      .fork-branch.b2 .fork-label-desc {
        color: #9b6829;
      }
      .free-flow-tag {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 800;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        margin-bottom: 6px;
      }
      .free-flow-tag.principle {
        background: var(--trust-blue);
        color: #fff;
      }
      .free-flow-tag.exception {
        background: #f1f5f9;
        color: #64748b;
        border: 1px solid var(--line);
      }
      .free-flow-box {
        background: var(--skyblue-soft);
        border: 1.5px solid var(--trust-blue);
        border-radius: var(--radius-md);
        padding: 12px 10px;
        font-size: 12.5px;
        font-weight: 800;
        text-align: center;
        color: var(--trust-blue);
      }
      .free-flow-box.exception {
        background: #fff;
        border: 1.5px dashed #94a3b8;
        color: #475569;
        font-weight: 700;
      }
      .free-flow-connector {
        text-align: center;
        font-size: 11px;
        color: #8a94a6;
        margin: 8px 0;
      }
      .quote-box {
        border-left: 4px solid var(--trust-blue);
        background: #f5f8fc;
        padding: 12px 16px 12px 18px;
        margin: 12px 0 16px;
        font-size: 12.5px;
        line-height: 1.75;
        color: var(--ink);
        border-radius: 0 10px 10px 0;
        white-space: pre-line;
      }
      .quote-box b {
        color: var(--trust-blue);
        font-weight: 800;
      }
      .quote-box a.jump-link,

    ${desc ? `<div class="sc-desc">${desc}</div>` : ''}
    <div class="macro-body">${body}</div>
  </div>`;

  <div class="lvl2-body"><div class="typ" id="t5"><span class="tnum">4</span>구성품 누락</div><div class="lvl3-body"><div class="quote-box">⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</div><div class="grp-h">1️⃣ 배송 완료일자 확인</div><div class="grid2">${macro(`① 수령일로부터 영업일 7일 이내 · 사진 전송 요청`, 'AS_구성품_사진요청', `고객님, 번거로우시겠지만 수령하신 제품의 구성품 전체가 확인되도록 사진을 보내주시면 \n빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`② 수령일로부터 영업일 7일 경과 · 처리 불가 안내`, 'AS_구성품_처리불가', `구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`, 'AS_구성품_예외', `고객님, 앞서 안내드린 것처럼 구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도움드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 구성품 전체가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">2️⃣ 별도 재출고 안내</div>${macro(`① 별도 재출고 안내`, 'AS_구성품_재출고', `확인 감사합니다.\n이용에 불편을 드려 정말 죄송합니다.\n누락된 (구성품명)은 재출고로 진행해 드리겠습니다.`)}${macro(`회수지 확인 필요 시`, 'AS_구성품_회수지', `🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드려도 괜찮을까요?`, `워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}${macro(`③ 출고 시일 소요 안내`, 'AS_구성품_출고시일', `확인 감사합니다.\n\n🚚 재출고 일정 안내드리겠습니다.\n\n· 출고 : 영업일 2일 이내\n· 배송 : 접수일로부터 영업일 5~6일 소요\n· 택배사 : CJ대한통운\n\n※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 양해 부탁드립니다.`, `▶ 상담 종료 후 <a href="https://docs.google.com/spreadsheets/d/1Bj5stx8hXMoPL8L91EYu6e5TA7pqEAjges4Cejs1wjo/edit?gid=388846546#gid=388846546" target="_blank">수기출고 통합 시트</a> - 자사 제품 신청 탭\n\n⚠️ 본품 전체 출고일 경우, ※문구 삭제 필요`)}<div class="grp-h">🔔 [예외케이스] 구성품 누락으로 전체 반품 희망</div><div class="quote-box">상품 개봉 여부와 무관하게 제품 회수 및 전액 환불 처리로 진행</div>${macro(`① 포장 및 회수 안내`, 'AS_구성품_전액환불', `<b>전액 환불 접수 도와드리겠습니다.</b>\n\n\n<b>📦 제품 포장 안내</b>\n■ 회수 대상 : {상담마다 직접 회수 필요한 제품 확인하여 기재}\n\n✍🏽 택배 박스 윗면에 <b>[불량]</b> 표기 부탁드립니다.\n\n\n<b>🚚 회수 안내</b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n\n💡택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.`)}${caution(`🎁 전체 불량 반품 : 증정품 회수 O`)}<div class="grp-h">· 결제수단별 환불 안내</div><div class="grid2">${col('blue', '◆ 카드결제', subcard(`a. 카드결제 취소`, 'AS_구성품_환불카드', `환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있습니다.\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`))}${col('pink', '◆ 계좌 환불', `<div class="stack">` + subcard(`b-1. 계좌 환불 (무통장·가상계좌)`, 'AS_구성품_환불계좌1', `환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n다만, (결제 수단 안내 - 무통장 입금 or 가상계좌 결제) 로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`) + subcard(`b-2. 이후 계좌 정보 확인`, 'AS_구성품_환불계좌2', `소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`) + `</div>`)}</div></div><div class="typ" id="t6"><span class="tnum">5</span>이염/오염/초도파손</div><div class="lvl3-body"><div class="quote-box">⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</div><div class="grp-h">1️⃣ 배송 완료일자 확인</div><div class="grid2">${macro(`① 수령일로부터 영업일 7일 이내 · 사진 전송 요청`, 'AS_이염_사진요청', `고객님, 번거로우시겠지만 수령하신 제품의 (이염·오염·파손) 상태가 확인되도록 사진을 보내주시면 빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`② 수령일로부터 영업일 7일 경과 · 처리 불가 안내`, 'AS_이염_처리불가', `제품 (이염·오염·파손) 의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`, 'AS_이염_예외', `고객님, 앞서 안내드린 것처럼 제품 (이염·오염·파손) 의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도움드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 이염·오염 상태가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">② 고객 요청 처리 방안 확인</div>${macro(`고객 요청 처리 방안 확인`, 'AS_이염_방향', `불편을 드려 죄송합니다.🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}${guide(`⚠️ 상품수령일로부터 7일 이내 이염/오염/초도파손은 고객이 원하는 처리 방안(교환 또는 반품) 확인 후 진행 (단, 기간별 정책에 따라만 진행 가능)\n👉🏻 교환 요청 시 <a class="jump-link" href="#freeBranch" onclick="return jumpTo('freeBranch')">① 무상 교환 안내</a> 로 이동\n👉🏻 반품 요청 시 <a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">② 무상 반품 안내</a> 로 이동`)}</div></div>
  <div class="h2lvl" id="t4">🔁 재불량 (교환품 동일 증상)</div>
  <div class="lvl2-body">${caution(`👉 [예시] 2026.01.01 허리편한케어 V1 충전 불량으로 무상 교환 진행 → 2026.03.02 교환 제품에서 동일 증상(충전 불량)으로 재문의`)}<div class="grp-h">💡 공통 안내</div>${macro(`① 사과·양해 멘트`, 'AS_재불량_사과', `교환 받으신 제품에서도 동일한 증상이 발생하여 많이 당황스러우셨을 것 같습니다.\n다시 한 번 불편을 드리게 된 점 진심으로 사과드립니다. 🥲`)}<div class="grp-h">✨ 재인입 처리 기준</div>${guide(`1. 충전/전원 불량, 2. 작동 관련 증상(증빙 자료로 판단 가능한 유형 전체)만 아래와 같이 진행`)}<table class="astbl"><thead><tr><th>재인입</th><th>고객 반품 희망</th><th>고객 교환 희망</th></tr></thead><tbody><tr><td>1차 재인입</td><td>각 불량 유형 기본 flow 대로 진행</td><td>각 불량 유형 기본 flow 대로 진행</td></tr><tr><td>2차 재인입</td><td>회수 후 검수 결과에 따라 처리</td><td>① 정격전압 확인 ㅡ 어댑터 사진 필수<br>② 사진 확인 후 기존 flow 대로 진행</td></tr><tr><td>3차 재인입~</td><td>회수 후 검수 결과에 따라 처리</td><td>회수 후 검수 결과에 따라 처리</td></tr></tbody></table></div>
  <div class="h1lvl" id="step2"><span class="num">3</span>AS 접수</div>
  <div class="h2lvl as-major" id="freeFlow">🛠️ 무상 AS</div><div class="lvl2-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 6개월 이내 제품 자체 고장은 원칙적으로 무상 교환으로 안내</b>

✔️ 만약 고객이 반품을 요청할 경우, 아래 기간에 따라 응대
· 상품 수령일 3개월 이내 → ② 무상 반품 접수

  <div class="lvl2-body"><div class="h3lvl" id="edgeIn">① 품질보증기간(1년) 이내 단종</div><div class="lvl3-body">${guide(`<b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용합니다.\n① 유사 모델을 '유상교환 가격' 으로 구매 안내\n② 고객이 구매를 원하지 않는 경우 단종 보상 기준에 따라 <b>구입가를 자사몰 포인트로 대체 환급</b>`)}${macro(`1. 단종 안내 및 유사 제품 추천`, 'AS_단종이내_안내', `고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드립니다.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 이내 유상 교환 기준을 적용한 ({1년 이내 기준 유상금액}+3000)원으로 접수 도와드리겠습니다.\n\n아래 주요 기능과 슬룸 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(슬룸 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 이내 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`a-1. 유사 제품 구매 동의_입금 안내`, 'AS_단종이내_입금', `네 고객님, 이해해 주셔서 감사합니다.🙂\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드리겠습니다.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 이내 유상 교환 금액)\n🏦 기업은행 075-095980-04-017 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드리겠습니다.`)}${subcard(`a-2. 기존 제품 자체폐기 안내`, 'AS_단종이내_폐기', `기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div>${subcard(`b-1. 유사 제품 구매 미동의_포인트 환급 안내`, 'AS_단종이내_미동의', `고객님, 다시 한번 불편을 드려 죄송합니다.\n다른 제품으로 교환을 원치 않으시다면, 구입가를 공식몰 포인트로 환급해 드리겠습니다.\n포인트는 주문하신 계정과 동일한 계정으로 지급되며, 지급까지는 영업일 기준 1~2일 정도 소요됩니다.`)}</div>${guide(`👉🏻 a-1. 유사 제품 구매 동의_입금 안내 시 접수 시점에 따라 출고 안내`)}<div class="grid2">${subcard(`a. 월-금 오후 2시 이전 상담`, 'AS_단종이내_출고A', `<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 금일 출고 예정 \n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}${subcard(`b. 월-목 오후 2시 이후 상담`, 'AS_단종이내_출고B', `<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 금일 출고 마감으로 익일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}</div>${macro(`c. 금요일 오후 2시 이후 상담`, 'AS_단종이내_출고C', `<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 금일 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 및 배송 미진행`)}</div><div class="h3lvl" id="edgeOut">② 품질보증기간(1년) 경과 단종</div><div class="lvl3-body">${guide(`<b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용합니다.\n① 동일 부위·동일 용도의 유사 제품이 있는지 확인합니다.\n<span class="sub-ex">(예: 넥숄더프로 → 넥숄더힐링케어 V2)</span>\n② 유사 제품을 품질보증기간(1년) 경과 유상 교환 비용으로 구매할 수 있도록 안내합니다.\n③ 고객이 유사 제품 구매를 원하지 않는 경우, <b>감가상각을 반영한 잔여 금액에 구입가의 10%를 가산</b>하여 자사몰 포인트로 환급합니다.`)}${macro(`1. 단종 안내 및 유사 제품 추천`, 'AS_단종경과_안내', `고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드립니다.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 경과 유상 교환 기준을 적용한 ({1년 경과 기준 유상금액}+3000)원으로 접수 도와드리겠습니다.\n\n아래 주요 기능과 슬룸 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(슬룸 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 경과 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`a-1. 유사 제품 구매 동의_입금 안내`, 'AS_단종경과_입금', `네 고객님, 이해해 주셔서 감사합니다.🙂\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드리겠습니다.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 경과 유상 교환 금액)\n🏦 기업은행 075-095980-04-017 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드리겠습니다.`)}${subcard(`a-2. 기존 제품 자체폐기 안내`, 'AS_단종경과_폐기', `기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div><div class="flowgroup">${subcard(`b-1. 유사 제품 구매 미동의_감가상각`, 'AS_단종경과_미동의', `고객님, 다시 한번 불편을 드려 죄송합니다.\n문의주신 주문 건은 현재 품질보증기간 1년이 경과한 상태로, 구매 당시 결제 금액과 사용 기간을 반영한 기준에 따라 환급을 도와드리겠습니다.\n고객님께 적용되는 환불 예정 금액은 (환불예정금액)원이며, 영업일 기준 1~2일 정도 소요됩니다.\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주`)}${subcard(`b-2. 이후 계좌 정보 확인`, 'AS_단종경과_계좌확인', `소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n💸 입금 안내\n영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)}</div></div></div></div>
  ${blueNote(`💰 환급금 계산 가이드`, `<div class="refund-guide-grid"><div style="padding-right:18px">① 구입가를 확인합니다.\n② 사용개월을 확인합니다.\n③ 아래 계산식을 적용합니다.\n\n<b>감가상각비</b> = (사용개월 ÷ 60개월) × 구입가\n<b>잔여금</b> = 구입가 - 감가상각비\n<b>최종 환급금</b> = 잔여금 + 구입가의 10%\n\n※ 슬룸 제품의 내용연수는 60개월로 적용합니다.<div class="quote-box" style="margin-top:14px"><b>예시)</b> 목베개플러스 · 구입가 99,000원 · 구입일 2024년 7월 · AS 문의일 2026년 7월 · 사용기간 24개월\n\n· 감가상각비 = (24개월 ÷ 60개월) × 99,000원 = 39,600원\n· 잔여금 = 99,000원 - 39,600원 = 59,400원\n· 구입가의 10% = 99,000원 × 10% = 9,900원\n· <b>최종 환급금</b> = 59,400원 + 9,900원 = <b>69,300원</b></div></div><div style="padding-left:18px;border-left:2px dashed #C7DAF2"><div class="refund-calc" style="margin-top:0"><div class="refund-calc-h">🧮 자동 계산기 (숫자만 입력)</div><div class="refund-calc-row"><label>구입가</label><input type="text" inputmode="numeric" data-role="price" placeholder="예: 99000" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">원</span></div><div class="refund-calc-row"><label>사용개월</label><input type="text" inputmode="numeric" data-role="months" placeholder="예: 24" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">개월</span></div><div class="refund-calc-err"></div><div class="refund-calc-out"><div><span>감가상각비</span><b data-out="dep">0원</b></div><div><span>잔여금</span><b data-out="rem">0원</b></div><div><span>구입가의 10%</span><b data-out="add">0원</b></div><div class="final"><span>최종 환급금</span><b data-out="final">0원</b></div></div></div></div></div><details class="legal-fold"><summary>※ 관련 기준 보기</summary><p>공정거래위원회 소비자분쟁해결기준에 따라 품질보증기간이 경과한 후 부품보유기간 내 수리가 불가능한 경우, 정액 감가상각한 잔여 금액에 구입가의 10%를 가산하여 환급합니다.</p></details>`)}

          parent.parentElement
            .querySelectorAll('.sec-parent.open')
            .forEach((x) => {
              if (x !== parent) x.classList.remove('open');
            });
        }
        parent.classList.toggle('open');
      }

      /* 문의유형 라벨 클릭 = 펼치기 + 페이지 로드(맨 위) */
      function nodeOpenContent(el) {
        const node = el.parentElement;
        const willOpen = !node.classList.contains('open');
        if (willOpen) closeSiblings(node);
        node.classList.toggle('open');
        if (node.classList.contains('open')) {
          CUR_CID = el.dataset.content || '';
          document
            .querySelectorAll('.leaf')
            .forEach((l) => l.classList.remove('active'));
          setCrumb(`${RAIL[curRail].title} › ${el.dataset.path}`);
          render(CONTENT[el.dataset.content] || emptyState(el.dataset.path));
          const c = document.querySelector('.content');
          if (c) c.scrollTop = 0;
          commitView();
        }
      }

      function pickLeaf(el) {
        CUR_CID = el.dataset.content || '';
        document
          .querySelectorAll('.leaf')
          .forEach((l) => l.classList.remove('active'));
        el.classList.add('active');
        setCrumb(`${RAIL[curRail].title} › ${el.dataset.path}`);
        render(CONTENT[el.dataset.content] || emptyState(el.dataset.path));
        const a = el.dataset.anchor;
        if (a) {
          const t = document.getElementById(a);
          if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          const c = document.querySelector('.content');
          if (c) c.scrollTop = 0;
        }
        commitView();
      }
      function pickList(el, key, label) {
        CUR_CID = key;
        document
          .querySelectorAll('.leaf')
          .forEach((l) => l.classList.remove('active'));
        el.classList.add('active');
        setCrumb(`${RAIL[curRail].title} › ${label}`);
        render(CONTENT[key] || emptyState(label));
      }

      /* 트리에서 특정 콘텐츠로 이동 (조상 토글 열기) */
      function openTo(cid) {
        CUR_CID = cid;
        const nt = document.querySelector(
          `.node-toggle[data-content="${cid}"]`,
        );
        if (nt) {
          let p = nt.parentElement;
          while (p) {
            if (p.classList && p.classList.contains('node'))
              p.classList.add('open');
            p = p.parentElement;
          }
          document
            .querySelectorAll('.leaf')
            .forEach((l) => l.classList.remove('active'));
          setCrumb(`${RAIL[curRail].title} › ${nt.dataset.path}`);
          render(CONTENT[cid] || emptyState(nt.dataset.path));
          const c = document.querySelector('.content');
          if (c) c.scrollTop = 0;
          nt.scrollIntoView({ block: 'nearest' });
          return;
        }
        const leaf = document.querySelector(`.leaf[data-content="${cid}"]`);
        if (!leaf) {
          render(emptyState(''));
          return;
        }
        let p = leaf.parentElement;
        while (p) {
          if (p.classList && p.classList.contains('node'))
            p.classList.add('open');
          p = p.parentElement;
        }
        pickLeaf(leaf);
        leaf.scrollIntoView({ block: 'nearest' });
      }

      /* 검색 결과 화면 */
      function renderSearch(query) {
        const q = query.trim();
        if (!q) {
          restoreView();
          return;
        }
        const ql = q.toLowerCase();
        const all = SEARCH_INDEX.filter(
          (r) =>
            r.text.toLowerCase().includes(ql) ||
            r.path.toLowerCase().includes(ql),
        );
        const hits = all.slice(0, 60);
        let html =
          `<div class="sr-title">검색 결과 <span>${all.length}건</span></div>
    <div class="sr-sub">"${esc(q)}" · 브랜드·채널·유형·템플릿 전체 검색` +
          (all.length > 60 ? ` (상위 60건 표시)` : ``) +
          `</div>`;
        if (!hits.length) {
          html += `<div class="sr-none">🔍<br><br>"${esc(q)}"에 대한 결과가 없습니다.</div>`;
        } else {
          html += hits
            .map((r) => {
              const t = r.text,
                li = t.toLowerCase().indexOf(ql);
              let snip;
              if (li < 0) {
                snip = t.slice(0, 90);
              } else {
                const st = Math.max(0, li - 30);
                snip =
                  (st > 0 ? '… ' : '') + t.slice(st, li + q.length + 60) + ' …';
              }
              return `<div class="sr-item" onclick="goResult('${r.cid}')">
      <div class="sr-path">${pathHtml(r.path)}</div>
      <div class="sr-snip">${hl(snip, q)}</div>
    </div>`;
            })
            .join('');
        }
        render(html);
      }
      function goResult(cid) {
        document.getElementById('searchInput').value = '';
        const rail = CID_RAIL[cid] || 'home';
        document
          .querySelectorAll('.rail-btn')
          .forEach((x) => x.classList.remove('active'));
        const btn = document.querySelector(`.rail-btn[data-rail="${rail}"]`);
        if (btn) btn.classList.add('active');
        curRail = rail;
        renderTree();
        openTo(cid);
        commitView();
      }

      function goRail(r) {
        const b = document.querySelector(`.rail-btn[data-rail="${r}"]`);
        if (b) b.click();
      }

      /* ===================== 북마크(북마크) ===================== */
      function loadBM(kind) {
        try {
          return JSON.parse(localStorage.getItem('olit_bm_' + kind)) || [];
        } catch (e) {
          return [];
        }
      }
      function saveBM(kind, arr) {
        try {
          localStorage.setItem('olit_bm_' + kind, JSON.stringify(arr));
        } catch (e) {}
      }
      function isPageBM(cid) {
        return loadBM('pages').some((x) => x.cid === cid);
      }
      function isMentBM(id) {
        return loadBM('ments').some((x) => x.id === id);
      }
      function hashStr(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) {
          h = (h * 31 + s.charCodeAt(i)) | 0;
        }
        return (h >>> 0).toString(36);
      }

      /* --- 페이지 북마크 --- */
      function currentPageKey() {
        if (!CUR_CID) return null;
        if (curRail === 'dash' || curRail === 'bm') return null;
        return CUR_CID;
      }
      function updatePageStar() {
        const btn = document.getElementById('pageStar');
        if (!btn) return;
        const cid = currentPageKey();
        if (!cid) {
          btn.style.display = 'none';
          return;
        }
        const path = (
          document.getElementById('crumb').textContent || ''
        ).trim();
        const on = isPageBM(cid);
        btn.style.display = 'inline-flex';
        btn.classList.toggle('on', on);
        btn.textContent = (on ? '★' : '☆') + ' 북마크';
        btn.dataset.cid = cid;
        btn.dataset.path = path;
      }
      function togglePageBookmark() {
        const btn = document.getElementById('pageStar');
        const cid = btn.dataset.cid;
        if (!cid) return;
        let arr = loadBM('pages');
        const i = arr.findIndex((x) => x.cid === cid);
        if (i >= 0) arr.splice(i, 1);
        else arr.push({ cid: cid, path: btn.dataset.path || cid });
        saveBM('pages', arr);
        updatePageStar();
        if (curRail === 'bm') renderBookmarks();
      }

      /* --- 멘트 북마크 (복사버튼 옆 ☆ 주입) --- */
      function mentInfo(card) {
        const bodyEl = card.querySelector(
          '.macro-body,.subcard-body,.col-body-plain,.star-body,.bn-body,.cmp-ment-body',
        );
        if (!bodyEl) return null;
        const text = (bodyEl.innerText || '').trim();
        if (!text) return null;
        const tagEl = card.querySelector('.tag,.ct-tag');
        const labelEl = card.querySelector(
          '.mname,.sc-label,.star-h b,.bn-h b,.col-h span',
        );
        let label = labelEl ? labelEl.textContent.trim() : '';
        if (!label && card.classList.contains('cmp-ment')) {
          const tr = card.closest('tr');
          const rl = tr && tr.querySelector('.cmp-row-label');
          label = rl ? rl.textContent.trim() : '표준 멘트';
        }
        const tag = tagEl ? tagEl.textContent.replace(/^#/, '').trim() : '';
        const id = tag
          ? 't:' + tag
          : 'h:' + hashStr((label || '') + '|' + text);
        const path = (
          document.getElementById('crumb').textContent || ''
        ).trim();
        return { id: id, label: label || '(멘트)', text: text, path: path };
      }
      function toggleMentBM(info) {
        let a = loadBM('ments');
        const i = a.findIndex((x) => x.id === info.id);
        if (i >= 0) a.splice(i, 1);
        else a.push(info);
        saveBM('ments', a);
      }
      function decorateMentBookmarks() {
        const root = document.getElementById('page');
        if (!root) return;
        if (curRail === 'bm')
          return; /* 북마크 화면 내 카드에는 별 미주입 (중복 방지) */
        root.querySelectorAll('.copy-btn').forEach((btn) => {
          const nx = btn.nextElementSibling;
          if (nx && nx.classList && nx.classList.contains('bm-star')) return;
          const card = btn.closest('.macro,.subcard,.col-card,.cmp-ment');
          if (!card) return;
          const info = mentInfo(card);
          if (!info) return;
          const star = document.createElement('button');
          star.type = 'button';
          star.className = 'bm-star' + (isMentBM(info.id) ? ' on' : '');
          star.title = '멘트 북마크';
          star.textContent = isMentBM(info.id) ? '★' : '☆';
          star.addEventListener('click', (ev) => {
            ev.stopPropagation();
            toggleMentBM(info);
            const on = isMentBM(info.id);
            star.classList.toggle('on', on);
            star.textContent = on ? '★' : '☆';
            if (curRail === 'bm') renderBookmarks();
          });
          btn.parentNode.insertBefore(star, btn.nextSibling);
        });
      }

      /* --- 북마크 화면 --- */
      function openBM(cid) {
        const rail = CID_RAIL[cid] || 'home';
        document
          .querySelectorAll('.rail-btn')
          .forEach((x) => x.classList.remove('active'));
        const rb = document.querySelector(`.rail-btn[data-rail="${rail}"]`);
        if (rb) rb.classList.add('active');
        curRail = rail;
        renderTree();
        openTo(cid);
        commitView();
      }
      function delBMPage(cid) {
        saveBM(
          'pages',
          loadBM('pages').filter((x) => x.cid !== cid),
        );
        renderBookmarks();
        updatePageStar();
      }
      function delBMMent(id) {
        saveBM(
          'ments',
          loadBM('ments').filter((x) => x.id !== id),
        );
        renderBookmarks();
      }
      function bmMentCard(m) {
        return (
          `<div class="subcard"><div class="subcard-h"><span class="sc-label">${esc(m.label)}</span>` +
          `<span style="font-size:11px;color:var(--ink-soft);margin-left:8px">${esc(m.path || '')}</span>` +
          `<span class="spacer"></span>` +
          `<button class="bm-del" onclick="delBMMent('${esc(m.id)}')" title="삭제">✕</button>` +
          `<button class="copy-btn" onclick="copyMacro(this)" title="복사">📋</button></div>` +
          `<div class="subcard-body" style="white-space:pre-line">${esc(m.text)}</div></div>`
        );
      }
      function renderBookmarks() {
        const tree = document.getElementById('tree');
        if (tree)
          tree.innerHTML =
            `<div class="group-label">북마크</div>` +
            `<div style="padding:8px 14px;font-size:11px;color:var(--ink-soft);line-height:1.6">좌측 아이콘(💬 📞 📝)으로 이동하세요.</div>`;
        const pages = loadBM('pages'),
          ments = loadBM('ments');
        let html = `<h1>🔖 북마크</h1><div class="sub">내 브라우저에 저장된 북마크 · 각자 계정/PC별로 관리됩니다</div>`;
        html += `<div class="grp-h" style="margin-top:18px">⭐ 북마크 페이지 <span style="font-weight:500;color:var(--ink-soft);font-size:12px">(${pages.length})</span></div>`;
        html += pages.length
          ? `<div class="grid2" style="align-items:start;margin-bottom:0">` +
            pages
              .map(
                (p) =>
                  `<div class="bm-page" style="margin-bottom:0" onclick="openBM('${esc(p.cid)}')"><span class="bm-star on">★</span><span>${esc(p.path || p.cid)}</span>` +
                  `<button class="bm-del" onclick="event.stopPropagation();delBMPage('${esc(p.cid)}')" title="삭제">✕</button></div>`,
              )
              .join('') +
            `</div>`
          : `<div class="bm-empty">아직 없습니다. 페이지 우측 상단의 <b>☆ 북마크</b> 버튼으로 추가하세요.</div>`;
        html += `<div class="grp-h" style="margin-top:24px">🔖 북마크 멘트 <span style="font-weight:500;color:var(--ink-soft);font-size:12px">(${ments.length})</span></div>`;
        html += ments.length
          ? `<div class="grid2" style="align-items:start">` +
            ments.map(bmMentCard).join('') +
            `</div>`
          : `<div class="bm-empty">아직 없습니다. 각 카드 복사버튼(📋) 옆 <b style="color:#e0a800">☆</b> 를 눌러 추가하세요.</div>`;
        render(html);
        setCrumb('북마크');
      }
      function emptyState(path) {
        return `<div class="empty"><div class="big">🗂️</div>
    <b>${esc(path || '')}</b><br><br>
    이 항목은 아직 등록 전입니다.<br>
    <span style="font-size:12px;">[공통] IB/OB/CS 엑셀을 주시면 채워 넣겠습니다.</span></div>`;
      }
      function setCrumb(t) {
        const parts = t.split(' › ');
        document.getElementById('crumb').innerHTML =
          `<b>${parts[0]}</b>` +
          parts
            .slice(1)
            .map((p) => ' › ' + p)
            .join('');
      }
      function render(html) {
        document.getElementById('page').innerHTML = html;
        try {
          decorateMentBookmarks();
        } catch (e) {}
        try {
          updatePageStar();
        } catch (e) {}
      }

      /* 네비게이션 히스토리 (뒤로가기) */
      let navHist = [],
        curView = null;
      function curSnap() {
        return {
          rail: curRail,
          tree: document.getElementById('tree').innerHTML,
          page: document.getElementById('page').innerHTML,
          crumb: document.getElementById('crumb').innerHTML,
        };
      }
      function commitView() {
        const sn = curSnap();
        if (curView) {
          if (curView.rail === sn.rail && curView.crumb === sn.crumb) {
            curView = sn;
            updateBackBtn();
            return;
          }
          navHist.push(curView);
          if (navHist.length > 60) navHist.shift();
        }
        curView = sn;
        updateBackBtn();
      }
      function goBack() {
        if (!navHist.length) return;
        const sn = navHist.pop();
        curRail = sn.rail;
        document
          .querySelectorAll('.rail-btn')
          .forEach((x) => x.classList.remove('active'));
        const rb = document.querySelector(`.rail-btn[data-rail="${sn.rail}"]`);
        if (rb) rb.classList.add('active');
        document.getElementById('tree').innerHTML = sn.tree;
        document.getElementById('page').innerHTML = sn.page;
        document.getElementById('crumb').innerHTML = sn.crumb;
        const c = document.querySelector('.content');
        if (c) c.scrollTop = 0;
        curView = sn;
        updateBackBtn();
      }
      function updateBackBtn() {
        const bb = document.getElementById('backBtn');
        if (bb) bb.style.visibility = navHist.length ? 'visible' : 'hidden';
      }

      /* 페이지 내 앵커로 부드럽게 스크롤 이동 (같은 콘텐츠 내 섹션 간 상호 참조 링크용) */
      function jumpTo(id) {
        const t = document.getElementById(id);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return false;
      }

      /* 💰 단종 환급금 자동 계산기 (구입가/사용개월 입력 → 감가상각비·잔여금·최종 환급금 자동 산출) */
      function calcRefund(el) {
        const wrap = el.closest('.refund-calc');
        if (!wrap) return;
        const priceEl = wrap.querySelector('[data-role="price"]');
        const monthEl = wrap.querySelector('[data-role="months"]');
        const errEl = wrap.querySelector('.refund-calc-err');
        let price = parseInt((priceEl.value || '').replace(/[^0-9]/g, ''), 10);
        let months = parseInt((monthEl.value || '').replace(/[^0-9]/g, ''), 10);
        if (isNaN(price) || price < 0) price = 0;
        if (isNaN(months) || months < 0) months = 0;
        if (months > 60) {
          months = 60;
          errEl.textContent = '※ 사용개월은 내용연수(60개월)까지만 반영됩니다.';
          errEl.style.display = 'block';
        } else {
          errEl.style.display = 'none';
        }
        const dep = Math.round((months / 60) * price);
        const rem = Math.max(price - dep, 0);
        const add = Math.round(price * 0.1);
        const total = rem + add;
        wrap.querySelector('[data-out="dep"]').textContent =
          dep.toLocaleString() + '원';
        wrap.querySelector('[data-out="rem"]').textContent =
          rem.toLocaleString() + '원';
        wrap.querySelector('[data-out="add"]').textContent =
          add.toLocaleString() + '원';
        wrap.querySelector('[data-out="final"]').textContent =
          total.toLocaleString() + '원';
      }

      /* 복사 버튼 */
      function copyMacro(btn) {
        const box = btn.closest(
          '.macro,.subcard,.col-card,.star-note,.blue-note,.cmp-ment',
        );
        const text = box.querySelector(
          '.macro-body,.subcard-body,.col-body-plain,.star-body,.bn-body,.cmp-ment-body',
        ).innerText;
        navigator.clipboard.writeText(text).then(() => {
          const orig = btn.innerHTML;
          btn.innerHTML = '✓';
          btn.classList.add('done');
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.classList.remove('done');
          }, 1400);
        });
      }

      /* 레일 전환 */
      document.querySelectorAll('.rail-btn').forEach((b) => {
        b.addEventListener('click', () => {
          document
            .querySelectorAll('.rail-btn')
            .forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          curRail = b.dataset.rail;
          renderTree();
          // 첫 항목 자동 선택
          const first = document.querySelector('.tree .leaf');
          if (curRail === 'dash') {
            commitView();
          } else if (curRail === 'bm') {
            commitView();
          } else if (curRail === 'home') {
            openTo('slm_refund');
            commitView();
          } else if (first) {
            first.click();
          }
        });
      });

      /* 검색 → 결과 화면 (② 레퍼런스 방식) */
      document.getElementById('searchInput').addEventListener('input', (e) => {
        const q = e.target.value;
        if (q.trim()) renderSearch(q);
        else restoreView();
      });
      function restoreView() {
        const active = document.querySelector('.leaf.active');
        if (active) active.click();
        else openTo('slm_refund');
      }

      /* 사이드바 너비 드래그 조절 */
      (function () {
        const sb = document.querySelector('.sidebar');
        const rz = document.getElementById('sidebarResizer');
        if (!sb || !rz) return;
        const MIN = 160,
          MAX = 520;
        try {
          const w = parseInt(localStorage.getItem('olit_sidebar_w'), 10);
          if (w >= MIN && w <= MAX) sb.style.width = w + 'px';
        } catch (e) {}
        let dragging = false;
        rz.addEventListener('mousedown', (e) => {
          dragging = true;
          document.body.classList.add('col-resizing');
          rz.classList.add('dragging');
          e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
          if (!dragging) return;
          let w = e.clientX - sb.getBoundingClientRect().left;
          if (w < MIN) w = MIN;
          if (w > MAX) w = MAX;
          sb.style.width = w + 'px';
        });
        document.addEventListener('mouseup', () => {
          if (!dragging) return;
          dragging = false;
          document.body.classList.remove('col-resizing');
          rz.classList.remove('dragging');
          try {
            localStorage.setItem(
              'olit_sidebar_w',
              parseInt(sb.style.width, 10),
            );
          } catch (e) {}
        });
      })();

      /* 스크롤 위치에 맞춰 트리 소제목 색인 (스크롤스파이) */
      function updateScrollSpy() {
        if (!CUR_CID) return;
        const c = document.querySelector('.content');
        if (!c) return;
        const leaves = [];
        document.querySelectorAll('.leaf[data-anchor]').forEach((l) => {
          if (l.dataset.content === CUR_CID) leaves.push(l);
        });
        if (!leaves.length) return;
        const cTop = c.getBoundingClientRect().top;
        let best = null,
          bestPos = -1e9;
        leaves.forEach((l) => {
          const el = document.getElementById(l.dataset.anchor);
          if (!el) return;
          const rel = el.getBoundingClientRect().top - cTop;
          if (rel <= 110 && rel > bestPos) {
            bestPos = rel;
            best = l;
          }
        });
        if (!best) best = leaves[0];
        if (best.classList.contains('active')) return;
        document
          .querySelectorAll('.leaf.active')
          .forEach((l) => l.classList.remove('active'));
        best.classList.add('active');
        if (best.classList.contains('leaf-sub')) {
          const sp = best.closest('.sec-parent');
          if (sp && !sp.classList.contains('open')) {
            sp.parentElement
              .querySelectorAll('.sec-parent.open')
              .forEach((x) => x.classList.remove('open'));
            sp.classList.add('open');
          }
        }
      }
      (function () {
        const c = document.querySelector('.content');
        if (!c) return;
        let ticking = false;
        c.addEventListener('scroll', () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            updateScrollSpy();
            ticking = false;
          });
        });
      })();

      /* 로그인 사용자 배지 (Cloudflare Access identity) */
      (function () {
        try {
          fetch('/cdn-cgi/access/get-identity', { credentials: 'same-origin' })
            .then((r) => (r.ok ? r.json() : null))
            .then((d) => {
              if (!d || !d.email) return;
              const b = document.getElementById('userBadge');
              if (!b) return;
              document.getElementById('ubEmail').textContent = d.email;
              b.style.display = 'flex';
            })
            .catch(() => {});
        } catch (e) {}
      })();

      /* 초기 렌더 */
      buildSearchIndex();
      renderTree();
      commitView();
    </script>
  </body>
</html>
