  });
})();

/* =========================================================
   ✏️ 웹 편집기 : "수정하기" → 본문/제목 직접 수정 → GitHub 자동 반영
   - 실제 저장 권한은 이 코드가 아니라 "GitHub 저장소 Write 권한"이 결정함
     (권한 없는 계정 토큰으로는 저장 API 자체가 거부됨)
   - 소스 원문에서 수정 전 텍스트를 정확히(그리고 유일하게) 찾은 경우에만
     반영하고, 못 찾으면 절대 추측하지 않고 실패로 표시함 (안전 우선)
========================================================= */
const GH_OWNER="SLOOmCX", GH_REPO="CS_template", GH_BRANCH="main", GH_PATH="index.html";
const EDITABLE_SEL=".macro-body,.subcard-body,.guide-body,.col-body,.col-body-plain,.star-body,.bn-body,.cmp-ment-body,.quote-box,h1,h2,h3,.mname,.sc-label,.sub,.cmp-table td,.cmp-table th";
let EDIT_MODE=false;
let EDIT_ORIG=new Map(); // el -> 편집 시작 시점 innerHTML 스냅샷

function edUtf8ToB64(str){
  const bytes=new TextEncoder().encode(str);
  let bin=""; bytes.forEach(b=>{ bin+=String.fromCharCode(b); });
  return btoa(bin);
}
function edB64ToUtf8(b64){
  const bin=atob(b64.replace(/\n/g,""));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function edEsc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function edGetToken(){ try{ return sessionStorage.getItem("gh_pat")||localStorage.getItem("gh_pat")||""; }catch(e){ return ""; } }
function edSetToken(tok,remember){
  try{
    sessionStorage.setItem("gh_pat",tok);
    if(remember) localStorage.setItem("gh_pat",tok); else localStorage.removeItem("gh_pat");
  }catch(e){}
}

function edShowTokenModal(){
  return new Promise((resolve)=>{
    const bg=document.createElement("div"); bg.className="ed-modal-bg";
    bg.innerHTML=`<div class="ed-modal">
      <h3>🔑 GitHub 개인 토큰 입력</h3>
      <p>수정 내용을 저장소에 바로 반영하려면 이 저장소 쓰기(write) 권한이 있는 GitHub 개인 액세스 토큰(PAT)이 필요해요. 토큰은 이 브라우저에서 GitHub로만 직접 전송되고, 다른 서버에는 저장되지 않아요.</p>
      <p style="background:#fff6da;border:1px solid #f0e2b8;border-radius:8px;padding:9px 12px;margin-top:-6px;color:#6b5a1a;font-size:12px">⚠️ 로그인 비밀번호나 2단계 인증(2FA) 복구 코드가 아니에요. GitHub 우측 상단 프로필 → Settings → Developer settings → Fine-grained tokens에서 별도로 발급받는 토큰(<code>github_pat_...</code>로 시작)을 넣어주세요.</p>
      <input type="password" id="edTokenInput" placeholder="github_pat_ 로 시작하는 토큰 붙여넣기" autocomplete="off">
      <label class="ed-chk"><input type="checkbox" id="edTokenRemember"> 이 기기에 저장 (다음부터 안 물어봄)</label>
      <div class="ed-btnrow">
        <button class="ed-no" type="button">취소</button>
        <button class="ed-ok" type="button">확인</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    const input=bg.querySelector("#edTokenInput");
    const remember=bg.querySelector("#edTokenRemember");
    setTimeout(()=>input.focus(),0);
    const finishCancel=()=>{ bg.remove(); resolve(null); };
    const finishOk=()=>{
      const v=input.value.trim();
      if(!v){ input.focus(); return; }
      edSetToken(v, remember.checked);
      bg.remove(); resolve(v);
    };
    bg.querySelector(".ed-no").onclick=finishCancel;
    bg.querySelector(".ed-ok").onclick=finishOk;
    bg.addEventListener("keydown",e=>{
      if(e.key==="Enter"){ e.preventDefault(); finishOk(); }
      if(e.key==="Escape"){ e.preventDefault(); finishCancel(); }
    });
  });
}

function edShowReportModal(applied,failed,commitUrl){
  const bg=document.createElement("div"); bg.className="ed-modal-bg";
  const okList=applied.map(a=>`<li class="ed-ok-item">✅ ${edEsc(a)}</li>`).join("");
  const failList=failed.map(f=>`<li class="ed-fail-item">⚠️ ${edEsc(f)}</li>`).join("");
  let msg="";
  if(applied.length>0) msg+=`${applied.length}건 GitHub에 반영했어요. 1분 정도 후 새로고침하면 사이트에 보여요.`;
  if(failed.length>0) msg+=(msg?" ":"")+`${failed.length}건은 소스 원문을 정확히 찾지 못해 자동 반영에 실패했어요 — 아래 내용을 그대로 복사해서 Claude에게 반영을 요청해 주세요.`;
  if(!applied.length && !failed.length) msg="변경된 내용이 없어요.";
  bg.innerHTML=`<div class="ed-modal ed-report">
    <h3>${applied.length>0?"저장 완료":(failed.length>0?"저장 실패":"변경 없음")}</h3>
    <p>${msg}</p>
    <ul>${okList}${failList}</ul>
    <div class="ed-btnrow" style="margin-top:14px">
      ${commitUrl?`<a href="${commitUrl}" target="_blank" style="align-self:center;font-size:12px;color:#234A86;margin-right:auto">커밋 보기 ↗</a>`:""}
      <button class="ed-ok" type="button">확인</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector(".ed-ok").onclick=()=>bg.remove();
}

function edKeydownHandler(e){
  if(e.key==="Enter"){ e.preventDefault(); document.execCommand("insertText", false, "\n"); }
}
function edPasteHandler(e){
  e.preventDefault();
  const text=(e.clipboardData||window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, text);
}
function edInputHandler(e){
  const el=e.currentTarget;
  el.classList.toggle("ed-changed", el.innerHTML!==EDIT_ORIG.get(el));
}

function toggleEditMode(){ EDIT_MODE? edExit(true) : edEnter(); }

function edEnter(){
  const page=document.getElementById("page"); if(!page) return;
  EDIT_MODE=true; EDIT_ORIG.clear();
  const all=[...page.querySelectorAll(EDITABLE_SEL)];
  // 카드 안에 카드가 중첩된 경우(예: col-body 안에 subcard-body) 안쪽 요소만 편집 대상으로 삼음 —
  // 편집 영역이 겹치면 브라우저가 텍스트를 미묘하게 재구성해 저장 시 불필요한 "실패" 항목이 생김
  const targets=all.filter(el=>!all.some(other=>other!==el && el.contains(other)));
  targets.forEach(el=>{
    EDIT_ORIG.set(el, el.innerHTML);
    el.setAttribute("contenteditable","true");
    el.classList.add("edit-target");
    el.addEventListener("keydown", edKeydownHandler);
    el.addEventListener("paste", edPasteHandler);
    el.addEventListener("input", edInputHandler);
  });
  const btn=document.getElementById("editModeBtn"); if(btn) btn.textContent="✕ 편집 종료";
  edShowSaveBar();
}

function edExit(discard){
  EDIT_ORIG.forEach((html,el)=>{
    el.removeAttribute("contenteditable");
    el.classList.remove("edit-target","ed-changed");
    el.removeEventListener("keydown", edKeydownHandler);
    el.removeEventListener("paste", edPasteHandler);
    el.removeEventListener("input", edInputHandler);
    if(discard) el.innerHTML=html;
  });
  EDIT_MODE=false; EDIT_ORIG.clear();
  const btn=document.getElementById("editModeBtn"); if(btn) btn.textContent="✏️ 수정하기";
  edHideSaveBar();
}

function edShowSaveBar(){
  let bar=document.getElementById("editSaveBar");
  if(!bar){
    bar=document.createElement("div"); bar.id="editSaveBar";
    bar.innerHTML=`<span>✏️ 편집 모드 — 본문·제목을 클릭해서 바로 고치세요</span>
      <button class="es-cancel" type="button" onclick="edExit(true)">취소</button>
      <button class="es-token" type="button" onclick="edResetToken()" title="저장된 토큰을 지우고 다시 입력">🔑 토큰 변경</button>
      <button class="es-save" type="button" onclick="edSave()">💾 저장 (GitHub 반영)</button>`;
    document.body.appendChild(bar);
  }
  bar.style.display="flex";
}
function edHideSaveBar(){ const bar=document.getElementById("editSaveBar"); if(bar) bar.style.display="none"; }
function edResetToken(){
  try{ sessionStorage.removeItem("gh_pat"); localStorage.removeItem("gh_pat"); }catch(e){}
  alert("저장된 토큰을 지웠어요. '저장' 버튼을 다시 누르면 새 토큰을 입력할 수 있어요.");
}

function edVariant(s, mode){
  // mode 0: 원문 그대로(실제 줄바꿈) / 1: \n → 리터럴 \n 이스케이프 / 2: 1번 + 큰따옴표까지 이스케이프
  let r=s;
  if(mode>=1) r=r.replace(/\\/g,"\\\\").replace(/\n/g,"\\n");
  if(mode>=2) r=r.replace(/"/g,'\\"');
  return r;
}

async function edSave(){
  const changed=[...EDIT_ORIG.entries()].filter(([el,orig])=>el.innerHTML!==orig);
  if(changed.length===0){ edShowReportModal([],[]); return; }

  let token=edGetToken();
  if(!token){ token=await edShowTokenModal(); if(!token) return; }

  const saveBtn=document.querySelector("#editSaveBar .es-save");
  if(saveBtn){ saveBtn.disabled=true; saveBtn.textContent="저장 중…"; }

  try{
    const fileRes=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`,{
      headers:{Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json"}
    });
    if(!fileRes.ok){
      if(fileRes.status===401||fileRes.status===403){
        // 잘못된 토큰이 저장돼 있으면 계속 같은 오류만 반복되므로, 실패 시 저장된 토큰을 지워서
        // 다음 저장 시도 때 새 토큰을 다시 입력받도록 함
        try{ sessionStorage.removeItem("gh_pat"); localStorage.removeItem("gh_pat"); }catch(e){}
      }
      const why=fileRes.status===401?"토큰이 유효하지 않아요. 저장된 토큰을 지웠으니, 다시 '저장'을 눌러 새 토큰을 입력해 주세요.\n\n※ 2단계 인증(2FA) 복구 코드가 아니라, GitHub에서 별도로 발급하는 개인 액세스 토큰(PAT)이어야 해요.":
                 fileRes.status===403?"이 계정은 저장소 쓰기 권한이 없어요. (저장된 토큰은 지웠어요)":
                 `파일을 불러오지 못했어요 (오류 코드 ${fileRes.status})`;
      throw new Error(why);
    }
    const fileJson=await fileRes.json();
    let src=edB64ToUtf8(fileJson.content);
    const sha=fileJson.sha;

    const applied=[], failed=[];
    for(const [el,origHTML] of changed){
      const newHTML=el.innerHTML;
      const label=(el.closest(".macro,.subcard,.col-card,.guide-card,.star-note,.blue-note")
        ?.querySelector(".mname,.sc-label,.col-h span,.star-h b,.bn-h b")?.textContent
        || el.tagName).trim().slice(0,40) || "(제목 없음)";

      if(origHTML.trim()===""){
        failed.push(`${label} → 원래 비어있던 항목이라 자동 반영이 안 돼요. 새로 입력한 문구를 Claude에게 알려주세요: "${el.textContent.trim().slice(0,80)}"`);
        continue;
      }

      let done=false;
      for(let mode=0; mode<3 && !done; mode++){
        const needle=edVariant(origHTML, mode);
        const cnt=src.split(needle).length-1;
        if(cnt===1){
          src = src.split(needle).join(edVariant(newHTML, mode));
          done=true;
        }
      }
      if(done) applied.push(`${label} 수정됨`);
      else failed.push(`${label} → 소스에서 정확히 못 찾아 자동 반영 실패. 원문: "${el.textContent.trim().slice(0,60)}"`);
    }

    if(applied.length===0){
      edShowReportModal(applied,failed);
      return;
    }

    const putRes=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`,{
      method:"PUT",
      headers:{Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json", "Content-Type":"application/json"},
      body:JSON.stringify({
        message:`[웹 편집기] ${applied.length}건 문구 수정`,
        content:edUtf8ToB64(src),
        sha:sha,
        branch:GH_BRANCH
      })
    });
    if(!putRes.ok){
      const errJson=await putRes.json().catch(()=>({}));
      throw new Error(`GitHub 저장 실패 (오류 코드 ${putRes.status}) ${errJson.message||""}`);
    }
    const putJson=await putRes.json();
    edExit(false);
    edShowReportModal(applied,failed,putJson.commit&&putJson.commit.html_url);
  }catch(err){
    alert("저장 중 오류가 발생했어요: "+err.message);
  }finally{
    const btn=document.querySelector("#editSaveBar .es-save");
    if(btn){ btn.disabled=false; btn.textContent="💾 저장 (GitHub 반영)"; }
  }
}

/* 편집 중 다른 페이지로 이동하면 편집 상태 안전하게 종료 */
(function(){
  const _edOrigRender=render;
  render=function(html){
    if(EDIT_MODE) edExit(true);
    return _edOrigRender(html);
  };
})();

</script>
