<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>올릿 CX 응대 템플릿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#234A86; --primary-bg:#F4F8FD;
    --secondary:#9b6829; --secondary-bg:#faf5ea;
    --info:#DCE8F7;
    --title:#0d253d; --text:#273951; --subtext:#64748d;
    /* 기존 변수명 → 신규 팔레트 매핑 (DESIGN.md 기준) */
    --trust-blue:#234A86;
    --trust-blue-2:#1B3A68;
    --trust-blue-press:#15294a;
    --vanilla:#f5e9d4;
    --beige:#e8dcc3;
    --skyblue:#C7DAF2;
    --peanut:#9b6829;
    --skyblue-soft:#F4F8FD;
    --vanilla-soft:#faf5ea;
    --beige-soft:#faf5ea;
    --line:#e3e8ee;
    --ink:#0d253d;
    --ink-soft:#64748d;
    --white:#ffffff;
    --bg:#ffffff;
    /* DESIGN.md 신규 토큰 : 라운드 / 그림자 / 폰트 */
    --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-pill:9999px;
    /* 여백 체계 (2026-08 정리) */
    --space-section-major:44px; --space-section:32px; --space-title-content:14px;
    --space-content:12px; --space-compact:8px; --space-grid:14px;
    --shadow-1:0 1px 3px rgba(0,55,112,.08);
    --shadow-2:0 8px 24px rgba(0,55,112,.08), 0 2px 6px rgba(0,55,112,.04);
    --font-ui:'Inter','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font-ui);
    font-feature-settings:"ss01","tnum";
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;height:calc(100vh / 1.1);overflow:hidden;-webkit-font-smoothing:antialiased;zoom:1.1;
  }

  /* ── 0) 상단 가로 헤더 ── */
  .appbar{
    height:58px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px;
    z-index:20;box-shadow:0 1px 0 rgba(0,55,112,.04), 0 2px 10px rgba(0,55,112,.03);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .logo-txt{font-size:23px;font-weight:800;color:var(--trust-blue);letter-spacing:-.5px;}
  .brand .app-title{font-size:15px;font-weight:700;color:var(--ink);padding-left:14px;border-left:1px solid var(--line);}
  .brand .beta{font-size:10px;font-weight:800;color:var(--trust-blue);background:var(--skyblue-soft);
    border:1px solid #d6d3fb;padding:2px 9px;border-radius:var(--radius-pill);letter-spacing:.5px;}
  .appbar-search{
    display:flex;align-items:center;gap:8px;background:#F3F5F7;border:1px solid var(--line);
    border-radius:24px;padding:9px 16px;width:400px;max-width:42vw;flex-shrink:0;transition:.15s;
  }
  .appbar-search:focus-within{border-color:var(--skyblue);box-shadow:0 0 0 3px var(--skyblue-soft);background:#fff;}
  .appbar-search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink);}
  .appbar-right{display:flex;align-items:center;gap:14px;}
  .user-bar{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .ub-email{font-size:13px;color:var(--ink-soft);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ub-btn{font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 12px;cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap;}
  .ub-btn:hover{border-color:var(--skyblue);color:var(--trust-blue);background:var(--skyblue-soft);}
  /* 북마크 UI */
  .bm-star{background:none;border:none;cursor:pointer;font-size:15px;color:#c9ccd1;padding:0 5px;margin-left:14px;line-height:1;transition:.12s;}
  .bm-star:hover,.bm-star.on{color:#f5b800;}
  .page-star{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;flex-shrink:0;transition:.12s;}
  .page-star.on{color:#e0a800;border-color:#f3d68a;background:#fffaf0;}
  .page-star:hover{border-color:#f3d68a;}
  .bm-page{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:8px;cursor:pointer;font-size:13px;color:var(--ink);background:#fff;transition:.12s;}
  .bm-page:hover{border-color:var(--skyblue);background:var(--skyblue-soft);}
  .bm-page .bm-star{cursor:default;}
  .bm-del{background:none;border:none;color:#c9ccd1;cursor:pointer;font-size:13px;margin-left:auto;padding:2px 7px;border-radius:var(--radius-sm);}
  .bm-del:hover{color:#e5484d;background:#fdeaea;}
  .bm-empty{padding:14px 16px;color:var(--ink-soft);font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:var(--radius-md);margin-bottom:8px;}
  .body-row{flex:1;display:flex;overflow:hidden;}

  /* ── 1) 아이콘 레일 ── */
  .rail{
    width:54px;background:#F7FAFB;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;
    padding:14px 0;gap:6px;flex-shrink:0;
  }
  .rail-btn{
    width:42px;height:42px;border-radius:var(--radius-lg);border:none;cursor:pointer;
    background:transparent;color:#64748d;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;position:relative;
  }
  .rail-btn:hover{background:#EDF1F8;color:var(--primary);}
  .rail-btn.active{background:var(--primary);color:#fff;}
  .rail-div{width:26px;height:1px;background:rgba(0,0,0,.08);margin:8px 0;}
  .rail-cap{font-size:8px;color:#9aa2ad;font-weight:700;letter-spacing:.3px;margin:2px 0;}

  /* ── 2) 2차 트리 메뉴 ── */
  .sidebar{
    width:248px;min-width:160px;max-width:520px;background:var(--white);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0;
  }
  /* 사이드바 너비 조절 핸들 */
  .resizer{
    width:6px;flex-shrink:0;cursor:col-resize;background:transparent;
    position:relative;z-index:5;margin-left:-3px;
  }
  .resizer::before{
    content:"";position:absolute;left:2px;top:0;bottom:0;width:2px;background:transparent;transition:.15s;
  }
  .resizer:hover::before,.resizer.dragging::before{background:var(--skyblue);}
  body.col-resizing{cursor:col-resize;user-select:none;}
  body.col-resizing .content{pointer-events:none;}
  .sidebar-head{
    padding:18px 18px 12px;border-bottom:1px solid var(--line);
  }
  .sidebar-head h2{font-size:16px;color:var(--trust-blue);font-weight:800;}
  .sidebar-head p{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .search{
    margin:12px 14px 4px;display:flex;align-items:center;gap:6px;
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);padding:8px 10px;
  }
  .search input{border:none;background:transparent;outline:none;font-size:12px;width:100%;color:var(--ink);}
  .tree{flex:1;overflow-y:auto;padding:8px 8px 20px;}
  .tree::-webkit-scrollbar{width:6px;}
  .tree::-webkit-scrollbar-thumb{background:#d5dae2;border-radius:3px;}

  .group-label{
    font-size:10px;font-weight:700;color:var(--peanut);letter-spacing:.5px;
    padding:12px 12px 6px;text-transform:uppercase;
  }
  .node{user-select:none;}
  .node-toggle{
    display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
    cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);transition:.12s;
  }
  .node-toggle:hover{background:var(--skyblue-soft);}
  .node-toggle .arrow{font-size:10px;color:var(--ink-soft);transition:.2s;width:10px;}
  .node.open>.node-toggle .arrow{transform:rotate(90deg);}
  .node-children{display:none;margin-left:15px;padding-left:6px;border-left:1px solid #e9ecf1;}
  .node.open>.node-children{display:block;}
  .leaf{
    display:flex;align-items:center;gap:7px;padding:8px 12px 8px 20px;border-radius:9px;
    cursor:pointer;font-size:12.5px;color:var(--ink-soft);transition:.12s;
  }
  .leaf:hover{background:var(--skyblue-soft);color:var(--ink);}
  .leaf.active{background:var(--skyblue);color:var(--trust-blue);font-weight:700;}
  .leaf .dot{width:5px;height:5px;border-radius:50%;background:var(--peanut);flex-shrink:0;}
  .leaf.active .dot{background:var(--trust-blue);}
  .divider{height:1px;background:var(--line);margin:10px 14px;}
  .tree-divider{border-top:1px dashed #c3cad4;margin:10px 16px 6px;}

  /* ── 3) 콘텐츠 ── */
  .content{flex:1;overflow-y:auto;padding:0;}
  .content::-webkit-scrollbar{width:9px;}
  .content::-webkit-scrollbar-thumb{background:#d5dae2;border-radius:4px;}
  .topbar{
    position:sticky;top:0;z-index:5;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    padding:14px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .back-btn{border:1px solid var(--line);background:#fff;color:var(--trust-blue);font-size:12px;font-weight:700;padding:5px 12px;border-radius:var(--radius-md);cursor:pointer;transition:.12s;flex-shrink:0;}
  .back-btn:hover{background:var(--skyblue);}
  .crumb{font-size:12px;color:var(--ink-soft);}
  .crumb b{color:var(--title);}
  /* 우측 상단 검색 */
  .topbar-search{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:24px;padding:9px 16px;width:340px;flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,55,112,.05);transition:.15s;
  }
  .topbar-search:focus-within{border-color:var(--skyblue);box-shadow:0 0 0 3px var(--skyblue-soft);}
  .topbar-search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink);}
  /* 검색 결과 */
  .sr-title{font-size:23px;font-weight:800;color:var(--title);margin-bottom:3px;}
  .sr-title span{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .sr-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
  .sr-item{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px 18px;
    margin-bottom:12px;cursor:pointer;transition:.12s;
  }
  .sr-item:hover{border-color:var(--skyblue);box-shadow:0 2px 12px rgba(0,55,112,.08);}
  .sr-path{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:7px;}
  .sr-path b{color:var(--trust-blue);font-weight:800;}
  .sr-snip{font-size:13.5px;color:var(--ink);line-height:1.6;}
  .sr-tag{color:var(--trust-blue);font-weight:800;}
  .sr-snip mark{background:var(--skyblue);color:var(--trust-blue);padding:0 3px;border-radius:3px;}
  .sr-none{text-align:center;padding:70px 20px;color:var(--ink-soft);font-size:14px;}
  .page{padding:32px 32px 88px;max-width:1200px;}
  .page h1{
    font-size:26px;color:var(--title);font-weight:800;margin-bottom:4px;
    display:flex;align-items:center;gap:10px;
  }
  .page .sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

  /* 챕터(단계 내 구간) */
  .chapter{margin:0 0 34px;}
  .section-title{
    font-size:20px;font-weight:800;color:var(--title);margin:0 0 16px;
    display:flex;align-items:center;gap:9px;
    padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .section-title .ic{font-size:20px;}

  /* 📌 참고사항 (내부용) — 연회색 틴트로 템플릿(화이트)과 구분 */
  .guide-card{
    background:var(--vanilla-soft);border:1px solid #e8dcc3;
    border-radius:var(--radius-lg);padding:16px 20px;margin:0 0 var(--space-content);box-shadow:none;
  }
  .note-tight{margin:0 0 var(--space-content);}
  .guide-head{
    font-weight:800;color:var(--ink);font-size:14px;margin-bottom:9px;
    display:flex;align-items:center;gap:8px;
  }
  .badge-int{font-size:10px;background:var(--ink-soft);color:#fff;padding:2px 8px;border-radius:var(--radius-pill);font-weight:700;letter-spacing:.3px;}
  .guide-body{font-size:13px;line-height:1.8;color:#5c4a38;white-space:pre-line;}
  .sub-ex{font-size:12px;color:#9b6829;margin:2px 0 12px;line-height:1.5;}
  .flow-diagram{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:16px 0;}
  .fd-box{flex:1 1 130px;min-width:118px;background:#fff;border:1.5px solid var(--trust-blue);border-radius:var(--radius-md);padding:12px 10px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.4;}
  .fd-arrow{display:flex;align-items:center;justify-content:center;color:var(--trust-blue);font-weight:800;flex:0 0 auto;font-size:14px;}
  .fork{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:6px 0 16px;padding:12px 0 4px 18px;border-left:3px dashed var(--trust-blue);}
  @media(max-width:820px){.fork{grid-template-columns:1fr;}}
  .fork-label{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--trust-blue);padding:3px 12px;border-radius:var(--radius-pill);margin-bottom:8px;}
  .fork-branch.b2 .fork-label{background:#9b6829;}
  .fork.fork-split{border-left:none;padding:12px 0 4px 0;gap:0;}
  .fork.fork-split .fork-branch{padding:0 20px;}
  .fork.fork-split .fork-branch:first-child{border-right:2px dashed var(--trust-blue);}
  .fork .flow-diagram{margin:0;}
  .fork-label-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .fork-label-row .fork-label{margin-bottom:0;flex:none;}
  .fork-label-line{flex:1;border-top:2px dashed var(--trust-blue);height:0;margin-top:1px;}
  .fork-branch.b2 .fork-label-line{border-top-color:#9b6829;}
  .fork-label-desc{flex:none;font-size:12px;font-weight:700;color:var(--trust-blue);white-space:nowrap;}
  .fork-branch.b2 .fork-label-desc{color:#9b6829;}
  .free-flow-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:var(--radius-pill);margin-bottom:6px;}
  .free-flow-tag.principle{background:var(--trust-blue);color:#fff;}
  .free-flow-tag.exception{background:#f1f5f9;color:#64748b;border:1px solid var(--line);}
  .free-flow-box{background:var(--skyblue-soft);border:1.5px solid var(--trust-blue);border-radius:var(--radius-md);padding:12px 10px;font-size:12.5px;font-weight:800;text-align:center;color:var(--trust-blue);}
  .free-flow-box.exception{background:#fff;border:1.5px dashed #94a3b8;color:#475569;font-weight:700;}
  .free-flow-connector{text-align:center;font-size:11px;color:#8a94a6;margin:8px 0;}
  .quote-box{border-left:4px solid var(--trust-blue);background:#f5f8fc;padding:12px 16px 12px 18px;margin:0 0 var(--space-content);font-size:12.5px;line-height:1.75;color:var(--ink);border-radius:0 10px 10px 0;white-space:pre-line;}
  .quote-box b{color:var(--trust-blue);font-weight:800;}
  .quote-box a.jump-link,.astbl a.jump-link,.guide-body a.jump-link,.star-body a.jump-link{color:var(--trust-blue);font-weight:700;text-decoration:underline;cursor:pointer;}
.auto-link{color:var(--trust-blue);text-decoration:underline;word-break:break-all;}
  .dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:26px 0;}
  .dash-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-xl);padding:26px 22px;cursor:pointer;transition:.15s;}
  .dash-card:hover{border-color:var(--trust-blue);box-shadow:0 6px 18px rgba(0,55,112,.10);transform:translateY(-2px);}
  .dash-ico{font-size:30px;line-height:1;}
  .dash-card h3{margin:14px 0 9px;font-size:16px;color:var(--trust-blue);font-weight:800;}
  .dash-card p{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink-soft);}
  .dash-go{margin-top:16px;font-size:12px;font-weight:700;color:var(--trust-blue);}
  @media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}
  .v2-nest{margin:2px 0 16px 18px;border-left:3px solid #e6ebf3;padding-left:14px;}
  .warn-note{background:#ffe9a8;border:1px solid #f0cf6b;border-left:4px solid #e0a800;border-radius:var(--radius-md);padding:11px 16px;margin:0 0 var(--space-content);font-size:13px;font-weight:700;color:#6b4a1a;line-height:1.6;white-space:pre-line;}
  .branch-box{background:#fff;border:1px solid var(--line);border-left:4px solid var(--trust-blue);border-radius:var(--radius-lg);padding:15px 18px;margin:0 0 var(--space-content);}
  .branch-h{font-weight:800;color:var(--trust-blue);font-size:13.5px;margin-bottom:12px;}
  .branch-tbl{border-collapse:separate;border-spacing:0 7px;font-size:13px;}
  .branch-tbl td{padding:3px 0;vertical-align:middle;color:var(--ink);}
  .branch-tbl td.cond{font-weight:600;}
  .branch-tbl td.ar{padding:0 14px;color:var(--ink-soft);font-weight:800;}
  .bdg{display:inline-block;padding:3px 13px;border-radius:var(--radius-pill);font-weight:800;font-size:12.5px;white-space:nowrap;}
  .b-blue{background:#e5efff;color:#1e3a5f;}
  .b-amber{background:#fff2cc;color:#6b4a1a;}
  .b-pink{background:#ffe3ea;color:#ea2261;}
  .branch-note{margin-top:11px;font-size:12px;color:#6b4a1a;background:#fff8e6;border:1px solid #f0e2b8;border-radius:var(--radius-md);padding:8px 11px;line-height:1.5;}
  .alert-red{background:#ffe3ea;border:1px solid #f3b4c2;border-left:4px solid #9b6829;border-radius:var(--radius-md);padding:11px 16px;margin:12px 0;font-size:13px;font-weight:800;color:#ea2261;line-height:1.6;}
  .guide-body ul{list-style:none;}
  .guide-body li{position:relative;padding-left:18px;margin:5px 0;}
  .guide-body li:before{content:"→";position:absolute;left:0;color:var(--ink-soft);font-weight:700;}
  .guide-body a{color:var(--trust-blue);font-weight:700;}
  .leaf-secgrp{font-weight:800;color:var(--ink);padding:5px 10px;margin:3px 0;}
  .leaf-sec{padding-left:24px;}
  .leaf-sub{padding-left:42px;font-size:12px;color:var(--ink-soft);}
  .sec-children{display:none;}
  .sec-parent.open>.sec-children{display:block;}
  .sec-parent-h{cursor:pointer;}
  .sec-caret{display:inline-block;width:12px;font-size:9px;color:var(--ink-soft);transition:transform .15s;margin-right:1px;}
  .sec-parent.open>.sec-parent-h .sec-caret{transform:rotate(90deg);}
  .grp-h{font-weight:800;color:var(--ink);font-size:15px;margin:var(--space-section) 0 var(--space-title-content);scroll-margin-top:70px;}
  .grp-h.grp-major{font-size:16.5px;color:var(--title);margin:var(--space-section) 0 var(--space-title-content);padding-bottom:8px;border-bottom:1px solid var(--line);}
  .grp-h.grp-sub{font-size:13.5px;color:var(--peanut);margin:var(--space-section) 0 var(--space-title-content);}

  /* 카드 그리드 */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-grid);margin-bottom:var(--space-content);}
  .stack{display:flex;flex-direction:column;gap:var(--space-content);margin-bottom:var(--space-content);}
  @media(max-width:820px){.grid2{grid-template-columns:1fr;}}

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    overflow:hidden;box-shadow:0 1px 3px rgba(0,55,112,.04);
  }
  .card-head{
    padding:11px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;
  }
  .card-head.ok{background:var(--skyblue-soft);color:var(--trust-blue);}
  .card-head.no{background:var(--beige-soft);color:#6b4a1a;}
  .card-head.blue{background:var(--skyblue);color:var(--trust-blue);}
  .card-head.pink{background:var(--vanilla);color:#6b4a1a;}
  .card-body{padding:14px 16px;font-size:13px;line-height:1.7;color:var(--ink);}
  .card-body ul{list-style:none;}

다만, 정격전압 확인이 어려워 어댑터의 5V 2A 표기가 보이도록 추가 촬영 부탁드립니다 🙏🏽

※ 적정 정격전압이 아닌 충전기 사용 시 제품 작동 이상이나 고장의 원인이 될 수 있어 확인이 필요한 점 양해 부탁드립니다.
※ 숫자와 표기가 선명하게 보이도록 가까이서 촬영 부탁드립니다.`)}</div>${guide(`<b>👉🏻 증빙(사진·영상) 확인 완료 시 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동</b>`)}</div></div><div class="typ" id="t2"><span class="tnum">2</span>작동 관련 증상</div><div class="lvl3-body">${caution(`⚠️ 제품별 작동 관련 증상은 상이 (마사지볼 작동 불량, 에어백 불량 등) 하며 충전/전원 불량이 아닌 사진/영상으로 확인 가능한 모든 작동 불량을 포함함.`)}${macro(`i. 사진/영상 확인`,"불량AS_사진영상_작동관련증상",`📷 고객님, 정확한 불량 증상 확인을 위해\n번거로우시겠지만 아래 2가지가 모두 확인되도록 촬영 부탁드립니다.\n\n1️⃣ 불량 증상이 나타나는 장면 (작동 시도 영상)\n2️⃣ 충전기(어댑터) 정격전압의 5V 2A 표시\n※ 정격전압이 아닌 충전기 사용 시 제품 오작동 및 고장의 원인이 될 수 있어 확인이 필요한 점 양해 부탁드립니다.`)}${guide(`<b>👉🏻 증빙(사진·영상) 확인 완료 시 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동</b>`)}</div><div class="typ" id="t3"><span class="tnum">3</span>소음·온열·EMS 강도</div><div class="lvl3-body">${caution(`🚨 사용자의 ‘체감 강도’ 관련 문의만 해당함\n→ 육안으로 확인이 어려운 유형으로, 사진/영상 요청은 진행하지 않음`)}<table style="border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:13px"><thead><tr><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 적용 예시</th><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 미적용 예시 (작동 불량 등으로 진행)</th></tr></thead><tbody><tr><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">소리가 너무 커요 / 너무 뜨거워요 / 전기가 느껴지지 않습니다 등</td><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">온도·강도 조절 버튼 불량 / EMS 단계 조절 기능 자체 불량 등</td></tr></tbody></table>${guide(`👉🏻 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동`)}</div></div>
  <div class="h2lvl as-sub" id="groupB">B. 사용법 안내 불필요</div>
  <div class="lvl2-body"><div class="typ" id="t5"><span class="tnum">4</span>구성품 누락</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"구성품_사진영상",`고객님, 번거로우시겠지만 수령하신 제품의 구성품 전체가 확인되도록 사진을 보내주시면 \n빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"구성품_7일경과_불가",`구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"구성품_7일경과_예외",`고객님, 앞서 안내드린 것처럼 구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 구성품 전체가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">2️⃣ 별도 재출고 안내</div>${macro(`i. 별도 재출고 안내`,"구성품_재출고안내",`확인 감사합니다.\n이용에 불편을 드려 정말 죄송합니다.\n누락된 (구성품명)은 재출고로 진행해 드리겠습니다.`)}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}${macro(`iii. 출고 시일 소요 안내`,"구성품_재출고시일",`확인 감사합니다.\n\n🚚 재출고 일정 안내드리겠습니다.\n\n· 출고 : 영업일 2일 이내\n· 배송 : 접수일로부터 영업일 5~6일 소요\n· 택배사 : CJ대한통운\n\n※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 양해 부탁드립니다.`,`▶ 상담 종료 후 <a href="https://docs.google.com/spreadsheets/d/1Bj5stx8hXMoPL8L91EYu6e5TA7pqEAjges4Cejs1wjo/edit?gid=388846546#gid=388846546" target="_blank">수기출고 통합 시트</a> - 자사 제품 신청 탭\n\n⚠️ 본품 전체 출고일 경우, ※문구 삭제 필요`)}<div class="grp-h">🔔 [예외케이스] 구성품 누락으로 전체 반품 희망</div><div class="quote-box"><b>상품 개봉 여부와 무관하게 제품 회수 및 전액 환불 처리로 진행</b></div>${macro(`i. 포장 및 회수 안내`,"구성품_포장회수_증정품X",`<b>전액 환불 접수 도와드리겠습니다.</b>\n\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 슬룸 ]</b> 표기 부탁드립니다.\n\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.` + caution(`🎁 증정품 회수 O`))}<div class="grp-h">② 결제수단별 환불 안내</div><div class="grid2">${col("blue","◆ 카드결제",subcard(`i. 카드결제 취소`,"검수환불안내_카드_클레임O",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있습니다.\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`))}${col("pink","◆ 계좌 환불",`<div class="stack">`+subcard(`i. 계좌 환불 (무통장·가상계좌)`,"검수환불안내_계좌확인_클레임O",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`)+subcard(`ii. 이후 계좌 정보 확인`,"검수환불안내_계좌등록",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)+`</div>`)}</div></div><div class="typ" id="t6"><span class="tnum">5</span>이염/오염/초도파손</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"이염_사진영상",`고객님, 번거로우시겠지만 수령하신 제품의 (이염·오염·파손) 상태가 확인되도록 사진을 보내주시면 빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"이염_7일경과_불가",`제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"이염_7일경과_예외",`고객님, 앞서 안내드린 것처럼 제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 이염·오염 상태가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">② 고객 요청 처리 방안 확인</div>${macro(`고객 요청 처리 방안 확인`,"불량AS_처리방안확인",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}${guide(`⚠️ 상품수령일로부터 7일 이내 이염/오염/초도파손은 고객이 원하는 처리 방안(교환 또는 반품) 확인 후 진행 (단, 기간별 정책에 따라만 진행 가능)\n👉🏻 교환 요청 시 <a class="jump-link" href="#freeBranch" onclick="return jumpTo('freeBranch')">🔷 무상 교환 안내</a> 로 이동\n👉🏻 반품 요청 시 <a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동`)}</div></div>
  <div class="h2lvl" id="t4">🔁 재불량 (교환품 동일 증상)</div>
  <div class="lvl2-body">${caution(`👉 [예시] 2026.01.01 허리편한케어 V1 충전 불량으로 무상 교환 진행 → 2026.03.02 교환 제품에서 동일 증상(충전 불량)으로 재문의`)}<div class="grp-h">💡 공통 안내</div>${macro(`i. 사과·양해 멘트`,"재불량_사과양해",`교환 받으신 제품에서도 동일한 증상이 발생하여 많이 당황스러우셨을 것 같습니다.\n다시 한 번 불편을 드리게 된 점 진심으로 사과드립니다. 🥲`)}<div class="grp-h">① 무상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1. 충전/전원 불량, 2. 작동 관련 증상(증빙 자료로 판단 가능한 유형 전체)만 아래와 같이 진행</b></div><table class="astbl"><thead><tr><th>재인입</th><th>고객 반품 희망</th><th>고객 교환 희망</th></tr></thead><tbody><tr><td>1차 재인입</td><td>각 불량 유형 기본 flow 대로 진행</td><td>각 불량 유형 기본 flow 대로 진행</td></tr><tr><td>2차 재인입</td><td>회수 후 검수 결과에 따라 처리</td><td>① 정격전압 확인 ㅡ 어댑터 사진 필수<br>② 사진 확인 후 기존 flow 대로 진행</td></tr><tr><td>3차 재인입~</td><td>회수 후 검수 결과에 따라 처리</td><td>회수 후 검수 결과에 따라 처리</td></tr></tbody></table><div class="grp-h">② 유상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1차 유상 교환 접수 시점 기준으로 <span style="color:#E03131">① 2개월 이내 + ② 동일 증상을 충족할 경우에만</span> → 무상 교환 (고객이 원할 경우 수령일로부터 3개월 이내 무상 반품) 처리 가능</b></div><table class="astbl"><thead><tr><th>구분</th><th>예시</th></tr></thead><tbody><tr><td>무상 반품 or 무상 교환<br>가능 ⭕</td><td>① 허리편한케어 V1 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 동일 증상으로 문의</td></tr><tr><td>무상 반품 or 무상 교환<br>불가능 ❌</td><td>① 허리편한케어 V1 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 버튼 불량으로 문의<br><br>② 허리편한케어 V1 전원 불량 증상으로 유상 교환<br>→ 2개월 이후 동일 증상으로 문의</td></tr></tbody></table><div class="grp-h">✔️ 고객이 무상 서비스 요청할 경우 ㅡ 무상 서비스 가능 여부 확인</div><div class="grid2">${macro(`i. 무상 서비스 가능 (2개월 이내 · 동일 증상)`,"유상재불량_2개월이내_가능",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 이전 증상과 동일한 증상으로 확인되며,\n접수 시점 또한 2개월 이내로 확인되어 무상 서비스로 진행 도와드릴 예정입니다.\n\n동일 증상으로 다시 불편을 드리게 되어 다시 한 번 죄송합니다. 🥲\n\n반품 또는 새 제품 교환 중 어떤 방향으로 진행 원하실까요?`)}<div class="stack">${macro(`ii. 무상 서비스 불가능 (2개월 경과)`,"유상재불량_2개월경과_불가",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 해당 기간이 경과된 상태로,\n최초 제품 수령일 기준 품질보증 정책이 적용되어 이전과 동일하게 유상 서비스 대상으로 확인됩니다.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 양해 부탁드립니다. 🙏🏻`)}${macro(`iii. 무상 서비스 불가능 (2개월 이내 · 다른 증상)`,"유상재불량_2개월이내_불가",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 접수 기간은 충족되었으나,\n현재 증상이 기존과 동일 증상으로 확인되지 않아 정책상 무상 서비스 적용이 어려운 점 안내드립니다.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 양해 부탁드립니다. 🙏🏻`)}</div></div></div>

  <div class="h2lvl as-major" id="freeFlow">🛠️ 무상 AS</div><div class="lvl2-body"><div class="h3lvl" id="freeBranch">🔷 무상 교환 안내</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 6개월 이내 제품 자체 고장은 원칙적으로 무상 교환으로 안내</b>

✔️ 만약 고객이 반품을 요청할 경우, 아래 기간에 따라 응대
· 상품 수령일 3개월 이내 → ② 무상 반품 접수
· 상품 수령일 3개월 경과 → ⚠️ [예외] 3개월 경과 건이나 무상 반품 요청 (아래 템플릿 안내)</div><table class="astbl"><thead><tr><th style="width:210px">구분</th><th>안내</th></tr></thead><tbody><tr><td>수령일로부터 3개월 경과건<br>👉🏻 무상 반품 요청할 경우</td><td class="cmp-ment"><span class="tag">#AS_3개월경과_반품요청</span><button class="copy-btn" onclick="copyMacro(this)" title="복사">📋</button><div class="cmp-ment-body">고객님, 이용에 불편을 드려 죄송합니다. 🙏🏻\n확인 결과, 고객님의 제품은 수령일로부터 3개월이 경과한 것으로 확인되었습니다.\n\n슬룸은 공정거래위원회 소비자분쟁해결기준을 토대로, 품질보증기간 내 정상 사용 중 발생한 하자에 대해 기간별 AS 정책을 운영하고 있습니다.\n이에 따라 수령 후 3개월 이후에는 무상 반품이 아닌 무상 교환으로 진행되며, 고객님의 제품도 해당 기준에 따라 동일 제품으로 무상 교환을 도와드리는 점 양해 부탁드립니다.</div></td></tr><tr><td>수령일로부터 3개월 이내<br>👉🏻 무상 반품 요청할 경우</td><td><a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동하여 안내</td></tr></tbody></table>${macro(`💡 상황에 따라서 고객에게 처리방안(교환 or 반품) 선택지를 줘야 하는 경우 아래 템플릿 전송`,"불량AS_처리방안확인",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}<div class="grp-h">a. 포장 및 회수 안내</div>${col("gray",`🔹 전체·부분 동일`,subcard(`포장 · 회수 안내`,"불량AS_포장회수_교환",`불량 증상 확인되어 교환 접수 도와드리겠습니다.\n\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 됩니다.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 슬룸 ]</b> 표기 부탁드립니다.\n\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.`) + caution(`🎁 증정품 회수 X`))}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}<div class="grp-h">b. 검수 및 재출고 안내</div><div class="grid2"><div class="quote-box"><b>⚠️ 유의사항</b>\n① 접수 시간 기준으로 안내 필요\n② 불량으로 인한 재출고는 회수 접수와 동시에 재출고 접수</div>${guide(`🔗 <a href="https://docs.google.com/spreadsheets/d/1t7Oa-rKPY2aYgphNugE5K5gMCP7Hn3joaJYp-bbh7Jw/edit?gid=1012913860#gid=1012913860" target="_blank">[자사/   <div class="lvl2-body"><div class="h3lvl" id="edgeIn">① 품질보증기간(1년) 이내 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 유사 모델을 '유상교환 가격' 으로 구매 안내\n② 고객이 구매를 원하지 않는 경우 단종 보상 기준에 따라 <b>구입가를 자사몰 포인트로 대체 환급</b></div>${macro(`i. 단종 안내 및 유사 제품 추천`,"불량AS_단종이내_유사제품추천",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드립니다.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 이내 유상 교환 기준을 적용한 ({1년 이내 기준 유상금액}+3000)원으로 접수 도와드리겠습니다.\n\n아래 주요 기능과 슬룸 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(슬룸 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 이내 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"불량AS_단종이내_유사제품입금",`네 고객님, 이해해 주셔서 감사합니다. 🙂\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드리겠습니다.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 이내 유상 교환 금액)\n🏦 기업은행 075-09598004-017 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드리겠습니다.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"유상AS_자체폐기안내",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div>${subcard(`i. 유사 제품 구매 미동의_포인트 환급 안내`,"불량AS_단종이내_포인트환급",`고객님, 다시 한번 불편을 드려 죄송합니다.\n다른 제품으로 교환을 원치 않으시다면, 구입가를 공식몰 포인트로 환급해 드리겠습니다.\n포인트는 주문하신 계정과 동일한 계정으로 지급되며, 지급까지는 영업일 기준 1~2일 정도 소요됩니다.`)}</div>${guide(`👉🏻 i. 유사 제품 구매 동의_입금 안내 시 접수 시점에 따라 출고 안내`)}<div class="grid2">${subcard(`i. 월-금 오후 2시 이전 상담`,"불량AS_재출고_금일",`<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 오늘 출고 예정 \n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}${subcard(`ii. 월-목 오후 2시 이후 상담`,"불량AS_재출고_익일",`<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}</div>${macro(`iii. 금요일 오후 2시 이후 상담`,"불량AS_재출고_차주월요일",`<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행`)}</div><div class="h3lvl" id="edgeOut">② 품질보증기간(1년) 경과 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 동일 부위·동일 용도의 유사 제품이 있는지 확인\n<span class="sub-ex">(예: 넥숄더프로 → 넥숄더힐링케어 V2)</span>\n② 유사 제품을 품질보증기간(1년) 경과 유상 교환 비용으로 구매할 수 있도록 안내\n③ 고객이 유사 제품 구매를 원하지 않는 경우, <b>감가상각을 반영한 잔여 금액에 구입가의 10%를 가산</b>하여 자사몰 포인트로 환급</div>${macro(`i. 단종 안내 및 유사 제품 추천`,"불량AS_단종경과_유사제품추천",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드립니다.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 경과 유상 교환 기준을 적용한 ({1년 경과 기준 유상금액}+3000)원으로 접수 도와드리겠습니다.\n\n아래 주요 기능과 슬룸 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(슬룸 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 경과 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"불량AS_단종경과_유사제품입금",`네 고객님, 이해해 주셔서 감사합니다. 🙂\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드리겠습니다.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 경과 유상 교환 금액)\n🏦 기업은행 075-09598004-017 (예금주 : 올릿리테일)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드리겠습니다.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"유상AS_자체폐기안내",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div><div class="flowgroup">${subcard(`i. 유사 제품 구매 미동의_감가상각`,"불량AS_단종경과_감가상각",`고객님, 다시 한번 불편을 드려 죄송합니다.\n문의주신 주문 건은 현재 품질보증기간 1년이 경과한 상태로, 구매 당시 결제 금액과 사용 기간을 반영한 기준에 따라 환급을 도와드리겠습니다.\n고객님께 적용되는 환불 예정 금액은 (환불예정금액)원이며, 영업일 기준 1~2일 정도 소요됩니다.\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주`)}${subcard(`ii. 이후 계좌 정보 확인`,"불량AS_단종경과_계좌확인",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n💸 입금 안내\n영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)}</div></div></div></div>
  ${blueNote(`💰 환급금 계산 가이드`,`<div class="refund-guide-grid"><div style="padding-right:18px">① 구입가 확인\n② 사용개월 확인\n③ 아래 계산식 적용\n\n<b>감가상각비</b> = (사용개월 ÷ 60개월) × 구입가\n<b>잔여금</b> = 구입가 - 감가상각비\n<b>최종 환급금</b> = 잔여금 + 구입가의 10%\n\n※ 슬룸 제품의 내용연수는 60개월로 적용합니다.<div class="quote-box" style="margin-top:14px"><b>예시)</b> 목베개플러스 · 구입가 99,000원 · 구입일 2024년 7월 · AS 문의일 2026년 7월 · 사용기간 24개월\n\n· 감가상각비 = (24개월 ÷ 60개월) × 99,000원 = 39,600원\n· 잔여금 = 99,000원 - 39,600원 = 59,400원\n· 구입가의 10% = 99,000원 × 10% = 9,900원\n· <b>최종 환급금</b> = 59,400원 + 9,900원 = <b>69,300원</b></div></div><div style="padding-left:18px;border-left:2px dashed #C7DAF2"><div class="refund-calc" style="margin-top:0"><div class="refund-calc-h">🧮 자동 계산기 (숫자만 입력)</div><div class="refund-calc-row"><label>구입가</label><input type="text" inputmode="numeric" data-role="price" placeholder="예: 99000" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">원</span></div><div class="refund-calc-row"><label>사용개월</label><input type="text" inputmode="numeric" data-role="months" placeholder="예: 24" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">개월</span></div><div class="refund-calc-err"></div><div class="refund-calc-out"><div><span>감가상각비</span><b data-out="dep">0원</b></div><div><span>잔여금</span><b data-out="rem">0원</b></div><div><span>구입가의 10%</span><b data-out="add">0원</b></div><div class="final"><span>최종 환급금</span><b data-out="final">0원</b></div></div></div></div></div><details class="legal-fold"><summary>※ 관련 기준 보기</summary><p>공정거래위원회 소비자분쟁해결기준에 따라 품질보증기간이 경과한 후 부품보유기간 내 수리가 불가능한 경우, 정액 감가상각한 잔여 금액에 구입가의 10%를 가산하여 환급합니다.</p></details>`)}
  <div class="h2lvl" id="secProof">📸 증빙 제출 불만에 따른 대응</div>
  <div class="lvl2-body"><div class="quote-box"><b>✔️ 증빙(영상/사진)이 필요한 유형이나 지속 미수긍, 불만 제기 시 아래 flow로 진행</b></div><div class="grp-h">① 방어 멘트 1차</div>${guide(`👉 1번, 2번 중 선택하여 사용`)}<div class="grid2"><div>${macro(`1번`,"불량AS_사진영상_방어1차①",`고객님, 촬영 항목이 많아 번거로우신 점 충분히 이해합니다. 🥲\n\n다만 사진만으로는 정확한 불량 원인을 파악하기 어려워, 위 항목 모두 확인이 필요한 점 양해 부탁드립니다.\n항목별로 나눠 찍어 보내주셔도 괜찮습니다.\n\n확인 후 최대한 빠르게 안내드리겠습니다. 🙏`)}</div><div>${macro(`2번`,"불량AS_사진영상_방어1차②",`고객님, 번거로우신 점 충분히 이해합니다. 🥲\n\n다만 채팅으로는 제품 상태를 직접 확인하기 어려워, 정확한 안내를 위해 사진·영상 확인이 필요한 점 양해 부탁드립니다.\n\n위에 안내드린 항목대로 촬영 후 보내주시면 빠르게 확인해 드리겠습니다. 🙏`)}</div></div><div class="grp-h">② 방어 멘트 2차</div>${guide(`👉 ① 방어 멘트 진행 시에도 미수긍할 경우`)}${macro(``,"불량AS_사진영상_방어2차",`영상 촬영이 어려우시다면, 제품을 회수하여 불량 여부를 확인하는 방법도 가능합니다.\n다만 회수 후 검수까지는 아래 절차로 진행되어 영업일 기준 약 1주 소요됩니다.\n\n① 택배 기사 방문 수거\n② 물류센터 입고\n③ 검수 부서 불량 확인\n\n검수 결과에 따라 불량이 확인되면 교환·반품 중 원하시는 방향으로 처리해 드리며, 정상 제품은 즉시 반송 처리됩니다.\n시간이 다소 소요되는 만큼, 채팅으로 영상을 보내주시는 것이 가능하실까요? 🙏`)}<div class="grp-h">③ 채팅 상담 유지 안내 (지금 촬영 불가 시)</div>${guide(`ex. 영상 미첨부로 촬영 후 재인입해야하거나, 채팅 전송 영상 미흡으로 재 촬영 필요 시 모두 포함`)}${macro(``,"불량AS_사진영상_채팅유지",`고객님, 지금 바로 첨부가 어려우시다면\n앞서 안내드린 항목을 참고하여 촬영 후 편하신 시간에 전송 부탁드립니다.\n\n💡 채팅창은 유지되며, 닫으신 후 다시 열어도 이어서 상담 가능합니다.`)}<div class="grid2">${guide(`⚠️ 단, 아래와 같은 경우에는 [채팅 상담 유지 안내] 후 채널톡 보류 처리로 진행\n(예시) 상담 중 촬영이 어려운 상황 / 외부에 있어 확인이 어려운 경우 등`)}<div class="quote-box"><b>📌 상담 보류 처리 기준</b>\n· 보류 기간 : 상담 진행 내일 오전까지\n→ 해당 기간 내 회신이 없을 경우, 장시간 무응답 매크로를 활용하여 상담 종료\n· 고객이 기존 보류 채팅창이 아닌 새로운 채팅창으로 재문의할 수 있음\n→ 해당 경우, 중복 상담 매크로를 활용하여 보류 및 상담 종료\n※ 매크로 사용 시 상황에 맞게 멘트 수정 필수</div></div><div class="grp-h">④ 회수 후 검수로 진행 안내 (①, ②, ③ 미수긍 시)</div><div class="grid2"><div class="quote-box"><b>👉 ①, ②, ③ 미수긍 시에만 제품 회수 후 물류센터 검수 절차로 진행</b>\n\n· 고객 희망하는 처리 방안(반품 or 교환)은 채널톡 워크플로우 및 우측 메모리값에서 확인 가능</div><div class="quote-box"><b>· 물류센터(품고 또는 정석) 별도반출&불량 검수 시트에 취합 후 검수 결과에 따라</b>\n✔️ '정상'일 경우 → 고객 주소로 반송\n✔️ '불량'일 경우 → 고객 원하는 방향으로 '교환' 또는 '반품' 처리\n\n👉🏻 물류센터별 시트 바로가기\n① <a href="https://docs.google.com/spreadsheets/d/1ZgqMOaFfBW60cln1V6oVRRSmjEeNjZSJrlf1ytdM5V4/edit?pli=1&amp;gid=1560630591#gid=1560630591" target="_blank">[품고/올릿] 별도반출&불량 검수</a>\n② <a href="https://docs.google.com/spreadsheets/d/1X7-VBL7xA8UWJtdHh5elOtYrDaA-qwtrrvc0qrM5_eU/edit?gid=0#gid=0" target="_blank">[정석/올릿] 별도반출&불량 검수</a></div></div>${macro(``,"불량AS_사진영상_회수검수안내",`네 고객님, 불편을 드려 죄송합니다. 🙏🏻\n\n번거로우시겠지만 회수 후 검수 절차로 진행해 드리겠습니다.\n아래 순서로 진행되며 불량 확인까지 영업일 기준 약 1주 소요됩니다.\n\n① 택배 기사 방문 수거\n② 물류센터 입고\n③ 검수 부서 불량 확인\n\n검수 결과 불량 확인 시 교환/반품 중 원하시는 방향으로 처리해 드리며, 정상 제품일 경우엔 즉시 고객님 주소로 반송 처리됩니다.\n최대한 빠르게 진행될 수 있도록 담당 부서에 요청해두겠으며, 검수 결과 확인되는 대로 고객님 연락처로 연락 드리겠습니다.`)}<div class="grp-h">🔴 수거 미수긍/불만 제기 시 — 1번 또는 2번 중 선택</div><div class="grid2"><div>${macro(`1번`,"불량AS_사진영상_수거불만①",`최대한 빠르게 도움드리고 싶으나, \n수거 후 물류센터 입고 및 검수 절차로 진행되어 시간이 다소 소요되는 점 양해 부탁드립니다.\n\n안내드린 기간보다 지연될 경우 별도로 연락드리겠습니다. 🙏🏻`)}</div><div>${macro(`2번`,"불량AS_사진영상_수거불만②",`전자제품 특성상 정확한 불량 확인을 위해 수거 후 검수 절차를 거치고 있어 시간이 다소 소요되는 점 양해 부탁드립니다.\n\n최대한 빠르게 처리될 수 있도록 담당 부서에 요청해두겠으며, \n안내드린 기간보다 지연될 경우 별도로 연락드리겠습니다. 🙏🏻`)}</div></div><div class="grp-h">💸 고객 반품 요청 & 결제수단 무통장/가상계좌일 경우에만, 환불 계좌 선탐색</div>${macro(``,"불량AS_사진영상_계좌확인",`(결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n불량으로 확정 시 환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주`)}${guide(`👉🏻 이후, <a class="jump-link" href="#exNoEvid" onclick="return jumpTo('exNoEvid')">✨ [예외] 증빙 미제출</a>로 이동하여 이어 진행`)}</div>
  <div class="h2lvl" id="exNoEvid">✨ [예외] 증빙 미제출</div>
  <div class="lvl2-body"><div class="quote-box"><b>✔️ 사진/영상 확인 시, 정상 제품으로 확인되거나 사용법 문제로 확인될 경우 → 증상별 올바른 사용법 재안내 후 재사용 시도 유도</b>\n⚠️ 아래 flow는 사진/영상 촬영 지속 미수긍으로 회수 후 검수 예외 처리 진행에 동의한 경우에만 이어서 안내</div><div class="h3lvl">❌ 검수 결과 — 불량 확인</div><div class="lvl3-body">${guide(`※ 채널톡 이전 상담 내역에 교환/반품 처리 방안 확인`)}<div class="grp-h">A. 고객 반품 요청 · 반품 안내 유저챗 발송</div><div class="grid2">${macro(`i. 카드 / 삼성페이 / 네이버페이`,"불량AS_검수결과_카드",`안녕하세요 고객님, 슬룸 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n전액 환불로 처리해 드리겠습니다.\n\n카드 승인 취소(환불 완료)까지 영업일 기준 3~5일 소요될 수 있습니다.\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 슬룸 채팅 상담 <a href="https://sloom.channel.io/home" target="_blank">https://sloom.channel.io/home</a>\n월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`)}${macro(`ii. 계좌 환불 (무통장/가상계좌)`,"불량AS_검수결과_계좌환불",`안녕하세요 고객님, 슬룸 고객센터입니다.\n\n요청하신 제품의 '검수 결과'를 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n전액 환불로 처리해 드리겠습니다.\n\n접수 시 말씀해주신 고객님 명의 계좌로 환불 등록해 드렸으며,\n입금까지 영업일 기준 1~2일 소요될 수 있는 점 참고 부탁드립니다.\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 슬룸 채팅 상담 <a href="https://sloom.channel.io/home" target="_blank">https://sloom.channel.io/home</a>\n월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`)}</div><div class="grp-h">B. 고객 교환 요청 · 재출고 안내 유저챗 발송</div>${macro(`재출고 안내`,"불량AS_검수결과_재출고_익일",`안녕하세요 고객님, 슬룸 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n교환 제품은 접수 시 요청하신 주소로 발송 예정입니다.\n\n🚚 재출고 일정\n· 출고 : 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 슬룸 채팅 상담 <a href="https://sloom.channel.io/home" target="_blank">https://sloom.channel.io/home</a>\n월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`,`👉 최초 AS 문의 flow 인입 시 회수지 정보가 사전 저장되므로 이전 상담 내역 확인\n\n\n💡 회수/검수 후 재발송 건의 경우, 물류센터(품고 또는 정석) 전산에서 별도 등록`)}</div><div class="h3lvl">⭕ 검수 결과 — 정상 제품</div><div class="lvl3-body">${macro(`알림톡 / 유저챗 발송`,"불량AS_검수결과_정상발송",`안녕하세요 고객님, 슬룸 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 정상\n\n※ 정상 제품은 수거 시 등록된 주소로 재발송 진행 예정이며, \n시간이 다소 소요되어 불편을 드린 점 대단히 죄송합니다.\n\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 슬룸 채팅 상담 <a href="https://sloom.channel.io/home" target="_blank">https://sloom.channel.io/home</a>\n월–금 09:30-17:00 (점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`,`✔️ 필요 시, 알리고 템플릿 등록 예정`)}</div></div>

  <div class="h2lvl" id="autoPickup">🍏 [외부몰] 자동수거 : 쿠팡, 스마트스토어 등</div>

📷 고객님, 정확한 불량 증상 확인을 위해

3️⃣ 케이블선 제거 후 제품 버튼을 눌러도 작동하지 않는 장면`)}</div><div class="grid2">${subcard(`🔌 어댑터 정격전압 추가 확인 요청`,"CELAS_12",`고객님, 첨부해주신 사진/영상은 확인되었습니다 🙂
다만, 정격전압 확인이 어려워 어댑터의 ( 5V 2A or 5V 1A ) 표기가 보이도록 추가 촬영 부탁드립니다 🙏🏽

※ 숫자와 표기가 선명하게 보이도록 가까이서 촬영 부탁드립니다.`)}</div>${guide(`<b>👉🏻 증빙(사진·영상) 확인 완료 시 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동</b>`)}</div></div><div class="typ" id="t2"><span class="tnum">2</span>작동/제작 불량</div><div class="lvl3-body">${caution(`⚠️ 제품별 작동/제작 증상은 상이 (진동 미작동 · LED 안 켜짐 · 롤링 불량 · 부속품(토출구·카트리지 등) 불량) 하며 충전/전원 불량이 아닌 사진/영상으로 확인 가능한 모든 작동/제작 불량을 포함함.`)}${macro(`i. 사진/영상 확인`,"CELAS_작동_증빙",`📷 고객님, 정확한 불량 증상 확인을 위해\n번거로우시겠지만 아래 2가지가 모두 확인되도록 촬영 부탁드립니다.\n\n1️⃣ 불량 증상이 나타나는 장면 (작동 시도 영상)\n2️⃣ 충전기(어댑터) 정격전압의 5V 2A 표시\n※ 정격전압이 아닌 충전기 사용 시 제품 오작동 및 고장의 원인이 될 수 있어 확인이 필요한 점 양해 부탁드립니다.`)}${guide(`<b>👉🏻 증빙(사진·영상) 확인 완료 시 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동</b>`)}</div></div>

  <div class="lvl2-body"><div class="typ" id="t6"><span class="tnum">4</span>스크래치/이물질</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"CELAS_스크래치_사진요청",`고객님, 번거로우시겠지만 수령하신 제품의 (스크래치·이물질) 상태가 확인되도록 사진을 보내주시면 빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"CELAS_스크래치_처리불가",`제품 (스크래치·이물질)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"CELAS_스크래치_예외",`고객님, 앞서 안내드린 것처럼 제품 (스크래치·이물질)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 스크래치·이물질 상태가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">② 고객 요청 처리 방안 확인</div>${macro(`고객 요청 처리 방안 확인`,"CELAS_스크래치_방향",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}${guide(`⚠️ 상품수령일로부터 7일 이내 스크래치/이물질은 고객이 원하는 처리 방안(교환 또는 반품) 확인 후 진행 (단, 기간별 정책에 따라만 진행 가능)\n👉🏻 교환 요청 시 <a class="jump-link" href="#freeBranch" onclick="return jumpTo('freeBranch')">🔷 무상 교환 안내</a> 로 이동\n👉🏻 반품 요청 시 <a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동`)}</div><div class="typ" id="t5"><span class="tnum">5</span>구성품 누락</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"CELAS_구성품_사진요청",`고객님, 번거로우시겠지만 수령하신 제품의 구성품 전체가 확인되도록 사진을 보내주시면 \n빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"CELAS_구성품_처리불가",`구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"CELAS_구성품_예외",`고객님, 앞서 안내드린 것처럼 구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 구성품 전체가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">2️⃣ 별도 재출고 안내</div>${macro(`i. 별도 재출고 안내`,"CELAS_구성품_재출고",`확인 감사합니다.\n이용에 불편을 드려 정말 죄송합니다.\n누락된 (구성품명)은 재출고로 진행해 드리겠습니다.`)}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`)}${macro(`iii. 출고 시일 소요 안내`,"CELAS_구성품_출고시일",`확인 감사합니다.\n\n🚚 재출고 일정 안내드리겠습니다.\n\n· 출고 : 영업일 2일 이내\n· 배송 : 접수일로부터 영업일 5~6일 소요\n· 택배사 : CJ대한통운\n\n※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 양해 부탁드립니다.`,`▶ 상담 종료 후 <a href="https://docs.google.com/spreadsheets/d/1Bj5stx8hXMoPL8L91EYu6e5TA7pqEAjges4Cejs1wjo/edit?gid=388846546#gid=388846546" target="_blank">수기출고 통합 시트</a> - 자사 제품 신청 탭\n\n⚠️ 본품 전체 출고일 경우, '※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 양해 부탁드립니다.' 문구 삭제 필요`)}<div class="grp-h">🔔 [예외케이스] 구성품 누락으로 전체 반품 희망</div><div class="quote-box"><b>상품 개봉 여부와 무관하게 제품 회수 및 전액 환불 처리로 진행</b></div>${macro(`i. 포장 및 회수 안내`,"CELAS_구성품_전액환불",`<b>전액 환불 접수 도와드리겠습니다.</b>\n\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.` + caution(`🎁 증정품 회수 O`))}<div class="grp-h">② 결제수단별 환불 안내</div><div class="grid2">${col("blue","◆ 카드결제",subcard(`i. 카드결제 취소`,"CELAS_구성품_환불카드",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있습니다.\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`))}${col("pink","◆ 계좌 환불",`<div class="stack">`+subcard(`i. 계좌 환불 (무통장·가상계좌)`,"CELAS_구성품_환불계좌1",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`)+subcard(`ii. 이후 계좌 정보 확인`,"CELAS_구성품_환불계좌2",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)+`</div>`)}</div></div></div>
  <div class="h2lvl" id="t4">🔁 재불량 (교환품 동일 증상)</div>
  <div class="lvl2-body">${caution(`👉 [예시] 2026.01.01 셀뉴머 아이언 충전 불량으로 무상 교환 진행 → 2026.03.02 교환 제품에서 동일 증상(충전 불량)으로 재문의`)}<div class="grp-h">💡 공통 안내</div>${macro(`i. 사과·양해 멘트`,"CELAS_재불량_사과",`교환 받으신 제품에서도 동일한 증상이 발생하여 많이 당황스러우셨을 것 같습니다.\n다시 한 번 불편을 드리게 된 점 진심으로 사과드립니다. 🥲`)}<div class="grp-h">① 무상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1. 충전/전원 불량 2. 작동/제작 불량만 아래와 같이 진행</b></div><table class="astbl"><thead><tr><th>재인입</th><th>고객 반품 희망</th><th>고객 교환 희망</th></tr></thead><tbody><tr><td>1차 재인입</td><td>각 불량 유형 기본 flow 대로 진행</td><td>각 불량 유형 기본 flow 대로 진행</td></tr><tr><td>2차 재인입</td><td>회수 후 검수 결과에 따라 처리</td><td>① 정격전압 확인 ㅡ 어댑터 사진 필수<br>② 사진 확인 후 기존 flow 대로 진행</td></tr><tr><td>3차 재인입~</td><td>회수 후 검수 결과에 따라 처리</td><td>회수 후 검수 결과에 따라 처리</td></tr></tbody></table><div class="grp-h">② 유상 교환 후 동일 증상 재인입</div><div class="quote-box"><b>1차 유상 교환 접수 시점 기준으로 <span style="color:#E03131">① 2개월 이내 + ② 동일 증상을 충족할 경우에만</span> → 무상 교환 (고객이 원할 경우 수령일로부터 3개월 이내 무상 반품) 처리 가능</b></div><table class="astbl"><thead><tr><th>구분</th><th>예시</th></tr></thead><tbody><tr><td>무상 반품 or 무상 교환<br>가능 ⭕</td><td>① 셀뉴머 아이언 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 동일 증상으로 문의</td></tr><tr><td>무상 반품 or 무상 교환<br>불가능 ❌</td><td>① 셀뉴머 아이언 전원 불량 증상으로 유상 교환<br>→ 2개월 이내 버튼 불량으로 문의<br><br>② 셀뉴머 아이언 전원 불량 증상으로 유상 교환<br>→ 2개월 이후 동일 증상으로 문의</td></tr></tbody></table><div class="grp-h">✔️ 고객이 무상 서비스 요청할 경우 ㅡ 무상 서비스 가능 여부 확인</div><div class="grid2">${macro(`i. 무상 서비스 가능 (2개월 이내 · 동일 증상)`,"CELAS_유상재불량_가능",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 이전 증상과 동일한 증상으로 확인되며,\n접수 시점 또한 2개월 이내로 확인되어 무상 서비스로 진행 도와드릴 예정입니다.\n\n동일 증상으로 다시 불편을 드리게 되어 다시 한 번 죄송합니다. 🥲\n\n반품 또는 새 제품 교환 중 어떤 방향으로 진행 원하실까요?`)}<div class="stack">${macro(`ii. 무상 서비스 불가능 (2개월 경과)`,"CELAS_유상재불량_불가경과",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 해당 기간이 경과된 상태로,\n최초 제품 수령일 기준 품질보증 정책이 적용되어 이전과 동일하게 유상 서비스 대상으로 확인됩니다.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 양해 부탁드립니다. 🙏🏻`)}${macro(`iii. 무상 서비스 불가능 (2개월 이내 · 다른 증상)`,"CELAS_유상재불량_불가증상",`유상 교환 이후에는 동일 증상 발생 시 2개월 이내에 한하여 무상 서비스가 지원되고 있습니다.\n\n고객님의 경우 접수 기간은 충족되었으나,\n현재 증상이 기존과 동일 증상으로 확인되지 않아 정책상 무상 서비스 적용이 어려운 점 안내드립니다.\n\n도움드리지 못해 죄송하며,\n이전과 동일하게 유상 서비스로 진행 가능한 점 양해 부탁드립니다. 🙏🏻`)}</div></div></div>
  <div class="h1lvl" id="step2"><span class="num">3</span>AS 접수</div>
  <div class="h2lvl as-major" id="freeFlow">🛠️ 무상 AS</div><div class="lvl2-body"><div class="h3lvl" id="freeBranch">🔷 무상 교환 안내</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 6개월 이내 제품 자체 고장은 원칙적으로 무상 교환으로 안내</b>

✔️ 만약 고객이 반품을 요청할 경우, 아래 기간에 따라 응대
· 상품 수령일 3개월 이내 → ② 무상 반품 접수
· 상품 수령일 3개월 경과 → ⚠️ [예외] 3개월 경과 건이나 무상 반품 요청 (아래 템플릿 안내)</div><table class="astbl"><thead><tr><th style="width:210px">구분</th><th>안내</th></tr></thead><tbody><tr><td>수령일로부터 3개월 경과건<br>👉🏻 무상 반품 요청할 경우</td><td class="cmp-ment"><span class="tag">#CELAS_3개월경과_반품요청</span><button class="copy-btn" onclick="copyMacro(this)" title="복사">📋</button><div class="cmp-ment-body">고객님, 이용에 불편을 드려 죄송합니다. 🙏🏻\n확인 결과, 고객님의 제품은 수령일로부터 3개월이 경과한 것으로 확인되었습니다.\n\n셀올로지는 공정거래위원회 소비자분쟁해결기준을 토대로, 품질보증기간 내 정상 사용 중 발생한 하자에 대해 기간별 AS 정책을 운영하고 있습니다.\n이에 따라 수령 후 3개월 이후에는 무상 반품이 아닌 무상 교환으로 진행되며, 고객님의 제품도 해당 기준에 따라 동일 제품으로 무상 교환을 도와드리는 점 양해 부탁드립니다.</div></td></tr><tr><td>수령일로부터 3개월 이내<br>👉🏻 무상 반품 요청할 경우</td><td><a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동하여 안내</td></tr></tbody></table>${macro(`💡 상황에 따라서 고객에게 처리방안(교환 or 반품) 선택지를 줘야 하는 경우 아래 템플릿 전송`,"CELAS_3개월경과_처리방안선택",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}<div class="grp-h">a. 포장 및 회수 안내</div>${col("gray",`🔹 전체·부분 동일`,subcard(`포장 · 회수 안내`,"CELAS_무상교환_포장",`불량 증상 확인되어 교환 접수 도와드리겠습니다.\n\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상: {상담마다 회수가 필요한 제품을 확인하여 직접 기재}\n※ 회수 대상 제품의 구성품(케이블·설명서 등)도 모두 함께 포장해 주세요.\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 됩니다.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 셀올로지 ]</b> 표기 부탁드려요.\n\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.`) + caution(`🎁 증정품 회수 X`))}${macro(`회수지 확인 필요 시`,"공통_교환_회수지확인",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`)}<div class="grp-h">b. 검수 및 재출고 안내</div><div class="grid2"><div class="quote-box"><b>⚠️ 유의사항</b>\n① 접수 시간 기준으로 안내 필요\n② 불량으로 인한 재출고는 회수 접수와 동시에 재출고 접수</div>${guide(`🔗 <a href="https://docs.google.com/spreadsheets/d/1t7Oa-rKPY2aYgphNugE5K5gMCP7Hn3joaJYp-bbh7Jw/edit?gid=1012913860#gid=1012913860" target="_blank">[자사/외부몰] 통합 교환/반품 관리</a> 시트에 리스트업 필수!\n👉🏻 회수·재출고 자동 등록   <div class="lvl2-body"><div class="h3lvl" id="edgeIn">① 품질보증기간(1년) 이내 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 유사 모델을 '유상교환 가격' 으로 구매 안내\n② 고객이 구매를 원하지 않는 경우 단종 보상 기준에 따라 <b>구입가를 자사몰 포인트로 대체 환급</b></div>${macro(`i. 단종 안내 및 유사 제품 추천`,"CELAS_단종이내_안내",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드립니다.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 이내 유상 교환 기준을 적용한 ({1년 이내 기준 유상금액}+3000)원으로 접수 도와드리겠습니다.\n\n아래 주요 기능과 셀올로지 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(셀올로지 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 이내 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"CELAS_단종이내_입금",`네 고객님, 이해해 주셔서 감사합니다. 🙂\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드리겠습니다.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 이내 유상 교환 금액)\n🏦 기업은행 078-219021-04-021 (예금주 : 더마)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드리겠습니다.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"CELAS_단종이내_폐기",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div>${subcard(`i. 유사 제품 구매 미동의_포인트 환급 안내`,"CELAS_단종이내_미동의",`고객님, 다시 한번 불편을 드려 죄송합니다.\n다른 제품으로 교환을 원치 않으시다면, 구입가를 공식몰 포인트로 환급해 드리겠습니다.\n포인트는 주문하신 계정과 동일한 계정으로 지급되며, 지급까지는 영업일 기준 1~2일 정도 소요됩니다.`)}</div>${guide(`👉🏻 i. 유사 제품 구매 동의_입금 안내 시 접수 시점에 따라 출고 안내`)}<div class="grid2">${subcard(`i. 월-금 오후 2시 이전 상담`,"CELAS_단종이내_출고A",`<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 오늘 출고 예정 \n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}${subcard(`ii. 월-목 오후 2시 이후 상담`,"CELAS_단종이내_출고B",`<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 오늘 출고 마감으로 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운`)}</div>${macro(`iii. 금요일 오후 2시 이후 상담`,"CELAS_단종이내_출고C",`<b>🚚 교환 제품 재출고 일정 안내드리겠습니다.</b>\n\n· 출고 : 오늘 출고 마감으로 차주 월요일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n※ 주말/공휴일 출고 미진행`)}</div><div class="h3lvl" id="edgeOut">② 품질보증기간(1년) 경과 단종</div><div class="lvl3-body"><div class="quote-box"><b>📌 응대 가이드</b>\n동일 제품이 단종되어 교환이 불가능한 경우 적용\n① 동일 부위·동일 용도의 유사 제품이 있는지 확인\n② 유사 제품을 품질보증기간(1년) 경과 유상 교환 비용으로 구매할 수 있도록 안내\n③ 고객이 유사 제품 구매를 원하지 않는 경우, <b>감가상각을 반영한 잔여 금액에 구입가의 10%를 가산</b>하여 자사몰 포인트로 환급</div>${macro(`i. 단종 안내 및 유사 제품 추천`,"CELAS_단종경과_안내",`고객님, 현재 해당 제품은 단종되어 동일 제품으로는 교환이 어려운 점 양해 부탁드립니다.\n\n다만 현재 판매 중인 제품 가운데 사용하시던 제품의 기능과 사용 목적을 종합적으로 고려하여 가장 유사한 (추천 제품명)을 추천드립니다.\n\n사용을 원하신다면, (추천 제품명)을 품질보증기간(1년) 경과 유상 교환 기준을 적용한 ({1년 경과 기준 유상금액}+3000)원으로 접수 도와드리겠습니다.\n\n아래 주요 기능과 셀올로지 공식몰 판매 페이지를 확인해 보시고, 편하게 말씀해 주세요.\n\n(셀올로지 자사몰 추천 제품 판매 페이지 바로가기 첨부)\n(채널톡 내 부위별 제품 주요 차이점 이미지 첨부)`)}${guide(`💡 1년 경과 유상 비용 금액으로 반영`)}<div class="grid2"><div class="flowgroup">${subcard(`i. 유사 제품 구매 동의_입금 안내`,"CELAS_단종경과_입금",`네 고객님, 이해해 주셔서 감사합니다. 🙂\n구매를 원하시는 제품 금액과 배송비를 아래 계좌로 입금해 주시면 확인 후 출고를 도와드리겠습니다.\n\n<b>💳 입금 금액</b>\n• 배송비 : 3,000원\n• (제품명) : (품질보증기간 1년 경과 유상 교환 금액)\n🏦 기업은행 078-219021-04-021 (예금주 : 더마)\n\n입금 후 입금자명을 말씀해 주시면 확인 후 접수 도와드리겠습니다.`)}${subcard(`ii. 기존 제품 자체폐기 안내`,"CELAS_단종경과_폐기",`기존 제품은 별도 회수 없이, 고객님께서 자체 폐기해 주시면 감사하겠습니다.`)}</div><div class="flowgroup">${subcard(`i. 유사 제품 구매 미동의_감가상각`,"CELAS_단종경과_미동의",`고객님, 다시 한번 불편을 드려 죄송합니다.\n문의주신 주문 건은 현재 품질보증기간 1년이 경과한 상태로, 구매 당시 결제 금액과 사용 기간을 반영한 기준에 따라 환급을 도와드리겠습니다.\n고객님께 적용되는 환불 예정 금액은 (환불예정금액)원이며, 영업일 기준 1~2일 정도 소요됩니다.\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주`)}${subcard(`ii. 이후 계좌 정보 확인`,"CELAS_단종경과_계좌확인",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n💸 입금 안내\n영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)}</div></div></div></div>
  ${blueNote(`💰 환급금 계산 가이드`,`<div class="refund-guide-grid"><div style="padding-right:18px">① 구입가 확인\n② 사용개월 확인\n③ 아래 계산식 적용\n\n<b>감가상각비</b> = (사용개월 ÷ 60개월) × 구입가\n<b>잔여금</b> = 구입가 - 감가상각비\n<b>최종 환급금</b> = 잔여금 + 구입가의 10%\n\n※ 셀올로지 제품의 내용연수는 60개월로 적용합니다.<div class="quote-box" style="margin-top:14px"><b>예시)</b> 셀뉴머 아이언 · 구입가 299,000원 · 구입일 2024년 7월 · AS 문의일 2026년 7월 · 사용기간 24개월\n\n· 감가상각비 = (24개월 ÷ 60개월) × 299,000원 = 119,600원\n· 잔여금 = 299,000원 - 119,600원 = 179,400원\n· 구입가의 10% = 299,000원 × 10% = 29,900원\n· <b>최종 환급금</b> = 179,400원 + 29,900원 = <b>209,300원</b></div></div><div style="padding-left:18px;border-left:2px dashed #C7DAF2"><div class="refund-calc" style="margin-top:0"><div class="refund-calc-h">🧮 자동 계산기 (숫자만 입력)</div><div class="refund-calc-row"><label>구입가</label><input type="text" inputmode="numeric" data-role="price" placeholder="예: 99000" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">원</span></div><div class="refund-calc-row"><label>사용개월</label><input type="text" inputmode="numeric" data-role="months" placeholder="예: 24" oninput="this.value=this.value.replace(/[^0-9]/g,'');calcRefund(this)"><span class="unit">개월</span></div><div class="refund-calc-err"></div><div class="refund-calc-out"><div><span>감가상각비</span><b data-out="dep">0원</b></div><div><span>잔여금</span><b data-out="rem">0원</b></div><div><span>구입가의 10%</span><b data-out="add">0원</b></div><div class="final"><span>최종 환급금</span><b data-out="final">0원</b></div></div></div></div></div><details class="legal-fold"><summary>※ 관련 기준 보기</summary><p>공정거래위원회 소비자분쟁해결기준에 따라 품질보증기간이 경과한 후 부품보유기간 내 수리가 불가능한 경우, 정액 감가상각한 잔여 금액에 구입가의 10%를 가산하여 환급합니다.</p></details>`)}
  <div class="h2lvl" id="secProof">📸 증빙 제출 불만에 따른 대응</div>
  <div class="lvl2-body"><div class="quote-box"><b>✔️ 증빙(영상/사진)이 필요한 유형이나 지속 미수긍, 불만 제기 시 아래 flow로 진행</b></div><div class="grp-h">① 방어 멘트 1차</div>${guide(`👉 1번, 2번 중 선택하여 사용`)}<div class="grid2"><div>${macro(`1번`,"증빙대응_방어1_1번",`고객님, 촬영 항목이 많아 번거로우신 점 충분히 이해합니다. 🥲\n\n다만 사진만으로는 정확한 불량 원인을 파악하기 어려워, 위 항목 모두 확인이 필요한 점 양해 부탁드립니다.\n항목별로 나눠 찍어 보내주셔도 괜찮습니다.\n\n확인 후 최대한 빠르게 안내드리겠습니다. 🙏`)}</div><div>${macro(`2번`,"증빙대응_방어1_2번",`고객님, 번거로우신 점 충분히 이해합니다. 🥲\n\n다만 채팅으로는 제품 상태를 직접 확인하기 어려워, 정확한 안내를 위해 사진·영상 확인이 필요한 점 양해 부탁드립니다.\n\n위에 안내드린 항목대로 촬영 후 보내주시면 빠르게 확인해 드리겠습니다. 🙏`)}</div></div><div class="grp-h">② 방어 멘트 2차</div>${guide(`👉 ① 방어 멘트 진행 시에도 미수긍할 경우`)}${macro(``,"증빙대응_방어2",`영상 촬영이 어려우시다면, 제품을 회수하여 불량 여부를 확인하는 방법도 가능합니다.\n다만 회수 후 검수까지는 아래 절차로 진행되어 영업일 기준 약 1주 소요됩니다.\n\n① 택배 기사 방문 수거\n② 물류센터 입고\n③ 검수 부서 불량 확인\n\n검수 결과에 따라 불량이 확인되면 교환·반품 중 원하시는 방향으로 처리해 드리며, 정상 제품은 즉시 반송 처리됩니다.\n시간이 다소 소요되는 만큼, 채팅으로 영상을 보내주시는 것이 가능하실까요? 🙏`)}<div class="grp-h">③ 채팅 상담 유지 안내 (지금 촬영 불가 시)</div>${guide(`ex. 영상 미첨부로 촬영 후 재인입해야하거나, 채팅 전송 영상 미흡으로 재 촬영 필요 시 모두 포함`)}${macro(``,"증빙대응_채팅유지",`고객님, 지금 바로 첨부가 어려우시다면\n앞서 안내드린 항목을 참고하여 촬영 후 편하신 시간에 전송 부탁드립니다.\n\n💡 채팅창은 유지되며, 닫으신 후 다시 열어도 이어서 상담 가능합니다.`)}<div class="grid2">${guide(`⚠️ 단, 아래와 같은 경우에는 [채팅 상담 유지 안내] 후 채널톡 보류 처리로 진행\n(예시) 상담 중 촬영이 어려운 상황 / 외부에 있어 확인이 어려운 경우 등`)}<div class="quote-box"><b>📌 상담 보류 처리 기준</b>\n· 보류 기간 : 상담 진행 내일 오전까지\n→ 해당 기간 내 회신이 없을 경우, 장시간 무응답 매크로를 활용하여 상담 종료\n· 고객이 기존 보류 채팅창이 아닌 새로운 채팅창으로 재문의할 수 있음\n→ 해당 경우, 중복 상담 매크로를 활용하여 보류 및 상담 종료\n※ 매크로 사용 시 상황에 맞게 멘트 수정 필수</div></div><div class="grp-h">④ 회수 후 검수로 진행 안내 (①, ②, ③ 미수긍 시)</div><div class="grid2"><div class="quote-box"><b>👉 ①, ②, ③ 미수긍 시에만 제품 회수 후 물류센터 검수 절차로 진행</b>\n\n· 고객 희망하는 처리 방안(반품 or 교환)은 채널톡 워크플로우 및 우측 메모리값에서 확인 가능</div><div class="quote-box"><b>· 물류센터(품고 또는 정석) 별도반출&불량 검수 시트에 취합 후 검수 결과에 따라</b>\n✔️ '정상'일 경우 → 고객 주소로 반송\n✔️ '불량'일 경우 → 고객 원하는 방향으로 '교환' 또는 '반품' 처리\n\n👉🏻 물류센터별 시트 바로가기\n① <a href="https://docs.google.com/spreadsheets/d/1ZgqMOaFfBW60cln1V6oVRRSmjEeNjZSJrlf1ytdM5V4/edit?pli=1&amp;gid=1560630591#gid=1560630591" target="_blank">[품고/올릿] 별도반출&불량 검수</a>\n② <a href="https://docs.google.com/spreadsheets/d/1X7-VBL7xA8UWJtdHh5elOtYrDaA-qwtrrvc0qrM5_eU/edit?gid=0#gid=0" target="_blank">[정석/올릿] 별도반출&불량 검수</a></div></div>${macro(``,"증빙대응_회수검수",`네 고객님, 불편을 드려 죄송합니다. 🙏🏻\n\n번거로우시겠지만 회수 후 검수 절차로 진행해 드리겠습니다.\n아래 순서로 진행되며 불량 확인까지 영업일 기준 약 1주 소요됩니다.\n\n① 택배 기사 방문 수거\n② 물류센터 입고\n③ 검수 부서 불량 확인\n\n검수 결과 불량 확인 시 교환/반품 중 원하시는 방향으로 처리해 드리며, 정상 제품일 경우엔 즉시 고객님 주소로 반송 처리됩니다.\n최대한 빠르게 진행될 수 있도록 담당 부서에 요청해두겠으며, 검수 결과 확인되는 대로 고객님 연락처로 연락 드리겠습니다.`)}<div class="grp-h">🔴 수거 미수긍/불만 제기 시 — 1번 또는 2번 중 선택</div><div class="grid2"><div>${macro(`1번`,"증빙대응_수거불만_1번",`최대한 빠르게 도움드리고 싶으나, \n수거 후 물류센터 입고 및 검수 절차로 진행되어 시간이 다소 소요되는 점 양해 부탁드립니다.\n\n안내드린 기간보다 지연될 경우 별도로 연락드리겠습니다. 🙏🏻`)}</div><div>${macro(`2번`,"증빙대응_수거불만_2번",`전자제품 특성상 정확한 불량 확인을 위해 수거 후 검수 절차를 거치고 있어 시간이 다소 소요되는 점 양해 부탁드립니다.\n\n최대한 빠르게 처리될 수 있도록 담당 부서에 요청해두겠으며, \n안내드린 기간보다 지연될 경우 별도로 연락드리겠습니다. 🙏🏻`)}</div></div><div class="grp-h">💸 고객 반품 요청 & 결제수단 무통장/가상계좌일 경우에만, 환불 계좌 선탐색</div>${macro(``,"증빙대응_환불계좌선탐색",`(결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n불량으로 확정 시 환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주`)}${guide(`👉🏻 이후, <a class="jump-link" href="#exNoEvid" onclick="return jumpTo('exNoEvid')">✨ [예외] 증빙 미제출</a>로 이동하여 이어 진행`)}</div>
  <div class="h2lvl" id="exNoEvid">✨ [예외] 증빙 미제출</div>
  <div class="lvl2-body"><div class="quote-box"><b>✔️ 사진/영상 확인 시, 정상 제품으로 확인되거나 사용법 문제로 확인될 경우 → 증상별 올바른 사용법 재안내 후 재사용 시도 유도</b>\n⚠️ 아래 flow는 사진/영상 촬영 지속 미수긍으로 회수 후 검수 예외 처리 진행에 동의한 경우에만 이어서 안내</div><div class="h3lvl">❌ 검수 결과 — 불량 확인</div><div class="lvl3-body">${guide(`※ 채널톡 이전 상담 내역에 교환/반품 처리 방안 확인`)}<div class="grp-h">A. 고객 반품 요청 · 반품 안내 유저챗 발송</div><div class="grid2">${macro(`i. 카드 / 삼성페이 / 네이버페이`,"CELAS_증빙불량_반품카드",`안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n전액 환불로 처리해 드리겠습니다.\n\n카드 승인 취소(환불 완료)까지 영업일 기준 3~5일 소요될 수 있습니다.\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 셀올로지 채팅상담 \n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`)}${macro(`ii. 계좌 환불 (무통장/가상계좌)`,"CELAS_증빙불량_반품계좌",`안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 '검수 결과'를 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n전액 환불로 처리해 드리겠습니다.\n\n접수 시 말씀해주신 고객님 명의 계좌로 환불 등록해 드렸으며,\n입금까지 영업일 기준 1~2일 소요될 수 있는 점 참고 부탁드립니다.\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 셀올로지 채팅상담 \n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`)}</div><div class="grp-h">B. 고객 교환 요청 · 재출고 안내 유저챗 발송</div>${macro(`재출고 안내`,"CELAS_증빙불량_교환재출고",`안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 불량\n\n교환 제품은 접수 시 요청하신 주소로 발송 예정입니다.\n\n🚚 재출고 일정\n· 출고 : 내일 출고 예정\n· 배송 : 출고일로부터 영업일 기준 2~3일 소요\n· 택배사 : CJ대한통운\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 셀올로지 채팅상담 \n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`,`👉 최초 AS 문의 flow 인입 시 회수지 정보가 사전 저장되므로 이전 상담 내역 확인\n\n\n💡 회수/검수 후 재발송 건의 경우, 물류센터 전산에서 별도 등록`)}</div><div class="h3lvl">⭕ 검수 결과 — 정상 제품</div><div class="lvl3-body">${macro(`알림톡 / 유저챗 발송`,"CELAS_증빙정상_발송",`안녕하세요 고객님, 셀올로지 고객센터입니다.\n\n요청하신 제품의 검수 결과 안내드립니다.\n\n■ 제품명 :\n■ 확인 결과 : 정상\n\n※ 정상 제품은 수거 시 등록된 주소로 재발송 진행 예정이며, \n시간이 다소 소요되어 불편을 드린 점 대단히 죄송합니다.\n\n\n추가 문의 사항이 있으실 경우 아래 채널을 통해 문의 부탁드립니다.\n\n👉🏻 셀올로지 채팅상담 \n(※ 월–금 09:30-17:00 / 점심시간 12:30-13:30 / 주말·공휴일 휴무)\n\n다시 한번 이용에 불편을 드려 대단히 죄송합니다.`,`✔️ 필요 시, 알리고 템플릿 등록 예정`)}</div></div>

  <div class="h2lvl" id="cosmetic">🔷 [디바이스 외_화장품]</div>

다만, 정격전압 확인이 어려워 어댑터의 5V 1A 표기가 보이도록 추가 촬영 부탁드립니다 🙏🏽

※ 숫자와 표기가 선명하게 보이도록 가까이서 촬영 부탁드립니다.`)}</div>${guide(`<b>👉🏻 증빙(사진·영상) 확인 완료 시 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동</b>`)}</div><div class="grp-h">🔷 작동 관련 증상</div>${caution(`⚠️ 제품별 작동 관련 증상은 상이 (버튼으로 바람 세기 조절이 안됨, 강도 조절이 안됨 등) 하며 충전/전원 불량이 아닌 사진/영상으로 확인 가능한 모든 작동 불량을 포함함.`)}${macro(`i. 사진/영상 확인`,"",`📷 고객님, 정확한 불량 증상 확인을 위해\n번거로우시겠지만 아래 2가지가 모두 확인되도록 촬영 부탁드립니다.\n\n1️⃣ 불량 증상이 나타나는 장면 (작동 시도 영상)\n2️⃣ 충전기(어댑터) 정격전압의 5V 1A 표시\n※ 정격전압이 아닌 충전기 사용 시 제품 오작동 및 고장의 원인이 될 수 있어 확인이 필요한 점 양해 부탁드립니다.`)}${guide(`<b>👉🏻 증빙(사진·영상) 확인 완료 시 <a class="jump-link" href="#step2" onclick="return jumpTo('step2')">3. AS 접수</a>로 이동</b>`)}</div><div class="typ" id="t3"><span class="tnum">2</span>진동/EMS 강도</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 유의사항</b>\n✔️ 본 유형은 진동·EMS 체감 강도 관련 문의에만 적용\n→ 고객 체감에 따른 문의로 사진·영상만으로는 확인이 어려운 유형이므로, 증빙(사진·영상)은 요청하지 않습니다.\n✔️ '리프핏 아이' 제품은 진동 불량(눈가 진동이 느껴지지 않음) 문의 시 응대 기준이 다릅니다.\n→ 아래 제품에 맞는 템플릿을 선택하여 안내\n🔷 리프핏 아이&nbsp;&nbsp;&nbsp;🔷 그 외 제품</div><table style="border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:13px"><thead><tr><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 적용 예시</th><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 미적용 예시 (작동 불량 등으로 진행)</th></tr></thead><tbody><tr><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">눈가 진동이 안느껴져요. EMS 자극이 없어요 등</td><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">온도·강도 조절 버튼 불량 / EMS 단계 조절 기능 자체 불량 등</td></tr></tbody></table><div class="grp-h">🔷 리프핏 아이</div><div class="quote-box"><b>⚠️ 리프핏 아이(눈가 진동 미체감)는 일반 불량 프로세스와 상이</b>\n· 최초 문의 : 사용법 안내 후 최소 2주 사용 권장\n· 이후 동일 증상 또는 고객 미수긍 시 품질보증기간 기준 교환 접수\n· 회수&검수 안내는 동일하지만, 실제 운영은 회수 완료 후 재출고 교환으로 진행 (검수 결과에 따른 정상/불량 판정 없음)</div><div class="grp-h">① 올바른 사용법 안내</div>${macro(``,"",`리프핏아이 제품은 EMS 미세전류를 방출하여 근육에 자극을 주는 제품입니다. \n제품의 충전 상태나 크림 사용 여부, 기기 밀착 여부, 피부 컨디션 등에 따라서 자극이 달라질 수 있어요. \n\n눈가에 진동이 느껴지지 않는다면, 아래 방법으로 다시 한번 사용해 주세요. 🖤\n\n☑️ STEP 1.\n먼저 5V 1A 어댑터를 사용하여 제품을 완전히 충전해 주세요.\n충전이 완료되면 초록색 LED로 변경됩니다. 💡\n※ 고속 충전기 사용 시 제품 고장 우려가 있어요. \n동봉된 USB 충전 케이블을 사용하여 5V 1A 어댑터 또는 PC·노트북 USB 포트에 연결해 충전해 주세요.\n\n☑️ STEP 2.\n리프핏 크림을 기기 패드와 사용하실 눈가에 충분히 발라주세요.\n💡 크림을 사용하지 않으면 자극이 잘 전달되지 않을 수 있으니 꼭 함께 사용해 주세요.\n\n☑️ STEP 3.\n기기 패드가 눈가에 완전히 밀착되도록 손으로 가볍게 눌러 착용한 후, 전원 버튼을 2초 이상 길게 눌러 작동해 주세요.\n\n✨ 특히 처음 사용하시는 경우에는 자극이 약하게 느껴질 수 있으니, \n위 사용법에 따라 최소 2주 정도 다시 한번 꾸준히 사용해 보시는 것을 권장드려요. 🖤\n\n🔗 사용법이 더 궁금하시다면 아래 영상을 참고해 주세요.\n👉 올바른 사용법 영상: https://youtu.be/39-OW24rb74?feature=shared`)}<div class="grp-h">② 고객 수긍 여부에 따른 안내</div><div class="grid2"><div>${macro(`고객 수긍`,"",`네, 고객님. 😊\n리프핏 크림과 함께 안내드린 방법대로 사용해 보신 후에도 자극이 전혀 느껴지지 않는다면 언제든 다시 문의해 주세요.\n\n확인 후 추가 안내 도와드릴게요. 🖤`,`👉🏻 고객 수긍 시 상담 종결 유도`)}</div><div>${macro(`고객 미수긍 1차`,"",`고객님, 불량 여부를 확인하려면 제품 회수 후 검수가 필요하며, 완료까지 영업일 기준 7일 이상 소요될 수 있어요. 💦\n\n\n리프핏 아이는 사용 초기에 자극이 약하게 느껴질 수 있는 제품 특성이 있어, 안내드린 방법대로 최소 2주 정도 꾸준히 사용해 보신 후에도 자극이 전혀 느껴지지 않는다면 다시 문의 부탁드려요.\n\n그때에도 동일한 증상이 있다면 확인 절차를 자세히 안내 도와드릴게요. 🖤`)}${macro(`고객 최종 미수긍`,"",`고객님, 제품 사용 중 불편을 드려 다시 한번 죄송합니다. 💦\n수거 이후 새로운 제품으로 재출고 접수 도와 드리도록 하겠습니다.`)}</div></div>${guide(`💡 기존 무상 교환과 다르게, 리프핏 아이의 무상 교환의 경우 \n회수&재출고 동시 진행이 아닌, 기존 제품 수거 완료 이후 재출고 처리!`)}${guide(`👉🏻 이후 <a class="jump-link" href="#freeFlow" onclick="return jumpTo('freeFlow')">🛠️ 무상 AS</a>로 이동하여 flow 대로 진행`)}<div class="grp-h">🔷 그 외 제품</div><div class="quote-box"><b>📌  리프핏 아이 외 제품의 진동·EMS 강도 불량 문의</b>\n→ 제품별 올바른 사용법(정격전압·크림 사용 등) 안내 후 재사용 권장\n→ 올바른 방법으로 사용 후에도 동일 증상을 지속 주장하는 경우 제품 회수·검수 후 결과에 따라 처리합니다. (채팅 상담으로 증상 확인 불가)\n\n⚠️ 단, ALF·워크플로우에서 관련 안내가 완료된 경우에는아래 제품별 유의사항 중복 안내를 생략하고, Flow 및 고객 증빙을 확인하여 미확인 사항만 추가 확인</div><div class="grp-h">① 올바른 사용법 안내</div><div class="quote-box"><b>제품별 유의사항은 <a href="https://docs.google.com/spreadsheets/d/1OwcLG2XuwPUHt7grmSIjpWsZqU8MAhWPrcp-RVykLMI/edit?gid=826394219#gid=826394219" target="_blank">[얼라인랩] 제품별 사용법 템플릿</a> 시트 또는 채널톡 매크로 이용</b></div><div class="grid2"><div>${macro(``,"",`고객님, 문의주신 (제품명)의 올바른 사용법 먼저 안내드립니다.\n\n(제품명)은  EMS 미세전류를 방출하여 근육에 자극을 주는 제품입니다. \n제품의 충전 상태나 크림 사용 여부, 기기 밀착 여부, 피부 컨디션 등에 따라서 자극이 달라질 수 있어요. \n\n자극이 느껴지지 않는다면, 안내드린 사용법으로 다시 한번 사용해 주세요. 🖤`)}</div><div>${macro(`리프핏 숄더`,"",`리프핏숄더 제품은 EMS 미세전류를 방출하여 근육에 자극을 주는 제품입니다. \n제품의 충전 상태나 크림 사용 여부, 기기 밀착 여부, 피부 컨디션 등에 따라서 자극이 달라질 수 있어요. \n\n자극이 느껴지지 않는다면, 아래 방법으로 다시 한번 사용해 주세요. 🖤\n\n☑️ STEP 1.\n먼저 5V 1A 어댑터를 사용하여 제품을 완전히 충전해 주세요.\n충전이 완료되면 초록색 LED로 변경됩니다. 💡\n※ 고속 충전기 사용 시 제품 고장 우려가 있어요. \n동봉된 USB 충전 케이블을 사용하여 5V 1A 어댑터 또는 PC·노트북 USB 포트에 연결해 충전해 주세요.\n\n☑️ STEP 2.\n리프핏 크림을 기기 패드와 사용하실 눈가에 충분히 발라주세요.\n💡 크림을 사용하지 않으면 자극이 잘 전달되지 않을 수 있으니 꼭 함께 사용해 주세요.\n\n☑️ STEP 3.\n기기 패드가 눈가에 완전히 밀착되도록 손으로 가볍게 눌러 착용한 후, 전원 버튼을 2초 이상 길게 눌러 작동해 주세요.\n\n✨ 승모근과 어깨 근육 상태에 따라 EMS 자극은 부위별로 다르게 느껴질 수 있어요.\n리프핏 숄더는 15단계 강도 조절이 가능하니, 체감에 맞는 강도로 설정해 안내드린 방법대로 최소 2주 정도 꾸준히 사용해 보시길 권장드려요. 🖤`)}${macro(``,"",`네, 고객님. 😊\n안내드린 방법대로 사용해 보신 후에도 자극이 전혀 느껴지지 않는다면 언제든 다시 문의해 주세요.\n\n확인 후 추가 안내 도와드릴게요. 🖤`,`👉🏻 고객 수긍 해결`)}</div></div>${guide(`✨ 리프핏 숄더는 전용 크림(리프핏 바디 크림)을 사용하는 제품으로 EMS 강도 문의는 아래 별도 사용법 템플릿 사용`)}${macro(``,"",`혹시 사용법대로 진행하셨음에도 문제가 지속되었을까요?`,`👉🏻 올바른 사용법 안내 후 바로 송출`)}<div class="grp-h">② 회수·검수 안내</div>${macro(`고객 미수긍 (ex. 그래도 안돼요!)`,"",`고객님, 말씀해 주신 증상은 사진이나 영상만으로는 정확한 불량 여부를 확인하기 어렵습니다. 🥲\n\n번거로우시겠지만 회수 후 검수 절차로 진행해 드리겠습니다.\n아래 순서로 진행되며 불량 확인까지 영업일 기준 약 1주 소요됩니다.\n\n① 택배 기사 방문 수거\n② 물류센터 입고\n③ 검수 부서 불량 확인\n\n검수 결과 불량 확인 후 무상 교환으로 진행되며, 정상 제품일 경우엔 즉시 고객님 주소로 반송 처리됩니다.\n최대한 빠르게 진행될 수 있도록 담당 부서에 요청해두겠으며, 검수 결과 확인되는 대로 고객님 연락처로 연락 드리겠습니다.`)}${guide(`👉🏻 이후 <a class="jump-link" href="#freeFlow" onclick="return jumpTo('freeFlow')">🛠️ 무상 AS</a>로 이동하여 flow 대로 진행`)}</div></div>
  <div class="h2lvl as-sub" id="groupB">B. 사용법 안내 불필요</div>
  <div class="lvl2-body"><div class="typ" id="tsound"><span class="tnum">3</span>소음 강도 &amp; 쿠팡/네이버 자동수거</div><div class="lvl3-body"><div class="grid2"><div class="quote-box"><b>✔️ 소음 강도 불량</b>\n① 사용자의 '체감 강도(소음)' 관련 문의만 해당함\n→ 육안으로 확인이 어려운 유형으로, 사진/영상 요청은 진행하지 않음\n② 사진/영상으로 확인 불가하므로 회수·검수 후 결과에 따라 진행</div><div class="quote-box"><b>✔️ 쿠팡/네이버 스마트스토어 자동수거 건</b>\n① 쿠팡·네이버 스마트스토어 고객 직접 신청 건 중 자동 수거 진행 중인 건\n→ 각 어드민에서 자동 수거 진행 여부를 확인\n② 자동 수거 진행 중엔 철회가 어려우므로, 회수·검수 후 결과에 따라 처리 가능함을 안내</div></div><table style="border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:13px"><thead><tr><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 소리 강도 불량 적용 예시</th><th style="background:#9BBB59;color:#fff;padding:9px 12px;text-align:left;border:1px solid #d9d9d9">👉 소리 강도 불량 미적용 예시 (작동 불량 등으로 진행)</th></tr></thead><tbody><tr><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">소리가 너무 커요 등</td><td style="padding:9px 12px;border:1px solid #d9d9d9;vertical-align:top">작동 시 발생하는 비정상 잡음 등</td></tr></tbody></table><div class="grp-h">① 회수 및 검수 과정 안내</div>${macro(`✨ 쿠팡/네이버 스마트스토어 자동수거일 경우 제품 회수 중임을 안내`,"",`네, 고객님. (쿠팡 또는 네이버)를 통해 회수 진행 중인 점 확인되었습니다.\n다만, 상품이 물류센터에 입고된 뒤 검수 절차를 거쳐야 하므로 즉시 처리는 어려운 점 양해 부탁드립니다. 🙏🏻\n\n회수 완료 후 영업일 기준 2~3일 정도 소요될 수 있으니 참고 부탁드립니다.`)}${guide(`💡 자동수거 물류센터 회수 내역 조회는 입고 완료 후에만 조회됨\n회수중 상태에서는 물류센터(품고 또는 정석)에서 조회되지 않음`)}<div class="grid2"><div>${macro(`소리 강도 불량`,"",`고객님, (제품명)은 작동 시 일정 수준의 기계적 소음이 발생할 수 있으나, 정상 범위를 벗어나는 소음으로 제품 이상이 의심되시는 경우에는 정확한 확인이 필요합니다.\n\n다만, 죄송하게도 말씀해주신 증상은 사진이나 영상만으로는 정확한 불량 여부를 판단하기 어려운 증상입니다. 🥲\n\n보다 정확한 확인을 위해 제품 회수 후 검수를 진행해 드리고자 합니다.\n\n📦 검수 절차\n· 택배 기사 방문 후 제품 회수\n· 물류센터 입고 및 담당부서에서 검수 진행\n※ 영업일 기준 최대 2주 소요\n\n🔎 검수 결과\n· 불량 확인 시 : (품질 보증 기준에 따라 처리 방안 기재)\n· 정상 제품 확인 시 : 제품 반송\n\n검수에는 다소 시간이 소요되는 점 양해 부탁드립니다.\n검수 완료 후 안내받으실 연락처를 남겨주시면, 최대한 신속하게 처리될 수 있도록 담당 부서에도 전달하겠습니다. 🙏🏻`)}${guide(`물류센터(품고 또는 정석) 별도반출&불량 검수 시트에 취합 후 검수 결과에 따라\n✔️ '정상'일 경우 → 고객 주소로 반송\n✔️ '불량'일 경우 → 품질보증기간 정책에 따라 진행\n\n👇🏻 고객 회수·검수에 대해 불만 제기할 경우 ② 검수 소요기간 불만 시 참고하여 진행\n\n👉🏻 물류센터별 시트 바로가기\n① <a href="https://docs.google.com/spreadsheets/d/1ZgqMOaFfBW60cln1V6oVRRSmjEeNjZSJrlf1ytdM5V4/edit?pli=1&amp;gid=1560630591#gid=1560630591" target="_blank">[품고/올릿] 별도반출&불량 검수</a>\n② <a href="https://docs.google.com/spreadsheets/d/1X7-VBL7xA8UWJtdHh5elOtYrDaA-qwtrrvc0qrM5_eU/edit?gid=0#gid=0" target="_blank">[정석/올릿] 별도반출&불량 검수</a>`)}</div><div>${macro(`쿠팡/네이버 스마트스토어 자동수거`,"",`물류센터로 고객님의 제품이 입고되면,\n접수해 주신 증상을 바탕으로 검수를 진행하여 최종 불량 여부를 확인하게 됩니다.\n\n📦 제품 수거 → 검수 → 반품 완료 (환불 승인)\n\n검수는 회수 완료 후 영업일 기준 2~3일 정도 소요되며,\n불량으로 확인될 경우 문자 안내 후 결제하신 수단으로 환불을 도와드리겠습니다.\n\n최대한 빠르게 처리될 수 있도록 노력하겠습니다. 🙂\n\n※ 검수 결과는 문자로 별도 안내드립니다.\n※ 정상 제품으로 확인될 경우에는 제품이 고객님께 반송될 수 있습니다.`)}${guide(`물류센터(품고 또는 정석) 별도반출&불량 검수 시트에 취합 후 검수 결과에 따라\n✔️ '정상'일 경우 → 고객 주소로 반송\n✔️ '불량'일 경우 → 고객 접수한 처리 방안대로 진행\n\n※ 쿠팡 건은 검수 결과 확인 전 쿠팡 자체적으로 기한 내 반품 완료 처리되는 경우가 대부분\n→ 고객 별도 안내 불필요, 시스템만 인지하고 이해하기!\n\n👉🏻 추후 검수 결과에 따라 <a class="jump-link" href="#exNoEvid" onclick="return jumpTo('exNoEvid')">✨ [예외] 증빙 미제출</a> flow 대로 진행\n\n👉🏻 물류센터별 시트 바로가기\n① <a href="https://docs.google.com/spreadsheets/d/1ZgqMOaFfBW60cln1V6oVRRSmjEeNjZSJrlf1ytdM5V4/edit?pli=1&amp;gid=1560630591#gid=1560630591" target="_blank">[품고/올릿] 별도반출&불량 검수</a>\n② <a href="https://docs.google.com/spreadsheets/d/1X7-VBL7xA8UWJtdHh5elOtYrDaA-qwtrrvc0qrM5_eU/edit?gid=0#gid=0" target="_blank">[정석/올릿] 별도반출&불량 검수</a>`)}</div></div><div class="grp-h">② 검수 소요기간 불만 시</div><div class="grid2"><div>${macro(`i. 고객 수긍`,"",`고객님, 최대한 빠르게 도움을 드리고 싶지만,\n제품을 회수한 후 검수를 진행해야 정확한 확인이 가능하여 처리까지 다소 시간이 소요될 수 있는 점 양해 부탁드립니다. 🥲\n최대한 신속하게 처리될 수 있도록 노력하겠으며, 안내드린 기간보다 지연되는 경우에는 별도로 연락드리겠습니다.`)}</div><div>${macro(`ii. 고객 미수긍`,"",`네, 고객님. 제품으로 불편을 드려 다시 한번 죄송합니다. 🙏🏻\n제품 전체를 택배 박스에 포장해 주시면, 회수 기사님이 방문하여 수거할 예정입니다.\n\n기존에 상품을 받으신 주소로 회수 접수를 도와드리면 될까요?`)}${macro(`iii. 고객 최종 수긍`,"",`확인되는 대로 고객님께 안내드리겠습니다.\n최대한 빠르게 처리될 수 있도록 담당 부서에도 전달하여 신속히 진행될 수 있도록 요청드리겠습니다. 🙏🏻`)}</div></div>${guide(`※ 사무실 반출 필요 건은 물류센터(품고 또는 정석) 별도반출&불량 검수 요청 시트 M열(구분) 별도반출로 선택 필수 > 매주 화요일에 퀵으로 일괄 반출됨\n\n👉🏻 물류센터별 시트 바로가기\n① <a href="https://docs.google.com/spreadsheets/d/1ZgqMOaFfBW60cln1V6oVRRSmjEeNjZSJrlf1ytdM5V4/edit?pli=1&amp;gid=1560630591#gid=1560630591" target="_blank">[품고/올릿] 별도반출&불량 검수</a>\n② <a href="https://docs.google.com/spreadsheets/d/1X7-VBL7xA8UWJtdHh5elOtYrDaA-qwtrrvc0qrM5_eU/edit?gid=0#gid=0" target="_blank">[정석/올릿] 별도반출&불량 검수</a>`)}${guide(`👉🏻 이후 검수 결과에 따라 <a class="jump-link" href="#exNoEvid" onclick="return jumpTo('exNoEvid')">✨ [예외] 증빙 미제출</a> flow 대로 진행`)}</div><div class="typ" id="t5"><span class="tnum">4</span>구성품 누락</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"",`고객님, 번거로우시겠지만 수령하신 제품의 구성품 전체가 확인되도록 사진을 보내주시면 \n빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"",`구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"",`고객님, 앞서 안내드린 것처럼 구성품 누락의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 구성품 전체가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">2️⃣ 별도 재출고 안내</div>${macro(`i. 별도 재출고 안내`,"",`확인 감사합니다.\n이용에 불편을 드려 정말 죄송합니다.\n누락된 (구성품명)은 재출고로 진행해 드리겠습니다.`)}${macro(`회수지 확인 필요 시`,"",`🙋‍♀️ 마지막으로, 제품 회수와 배송은 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}${macro(`iii. 출고 시일 소요 안내`,"",`확인 감사합니다.\n\n🚚 재출고 일정 안내드리겠습니다.\n\n· 출고 : 영업일 2일 이내\n· 배송 : 접수일로부터 영업일 5~6일 소요\n· 택배사 : CJ대한통운\n\n※ 구성품만 별도 출고되는 경우에는 다소 시간이 소요될 수 있는 점 양해 부탁드립니다.`,`▶ 상담 종료 후 <a href="https://docs.google.com/spreadsheets/d/1Bj5stx8hXMoPL8L91EYu6e5TA7pqEAjges4Cejs1wjo/edit?gid=388846546#gid=388846546" target="_blank">수기출고 통합 시트</a> - 자사 제품 신청 탭\n\n⚠️ 본품 전체 출고일 경우, ※문구 삭제 필요`)}<div class="grp-h">🔔 [예외케이스] 구성품 누락으로 전체 반품 희망</div><div class="quote-box"><b>상품 개봉 여부와 무관하게 제품 회수 및 전액 환불 처리로 진행</b></div>${macro(`i. 포장 및 회수 안내`,"",`<b>전액 환불 접수 도와드리겠습니다.</b>\n\n\n<b>📦 <b>제품 포장 안내</b></b>\n■ 회수 대상 : {상담마다 직접 회수 필요한 제품 확인하여 기재}\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 얼라인랩 ]</b> 표기 부탁드립니다.\n\n\n<b>🚚 <b>회수 안내</b></b>\n· 택배사 : CJ대한통운 \n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.` + caution(`🎁 증정품 회수 O`))}<div class="grp-h">② 결제수단별 환불 안내</div><div class="grid2">${col("blue","◆ 카드결제",subcard(`i. 카드결제 취소`,"",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있습니다.\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`))}${col("pink","◆ 계좌 환불",`<div class="stack">`+subcard(`i. 계좌 환불 (무통장·가상계좌)`,"",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`)+subcard(`ii. 이후 계좌 정보 확인`,"",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)+`</div>`)}</div></div><div class="typ" id="t6"><span class="tnum">5</span>이염/오염/초도파손/스크래치</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 영업일 7일 이내 문의 시에만 처리 가능</b></div><div class="grp-h">① 배송 완료일자 확인</div><div class="grid2">${macro(`i. 수령일로부터 영업일 7일 이내 · 사진 전송 요청`,"",`고객님, 번거로우시겠지만 수령하신 제품의 (이염·오염·파손) 상태가 확인되도록 사진을 보내주시면 빠르게 확인 후 안내드리겠습니다. 🙏🏻`)}${macro(`ii. 수령일로부터 영업일 7일 경과 · 처리 불가 안내`,"",`제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n고객님 주문 건의 경우 접수 가능 기간이 경과되어 처리가 어려운 점 양해 부탁드립니다. 🥲`)}</div>${guide(`▶ 고객 강하게 미수긍 시 예외 처리 진행`)}${macro(`예외 처리 안내 & 사진 전송 요청`,"",`고객님, 앞서 안내드린 것처럼 제품 (이염·오염·파손)의 경우, 제품 수령 후 영업일 기준 7일 이내에 문의 주셔야 처리가 가능합니다.\n다만, 불편하셨던 상황 충분히 이해되어 이번 건은 예외적으로 도와드리겠습니다.\n\n번거로우시겠지만, 수령하신 제품의 이염·오염 상태가 확인되도록 사진 전송 부탁드립니다.\n확인 후 안내드리겠습니다. 🙏🏻`)}<div class="grp-h">② 고객 요청 처리 방안 확인</div>${macro(`고객 요청 처리 방안 확인`,"",`불편을 드려 죄송합니다. 🥲\n새 제품으로 교환 또는 반품 중 원하시는 방식으로 도움드리고 있습니다.\n어느 쪽으로 진행해 드릴까요?`)}${guide(`⚠️ 상품수령일로부터 7일 이내 이염/오염/초도파손은 고객이 원하는 처리 방안(교환 또는 반품) 확인 후 진행 (단, 기간별 정책에 따라만 진행 가능)\n👉🏻 교환 요청 시 <a class="jump-link" href="#freeBranch" onclick="return jumpTo('freeBranch')">🔷 무상 교환 안내</a> 로 이동\n👉🏻 반품 요청 시 <a class="jump-link" href="#freePack" onclick="return jumpTo('freePack')">🔷 무상 반품 안내</a> 로 이동`)}</div></div>
  <div class="h2lvl" id="t4">🔁 재불량 (교환품 동일 증상)</div>
  <div class="lvl2-body">${caution(`👉 [예시] 2026.01.01 리프핏 아이 충전 불량으로 무상 교환 진행 → 2026.03.02 교환 제품에서 동일 증상(충전 불량)으로 재문의\n⚠️ 2번 연속으로 동일 증상 불량 주장 건(충전 불량으로 교환 받은 제품이 또 충전 불량 주장)의 경우 추가적인 교환 없이 반품 진행`)}<div class="grp-h">💡 공통 안내</div>${macro(`i. 사과·양해 멘트`,"",`교환 받으신 제품에서도 동일한 증상이 발생하여 많이 당황스러우셨을 것 같습니다.\n다시 한 번 불편을 드리게 된 점 진심으로 사과드립니다. 🥲`)}${macro(`① 반품 접수 안내`,"",`해당 제품 반품으로 도와드리고자 합니다.\n\n📦 <b>제품 포장 안내</b>\n■ 회수 대상 : {상담마다 직접 회수 필요한 제품 확인하여 기재}\n※ 사은품·증정품 및 그 외 구매한 부속품과 제품은 보내지 않으셔도 됩니다.\n\n✍🏽 택배 박스 윗면에 <b>[ 불량 / CJ대한통운 / 얼라인랩 ]</b> 표기 부탁드립니다.\n\n🚚 <b>회수 안내</b>\n· 택배사 : CJ대한통운\n· 영업일 기준 2~3일 내 방문\n\n방문 전 택배사 알림톡 또는 택배 기사 연락이 있을 예정이며, 택배 기사 방문 시 직접 전달 또는 문 앞 보관 부탁드립니다.\n\n💡 택배·제품 자체 박스가 없는 경우, 대체 가능한 택배 박스에 포장해주세요.\n⚠️ 박스 포장이 아닐 경우 수거 거부됩니다.`)}<div class="grid2">${macro(`회수지 확인 필요 시`,"",`🙋‍♀️ 마지막으로, 제품 회수는 기존 주소지로 접수해 드리면 될까요?`,`워크플로우로 인입된 건은 연결 전 정보가 수집되어 별도 확인 불필요 → 사전 수집 안 된 건에만 이 멘트 사용`)}${macro(`네이버 스마트스토어 직접 반품 신청 시`,"",`네이버를 통해 반품 기사님을 신청해 주신 점 확인되었습니다. :)\n미개봉 제품은 전체 다시 택배 박스에 포장해 주시고, 기사님 방문 시 전달해 주시면 수거가 진행될 예정입니다.`)}</div>${macro(`② 교환이 아닌 반품 진행에 대한 의문 시 추가 안내`,"",`교환 받으신 제품도 동일한 불량 증상 의심되는 상황이시라면,\n동일한 증상이 계속된다면 제품이 고객님과 잘 맞지 않는 것으로 보여 더 이상 번거롭지 않으시도록 전액 반품으로 도와드릴게요. ♥`,`고객 미수긍 시에만 해당 안내 멘트 발송`)}<div class="grp-h">③ 결제수단별 환불 안내</div><div class="grid2">${col("blue","◆ 카드결제",subcard(`i. 카드결제 취소`,"",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n결제수단에 따라 실제 카드 승인 취소(환불 완료)까지는\n반품 완료 시점으로부터 영업일 기준 3~6일 추가 소요될 수 있습니다.\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`))}${col("pink","◆ 계좌 환불",`<div class="stack">`+subcard(`i. 계좌 환불 (무통장·가상계좌)`,"",`환불은 아래 절차를 거쳐 진행되며,\n영업일 기준 약 6~8일 정도 소요됩니다.\n<b>📦 제품 수거 → 검수 → 반품 완료 (환불 승인)</b>\n\n\n다만, (결제수단 안내 - 무통장 입금 or 가상계좌 결제)로 결제해주신 점 확인되어,\n환불을 위해 아래 계좌 정보 전달 부탁드립니다.\n\n🏦 은행 / 계좌번호 / 예금주\n\n이용에 불편을 드려 다시 한 번 죄송합니다.`)+subcard(`ii. 이후 계좌 정보 확인`,"",`소중한 정보 확인 감사합니다.\n해당 계좌로 환불 계좌 등록이 완료되었습니다.\n\n<b>💸 입금 안내</b>\n실제 반품 완료 처리 후 영업일 기준 1~2일 내 입금 예정\n\n※ 은행 점검 시간 또는 공휴일에 따라 입금이 지연될 수 있습니다.`)+`</div>`)}</div></div>
  <div class="h1lvl" id="step2"><span class="num">3</span>AS 접수</div>
  <div class="h2lvl as-major" id="freeFlow">🛠️ 무상 AS</div><div class="lvl2-body"><div class="h3lvl" id="freeBranch">🔷 무상 교환 안내</div><div class="lvl3-body"><div class="quote-box"><b>⚠️ 상품 수령일로부터 6개월 이내 제품 자체 고장은 원칙적으로 무상 교환으로 안내</b>

✔️ 만약 고객이 반품을 요청할 경우, 아래 기간에 따라 응대
